name = "builder-server"
repository = "github.com/decentraland/builder-server"
revision = "98897af692f26063a088aebb2ea5bb3f683168a2"
database_env = "BUILDER_SERVER_DATABASE_URL"
after = []
notes = """
Imports collection and item drafts (a collection's published and approved
state is not imported, the node derives it), item contents, the virtual
third parties, collection and item curations, collection events and slot
usage cheques. See MAPPING.md.

Prerequisite, out of scope for a DB import: every item content hash must be
in the blob store's builder tree (<STORAGE_ROOT_FOLDER>/builder) and
recorded, with its size, in
dcl_migration.blob_inventory (source 'builder-server', object_key = hash);
item_content stops on a missing hash of an item it writes.

Not migrated: projects, asset_packs, assets, deployments,
pools, pool_groups, pool_likes (no target), the collections' managers,
minters and reviewed_at columns (no target column). collection_publications
stays the node's.

No step has a watermark: published/curation state is derived from other
tables, so every run re-scans. dcl_migration.builder_imported records each
collection, item, virtual third party and curation the import wrote, with a
fingerprint of the node row. A collection with its items and their curations
is one unit: a re-run updates a unit from upstream only while every row of it
still matches its fingerprint, under the node's locks, and never re-creates a
row the node deleted. Deletions upstream are not detected.
"""

[[step]]
name = "collection"
targets = ["builder.collections"]
extract = "collection.extract.sql"
load = "collection.load.sql"
key = ["id"]
columns = [
  { name = "id", type = "uuid" },
  { name = "name", type = "text" },
  { name = "eth_address", type = "text" },
  { name = "salt", type = "text" },
  { name = "contract_address", type = "text" },
  { name = "urn_suffix", type = "text" },
  { name = "third_party_id", type = "text" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
  { name = "linked_contract_address", type = "text" },
  { name = "linked_contract_network", type = "text" },
  { name = "lock", type = "timestamp" },
  { name = "forum_link", type = "text" },
  { name = "forum_id", type = "integer" },
]

[[step]]
name = "item"
targets = ["builder.items"]
extract = "item.extract.sql"
load = "item.load.sql"
key = ["id"]
columns = [
  { name = "id", type = "uuid" },
  { name = "collection_id", type = "uuid" },
  { name = "eth_address", type = "text" },
  { name = "name", type = "text" },
  { name = "description", type = "text" },
  { name = "thumbnail", type = "text" },
  { name = "video", type = "text" },
  { name = "type", type = "text" },
  { name = "rarity", type = "text" },
  { name = "price", type = "text" },
  { name = "beneficiary", type = "text" },
  { name = "data", type = "json" },
  { name = "metrics", type = "json" },
  { name = "utility", type = "text" },
  { name = "mappings", type = "jsonb" },
  { name = "urn_suffix", type = "text" },
  { name = "blockchain_item_id", type = "text" },
  { name = "is_published", type = "boolean" },
  { name = "total_supply", type = "bigint" },
  { name = "local_content_hash", type = "text" },
  { name = "content_hash", type = "text" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "item_content"
targets = ["builder.uploaded_contents", "builder.item_contents"]
extract = "item_content.extract.sql"
load = "item_content.load.sql"
key = ["item_id", "file"]
columns = [
  { name = "item_id", type = "uuid" },
  { name = "file", type = "text" },
  { name = "hash", type = "text" },
  { name = "owner", type = "text" },
  { name = "position", type = "integer" },
  { name = "item_updated_at", type = "timestamptz" },
]

[[step]]
name = "virtual_third_party"
targets = ["builder.virtual_third_parties"]
extract = "virtual_third_party.extract.sql"
load = "virtual_third_party.load.sql"
key = ["id"]
columns = [
  { name = "id", type = "text" },
  { name = "managers", type = "text[]" },
  { name = "raw_metadata", type = "text" },
  { name = "is_programmatic", type = "boolean" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "collection_curation"
targets = ["builder.collection_curations"]
extract = "collection_curation.extract.sql"
load = "collection_curation.load.sql"
key = ["id"]
whole = true
columns = [
  { name = "id", type = "uuid" },
  { name = "collection_id", type = "uuid" },
  { name = "status", type = "text" },
  { name = "assignee", type = "text" },
  { name = "reviewed_by", type = "text" },
  { name = "rejection_reasons", type = "text[]" },
  { name = "rejection_message", type = "text" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "item_curation"
targets = ["builder.item_curations"]
extract = "item_curation.extract.sql"
load = "item_curation.load.sql"
key = ["id"]
whole = true
columns = [
  { name = "id", type = "uuid" },
  { name = "item_id", type = "uuid" },
  { name = "status", type = "text" },
  { name = "content_hash", type = "text" },
  { name = "is_mapping_complete", type = "boolean" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "collection_event"
targets = ["builder.collection_events"]
extract = "collection_event.extract.sql"
load = "collection_event.load.sql"
key = ["id"]
requires = "collection_events"
columns = [
  { name = "id", type = "uuid" },
  { name = "collection_id", type = "uuid" },
  { name = "type", type = "text" },
  { name = "actor", type = "text" },
  { name = "actor_address", type = "text" },
  { name = "payload", type = "jsonb" },
  { name = "created_at", type = "timestamptz" },
]

[[step]]
name = "slot_usage_cheque"
targets = ["builder.slot_usage_cheques"]
extract = "slot_usage_cheque.extract.sql"
load = "slot_usage_cheque.load.sql"
key = ["id"]
whole = true
columns = [
  { name = "id", type = "uuid" },
  { name = "collection_id", type = "uuid" },
  { name = "third_party_id", type = "text" },
  { name = "signature", type = "text" },
  { name = "salt", type = "text" },
  { name = "qty", type = "integer" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]
