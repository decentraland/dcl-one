name = "marketplace-favorites-server"
repository = "github.com/decentraland/marketplace-server"
revision = "cc5baede63cd311ba5f564a3e2909010756bb4ce"
database_env = "MARKETPLACE_FAVORITES_SERVER_DATABASE_URL"
after = []
notes = """The favorites database (schema `favorites`), created by the archived
decentraland/marketplace-favorites-server (e25017ed) and now migrated and
written by marketplace-server (src/migrations/favorites, identical files).
See MAPPING.md. The shared default list (70ab6873-...) is the node's seed and
is not overwritten; picks into it move. A list's grants are replaced by the
source's on every load of that list (upstream bumps updated_at on each grant
change, so --since sees revocations); that is the only delete. Picks removed
upstream after a run are not detected. Not migrated: voting (cached
snapshot voting power; the node does not apply `power`), pgmigrations."""

[[step]]
name = "lists"
targets = ["shop.lists", "shop.list_acl"]
extract = "lists.extract.sql"
load = "lists.load.sql"
key = ["id"]
watermark = "updated_at"
columns = [
  { name = "id", type = "uuid" },
  { name = "name", type = "text" },
  { name = "description", type = "text" },
  { name = "user_address", type = "text" },
  { name = "is_private", type = "boolean" },
  { name = "created_at", type = "timestamptz" },
  { name = "last_updated_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
  { name = "grants", type = "jsonb" },
]

[[step]]
name = "picks"
targets = ["shop.picks"]
extract = "picks.extract.sql"
load = "picks.load.sql"
key = ["list_id", "item_id", "user_address"]
watermark = "created_at"
columns = [
  { name = "list_id", type = "uuid" },
  { name = "item_id", type = "text" },
  { name = "user_address", type = "text" },
  { name = "created_at", type = "timestamptz" },
]
