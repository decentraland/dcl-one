name = "social-service-ea"
repository = "github.com/decentraland/social-service-ea"
revision = "b6b2cefefdf727b2ed47ddb887e77d226a41eea6"
database_env = "SOCIAL_SERVICE_EA_DATABASE_URL"
after = []
notes = """
Friends, blocks, mutes, settings, communities and referral progress; see MAPPING.md.
Imported communities become local authority (origin 'local', with member roles); a
community the upstream mirror already holds is taken over and its social.community_mirror
row is deleted (communities step), and actively banned wallets lose their member row
(community_bans step), to keep the node's invariants.
Not migrated: private_voice_chats (live call state, LiveKit rooms do not move),
community_ranking_metrics and communities.ranking_score (upstream ranking job output, no
writer on the node), community thumbnails (S3 objects, not in this database;
blobs are out of scope). No chat tables live in this database.
"""

[[step]]
name = "user_settings"
targets = ["social.user_settings"]
extract = "user_settings.extract.sql"
load = "user_settings.load.sql"
key = ["address"]
columns = [
  { name = "address", type = "text" },
  { name = "private_messages_privacy", type = "text" },
  { name = "blocked_users_messages_visibility", type = "text" },
  { name = "show_situation_reactions", type = "text" },
]

