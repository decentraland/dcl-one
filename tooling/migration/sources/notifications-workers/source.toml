name = "notifications-workers"
repository = "github.com/decentraland/notifications-workers"
revision = "e2af2eec13a95fd71321822f35d140c6075d98d3"
database_env = "NOTIFICATIONS_DATABASE_URL"
after = []
notes = """See MAPPING.md. Not migrated: `cursors` (upstream producer
checkpoints; the node's producers keep their own), `pgmigrations`.
Left to the node: social.notification_deliveries (no email is re-sent for
imported history), notification_reader_seen, event_notification_intents.
Deletes: opt_out_reconcile and unconfirmed_email_reconcile delete imported
opt-outs and pending emails that upstream no longer holds (only rows this
source wrote, recorded in dcl_migration, and unchanged on the node since)."""

[[step]]
name = "subscription"
targets = ["social.subscriptions"]
extract = "subscription.extract.sql"
load = "subscription.load.sql"
key = ["source_address"]
watermark = "updated_at"
columns = [
  { name = "source_address", type = "text" },
  { name = "address", type = "text" },
  { name = "email", type = "text" },
  { name = "details", type = "jsonb" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "unconfirmed_email"
targets = ["social.unconfirmed_emails"]
extract = "unconfirmed_email.extract.sql"
load = "unconfirmed_email.load.sql"
key = ["source_address"]
watermark = "updated_at"
columns = [
  { name = "source_address", type = "text" },
  { name = "address", type = "text" },
  { name = "email", type = "text" },
  { name = "code", type = "text" },
  { name = "updated_at", type = "timestamptz" },
]

# The whole upstream set in one batch: imported rows it lacks are deleted.
[[step]]
name = "unconfirmed_email_reconcile"
targets = ["social.unconfirmed_emails"]
extract = "unconfirmed_email_reconcile.extract.sql"
load = "unconfirmed_email_reconcile.load.sql"
key = ["source_address"]
whole = true
columns = [
  { name = "source_address", type = "text" },
  { name = "address", type = "text" },
]

[[step]]
name = "opt_out"
targets = ["social.subscription_opt_outs"]
extract = "opt_out.extract.sql"
load = "opt_out.load.sql"
key = ["source_address", "scope", "source_scope_id"]
watermark = "updated_at"
columns = [
  { name = "source_address", type = "text" },
  { name = "scope", type = "text" },
  { name = "source_scope_id", type = "text" },
  { name = "address", type = "text" },
  { name = "scope_id", type = "text" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "opt_out_reconcile"
targets = ["social.subscription_opt_outs"]
extract = "opt_out_reconcile.extract.sql"
load = "opt_out_reconcile.load.sql"
key = ["source_address", "scope", "source_scope_id"]
whole = true
columns = [
  { name = "source_address", type = "text" },
  { name = "scope", type = "text" },
  { name = "source_scope_id", type = "text" },
  { name = "address", type = "text" },
  { name = "scope_id", type = "text" },
]

[[step]]
name = "notification"
targets = ["social.notifications"]
extract = "notification.extract.sql"
load = "notification.load.sql"
key = ["id"]
watermark = "updated_at"
columns = [
  { name = "id", type = "uuid" },
  { name = "address", type = "text" },
  { name = "type", type = "text" },
  { name = "metadata", type = "jsonb" },
  { name = "occurred_at", type = "timestamptz" },
  { name = "read_at", type = "timestamptz" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]

[[step]]
name = "broadcast_read"
targets = ["social.broadcast_notifications", "social.broadcast_reads"]
extract = "broadcast_read.extract.sql"
load = "broadcast_read.load.sql"
key = ["notification_id", "source_address"]
watermark = "read_at"
columns = [
  { name = "notification_id", type = "uuid" },
  { name = "source_address", type = "text" },
  { name = "address", type = "text" },
  { name = "type", type = "text" },
  { name = "metadata", type = "jsonb" },
  { name = "occurred_at", type = "timestamptz" },
  { name = "created_at", type = "timestamptz" },
  { name = "read_at", type = "timestamptz" },
]

# Address-less rows are stored once and visible to every wallet.
[[step]]
name = "broadcast"
targets = ["social.broadcast_notifications", "social.broadcast_reads", "social.notifications"]
extract = "broadcast.extract.sql"
load = "broadcast.load.sql"
key = ["id"]
watermark = "updated_at"
columns = [
  { name = "id", type = "uuid" },
  { name = "type", type = "text" },
  { name = "metadata", type = "jsonb" },
  { name = "occurred_at", type = "timestamptz" },
  { name = "created_at", type = "timestamptz" },
  { name = "updated_at", type = "timestamptz" },
]
