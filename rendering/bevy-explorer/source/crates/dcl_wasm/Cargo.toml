[package]
name = "dcl_wasm"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]

[features]
default = []

[dependencies]
common = { workspace = true }
dcl_js = { workspace = true }
dcl_types = { workspace = true }
dcl_component = { workspace = true }
system_bridge = { workspace = true }

bevy = { workspace = true }
tokio = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = "1.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
anyhow = { workspace = true }

serde-wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }

log = "0.4"

# `inner` (wasm only) uses the web worker's page functions, which need a web backend; declared
# here, as dcl_scene_wasm does, so the crate's own wasm tests build without the engine's crates
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web-worker", "webgpu"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
