[package]
name = "assets"
version = "0.1.0"
edition = "2021"

[features]
# Embed only what an avatar-only build renders: shaders, the ghost body and the idle clip.
# Default (off) embeds the whole assets folder, as the Explorer needs.
preview = []

[lib]

[dependencies]
bevy = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

[build-dependencies]
bevy = { workspace = true }
