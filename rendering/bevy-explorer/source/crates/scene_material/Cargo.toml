[package]
name = "scene_material"
version = "0.1.0"
edition = "2021"

[lib]

[features]
# WebGL2 has no storage buffers: the scene-bounds cell table is left out of the materials, so a
# bounded scene fades by its rectangle only. For a WebGL2 build that shows no scenes (the avatar
# preview, rendering/avatar-preview); the Explorer builds for WebGPU. It turns on bevy's
# `webgl2`, which leaves the cell table out of the shader (`WEBGL2` in scene_bounds.wgsl), so the
# material and the shader drop it together.
webgl2 = ["bevy/webgl2"]

[dependencies]
bevy = { workspace = true }
common = { workspace = true }
boimp = { workspace = true }
nonmax = { workspace = true }

[dev-dependencies]
pipeline_test = { workspace = true }
# present only to enable the naga_oil `override_any` feature in a per-crate test build, as the
# root crate does for the app (see [workspace.dependencies]); not referenced from Rust
naga_oil = { workspace = true }
