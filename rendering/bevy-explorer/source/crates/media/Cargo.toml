[package]
name = "media"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
uuav = ["dep:uuav", "dep:metal", "dep:cpal", "dep:parking_lot"]
html = ["dep:web-sys"]

[dependencies]
common = { workspace = true }
dcl_component = { workspace = true }

bevy = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ipfs = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

urlencoding = { workspace = true }
reqwest = { workspace = true }

kira = { workspace = true }
# the default output device's sample rate, for the audio the helper delivers (uuav/audio.rs)
cpal = { version = "0.15.2", optional = true }
parking_lot = { version = "0.12", optional = true }
wgpu = { workspace = true }
uuav = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { workspace = true, optional = true }

# the D3D11 decode device the uuav client captures, its fence, and the import of its
# presentation textures into a DX12 or Vulkan renderer (platform_windows.rs)
[target.'cfg(windows)'.dependencies]
ash = { workspace = true }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = { workspace = true }
futures-lite = { workspace = true }
once_cell = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, optional = true, features = [
  "HtmlMediaElement",
  "HtmlVideoElement",
  "HtmlCollection",
  "Worker",
  "AudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioScheduledSourceNode",
  "GainNode",
  "StereoPannerNode",
  "AudioDestinationNode",
  "AudioParam",
  "VideoFrame",
] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wgpu = { workspace = true }
