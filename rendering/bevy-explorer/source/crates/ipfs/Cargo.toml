[package]
name = "ipfs"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]

[features]
default = ["ipfs_debug"]
hot_reload = []
web-worker = ["bevy/web-worker"]
# The avatar preview's (through `avatar/avatar-preview`): on web, read the page's own `data:` and `blob:`
# urls (the files of an item a page registers inline). Without it those urls go to the http
# client, which refuses them, so the Explorer serves them to no scene, profile or page.
avatar-preview = []
ipfs_debug = ["bevy/bevy_ui_picking_backend"]

[dependencies]
common = { workspace = true }
console = { workspace = true }
platform = { workspace = true }
wallet = { workspace = true }

bevy = { workspace = true }
anyhow = { workspace = true }
bevy_console = { workspace = true }
bevy_kira_audio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
urn = { workspace = true }
async-std = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
async-fs = { workspace = true }
multihash-codetable = { workspace = true }
base64 = { workspace = true }
ruzstd = { workspace = true }
web-time = { workspace = true }
http = { workspace = true }

url = "2.4.0"
futures-io = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-fs = { workspace = true }
futures-lite = { workspace = true }
web-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde-wasm-bindgen = { workspace = true }
