[package]
name = "dcl_deno"
version = "0.1.0"
edition = "2021"

[lib]

[features]
default = []
inspect = ["fastwebsockets", "hyper"]

[dependencies]
common = { workspace = true }
dcl_component = { workspace = true }
dcl_js = { workspace = true, features = ["span_scene_loop"] }
dcl_types = { workspace = true }
system_bridge = { workspace = true }
platform = { workspace = true }

bevy = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
once_cell = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http = { workspace = true }
uuid = { workspace = true }
native-tls = { workspace = true }
tokio-native-tls = { workspace = true }
tokio-tungstenite = { workspace = true }

deno_core = { workspace = true }
deno_error = { workspace = true }
deno_web = { workspace = true }
deno_webidl = { workspace = true }

bytes = "1.11.1"

# inspector requirements
fastwebsockets = { version = "0.4.4", optional = true, features = ["upgrade"] }
hyper = { version = "0.14.26", features = [
  "runtime",
  "http1",
  "server",
], optional = true }

[dev-dependencies]
deno_core = { workspace = true, features = ["unsafe_use_unprotected_platform"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
