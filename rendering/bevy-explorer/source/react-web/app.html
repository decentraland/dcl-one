<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Inside the web shell, nothing in the app may read localStorage, our code or a library's:
      // the first read loads the origin's whole storage area into this process, and it holds the
      // sign-in key the shell keeps (src/shell/main.ts). A classic script, so it runs before any
      // module; the HUD's own values live in src/lib/prefs.ts. Same check as inShell in
      // src/lib/shell.ts.
      if (window.parent !== window && !window.credentialless) {
        Object.defineProperty(window, 'localStorage', {
          configurable: false,
          get() {
            throw new Error('localStorage is not available to the app: use lib/prefs')
          }
        })
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decentraland</title>
    <meta
      name="description"
      content="Explore Decentraland — a social virtual world. Jump in from your browser: events, games, and places built by the community."
    />
    <meta name="theme-color" content="#2c1442" />
    <!-- Favicons (same art as the engine page's set). Vite rebases these for the CDN base. -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Decentraland Web" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <!-- Social cards -->
    <meta property="og:title" content="Decentraland" />
    <meta property="og:description" content="Explore a social virtual world from your browser." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- The loading overlay's full-screen backdrop (1.7MB). Prefetch it during the login screen
         (low priority, won't fight first paint) so it's cached before we enter and freeze. -->
    <link rel="prefetch" as="image" href="/assets/login/gradient-background.webp" />
    <style>
      /* Instant branded first paint. The JS bundle + React mount take a moment (longer over a slow
         tunnel/network) and #root is empty until then — without this the page flashes white. This
         is the splash: the animated logo, 124px on the 1080 reference canvas, on the
         purple vignette. React's splash (library/ui/apps/hud/features/startup/StartupSplash) paints
         the same from the same file and replaces #root on mount, so the hand-off is seamless. The
         colors mirror tokens.css `--loading-vignette`, kept literal because this must paint before
         any CSS/JS loads; the size mirrors `--ui-scale` (lib/hudScale.ts). */
      html,
      body {
        margin: 0;
        background: #4c0080;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse 100% 100% at 50% 50%, #bf00ff 16.7%, #4c0080 66.7%);
      }
      #boot-splash img {
        width: clamp(74.4px, min(6.458vw, 11.481vh), 161.2px);
        height: clamp(74.4px, min(6.458vw, 11.481vh), 161.2px);
      }
    </style>
  </head>
  <body>
    <!-- React HUD mounts here; the engine's canvas is rendered behind it, in this document
         (see library/ui/apps/hud/features/engine/EngineHost.tsx). The #boot-splash inside #root is the
         pre-React branded splash; createRoot() clears it on mount. -->
    <div id="root">
      <div id="boot-splash">
        <img src="/assets/splash-logo.webp" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
