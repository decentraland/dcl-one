[bans]
multiple-versions = "allow"
wildcards = "allow"
# One V8 in the scene runtime: a second v8 means the deno crates disagree and two engines get linked;
# v8x is deno_v8's engine-agnostic backend (its quickjs feature); beside v8 it adds a second engine.
deny = [{ crate = "v8", deny-multiple-versions = true }, { crate = "v8x" }]
