# cargo deny for the Explorer workspace, run on pull requests and weekly by
# .github/workflows/bevy-explorer-deny.yml:
#   cargo deny --locked --workspace check advisories bans
# The vendored bevy/deny.toml belongs to the bevy fork and is not used here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Unsound advisories default to direct dependencies only; check the whole graph like the others.
unsound = "all"
# Baseline of 2026-11-09: every advisory the lock already had, so the gate fails only on new ones.
# Remove an entry once its crate is bumped or dropped; cargo deny warns about entries that no longer match.
