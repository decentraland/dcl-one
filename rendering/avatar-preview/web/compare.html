<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview comparison</title>
  <style>
    :root { --bg: #5b2a8c; }
    html, body { margin: 0; height: 100%; font: 13px system-ui; color: #eee; background: var(--bg); }
    header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 14px; background: rgba(0,0,0,.35); }
    header label { display: flex; gap: 6px; align-items: center; }
    header input[type=range] { width: 110px; }
    header output { width: 3.5em; font-variant-numeric: tabular-nums; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; height: calc(100% - 110px); box-sizing: border-box; }
    figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
    figcaption { padding: 4px 0; opacity: .8; }
    iframe { flex: 1; width: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <!-- The reference renderer and this one side by side, with the same preview options (this page's
       query string, minus its own keys). `ref=<origin>` names the reference (default: the
       production wearable-preview, asked for its Unity renderer); `bg=<hex>` the page colour. The
       sliders send the light rig to the Bevy frame. -->
  <header>
    <label>key light <input id="illuminance" type="range" min="0" max="20000" step="250"><output></output></label>
    <label>exposure <input id="exposure" type="range" min="-3" max="3" step="0.1"><output></output></label>
    <label>yaw <input id="yaw" type="range" min="-3.14" max="3.14" step="0.05"><output></output></label>
    <label>pitch <input id="pitch" type="range" min="0.1" max="1.5" step="0.05"><output></output></label>
    <label>shadow <input id="shadow" type="range" min="0" max="1" step="0.05"><output></output></label>
    <label>reach <input id="shadowReach" type="range" min="1" max="8" step="0.25"><output></output></label>
    <label>glow <input id="glow" type="range" min="0" max="20" step="0.5"><output></output></label>
    <label>platform base <input id="platformBase" type="range" min="0" max="2" step="0.02"><output></output></label>
    <label>platform emission <input id="platformEmission" type="range" min="0" max="2" step="0.01"><output></output></label>
    <button id="copy" type="button">copy light</button>
  </header>
  <!-- the jesus mode's particles (`mode=jesus`), sent to the Bevy frame as `bevy_effect` -->
  <header id="effect">
    <label>particles/s <input id="rate" type="range" min="0" max="4000" step="50"><output></output></label>
    <label>brightness <input id="intensity" type="range" min="0" max="100" step="0.5"><output></output></label>
    <label>colour <input id="color" type="color"></label>
    <label>size min <input id="sizeMin" type="range" min="0" max="0.1" step="0.001"><output></output></label>
    <label>size max <input id="sizeMax" type="range" min="0" max="0.1" step="0.001"><output></output></label>
    <label>life min <input id="lifeMin" type="range" min="0" max="3" step="0.05"><output></output></label>
    <label>life max <input id="lifeMax" type="range" min="0" max="3" step="0.05"><output></output></label>
    <label>rise min <input id="riseMin" type="range" min="-1" max="2" step="0.05"><output></output></label>
    <label>rise max <input id="riseMax" type="range" min="-1" max="2" step="0.05"><output></output></label>
    <label>spread <input id="spread" type="range" min="0" max="2" step="0.05"><output></output></label>
    <label>depth <input id="depth" type="range" min="0" max="2" step="0.05"><output></output></label>
    <button id="copyEffect" type="button">copy particles</button>
  </header>
  <main>
    <figure><figcaption id="refcap">reference</figcaption><iframe id="ref" allow="autoplay"></iframe></figure>
    <figure><figcaption>bevy</figcaption><iframe id="bevy" allow="autoplay"></iframe></figure>
  </main>
  <script>
    const own = new URLSearchParams(location.search);
    const refOrigin = own.get('ref') || 'https://wearable-preview.decentraland.org';
    if (own.get('bg')) document.documentElement.style.setProperty('--bg', '#' + own.get('bg').replace('#', ''));
    const query = new URLSearchParams(location.search);
    for (const k of ['ref', 'bg']) query.delete(k);
    const refQuery = new URLSearchParams(query);
    refQuery.set('unity', 'true');
    if (!refQuery.has('mode')) refQuery.set('mode', 'marketplace');
    document.getElementById('ref').src = `${refOrigin}/?${refQuery}`;
    document.getElementById('refcap').textContent = `reference: ${refOrigin}`;
    const bevy = document.getElementById('bevy');
    bevy.src = `${location.origin}/?${query}`;

    // defaults mirror stage::StageLight
    const light = { illuminance: 8000, exposure: -0.4, yaw: 0.46, pitch: 0.6, shadow: 0.35, shadowReach: 6, glow: 1, platformBase: 0.5, platformEmission: 1.67 };
    for (const k of Object.keys(light)) if (own.has(k)) light[k] = Number(own.get(k));
    const send = () => bevy.contentWindow && bevy.contentWindow.postMessage({ type: 'bevy_light', payload: light }, '*');
    for (const [k, v] of Object.entries(light)) {
      const input = document.getElementById(k);
      const out = input.nextElementSibling;
      input.value = v; out.value = v;
      input.addEventListener('input', () => { light[k] = Number(input.value); out.value = input.value; send(); });
    }
    // defaults mirror effect::EffectSettings; the colour is its hue in sRGB, the brightness its scale
    const effect = { rate: 650, intensity: 100, color: '#20b2ff', sizeMin: 0.019, sizeMax: 0.04, lifeMin: 0.2, lifeMax: 1, riseMin: 0.1, riseMax: 0.4, spread: 0.5, depth: 0.2 };
    for (const k of Object.keys(effect)) if (own.has(k)) effect[k] = k === 'color' ? '#' + own.get(k).replace('#', '') : Number(own.get(k));
    const linear = (hex) => [1, 3, 5].map((i) => { const c = parseInt(hex.slice(i, i + 2), 16) / 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
    const sendEffect = () => {
      const e = effect;
      const c = linear(e.color); const m = Math.max(...c, 1e-4);
      bevy.contentWindow && bevy.contentWindow.postMessage({ type: 'bevy_effect', payload: {
        rate: e.rate, intensity: e.intensity, color: c.map((v) => v / m),
        sizeMin: e.sizeMin, sizeMax: e.sizeMax, lifeMin: e.lifeMin, lifeMax: e.lifeMax,
        velocityMin: [-e.spread, e.riseMin, -e.depth], velocityMax: [e.spread, e.riseMax, e.depth],
      } }, '*');
    };
    for (const [k, v] of Object.entries(effect)) {
      const input = document.getElementById(k);
      const out = input.nextElementSibling;
      input.value = v; if (out) out.value = v;
      input.addEventListener('input', () => { effect[k] = k === 'color' ? input.value : Number(input.value); if (out) out.value = input.value; sendEffect(); });
    }
    document.getElementById('copyEffect').addEventListener('click', () => navigator.clipboard.writeText(JSON.stringify(effect)));
    window.addEventListener('message', (e) => { if (e.source === bevy.contentWindow && e.data?.type === 'load') { send(); if (query.get('mode') === 'jesus') sendEffect(); } });
    document.getElementById('copy').addEventListener('click', () => navigator.clipboard.writeText(JSON.stringify(light)));
  </script>
</body>
</html>
