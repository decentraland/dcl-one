# Avatar preview renderer: a standalone wasm build of the Explorer's avatar look, for the
# web preview the shop and the creator hub embed. Its own workspace, lockfile, target and
# release; the avatar, collectible, material and asset code comes from the Explorer crates by
# path, with the same engine fork pins, so the look stays the Explorer's
# (docs/adr/2026-11-05-avatar-preview-renderer.md).
[workspace]
members = ["."]
resolver = "2"

[package]
name = "dcl_avatar_preview"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The browser backend. Bevy cannot hold both in one module (WebGPU overrides WebGL2), so a page
# that falls back builds twice and loads the module the browser supports.
[features]
default = ["webgpu"]
webgpu = ["bevy/webgpu"]
webgl2 = ["bevy/webgl2", "avatar/webgl2"]

[dependencies]
# Explorer crates, by path. They inherit their own dependency pins from the Explorer workspace.
assets = { path = "../bevy-explorer/source/crates/assets" }
common = { path = "../bevy-explorer/source/crates/common" }
platform = { path = "../bevy-explorer/source/crates/platform" }
console = { path = "../bevy-explorer/source/crates/console" }
ipfs = { path = "../bevy-explorer/source/crates/ipfs" }
collectibles = { path = "../bevy-explorer/source/crates/collectibles" }
scene_material = { path = "../bevy-explorer/source/crates/scene_material" }
# the avatar renderer without the Explorer glue (players, scenes, comms); `avatar-preview` turns
# on what only this build takes from the Explorer crates
avatar = { path = "../bevy-explorer/source/crates/avatar", default-features = false, features = [
  "avatar-preview",
] }
dcl_component = { path = "../bevy-explorer/source/crates/dcl_component" }

bevy = { version = "0.16.1", default-features = false, features = [
  "animation",
  "bevy_asset",
  "bevy_scene",
  "bevy_winit",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_gltf",
  "bevy_render",
  "png",
  "jpeg",
  "tonemapping_luts",
  "bevy_log",
  "std",
] }
bevy_kira_audio = { version = "=0.23.0", features = [
  "mp3",
  "ogg",
] }
# enables naga_oil function overrides (the Explorer's shadow override in bound_material.wgsl);
# must match the Explorer root crate so the feature unifies into bevy's shader composer
naga_oil = { version = "0.17", default-features = false, features = [
  "override_any",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.16.1", default-features = false }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
# size first: the module is downloaded by every shop and creator page that shows an avatar
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# `./build.sh --fast`, the iteration build (wasm-pack --dev): dependencies optimised once and cached,
# the crate itself compiled quickly and incrementally, no debug info in the module, no wasm-opt.
[profile.dev]
opt-level = 1
debug = false
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

# The Explorer's engine forks. A patch table only applies from the workspace root, so the
# Explorer's is repeated here; keep it in step with rendering/bevy-explorer/source/Cargo.toml.
[patch.crates-io]
naga_oil = { git = "https://github.com/decentraland/dcl-one", rev = "b90aa836dcd1f0226779473c5550e9e04b37f224" }
draco-oxide-decoder = { git = "https://github.com/decentraland/dcl-one", rev = "ffbc6f625b3da35793a7ed3e3666f62e746ce2be" }
draco-oxide-core = { git = "https://github.com/decentraland/dcl-one", rev = "ffbc6f625b3da35793a7ed3e3666f62e746ce2be" }
bevy = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }
bevy_ecs = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }
bevy_math = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }
bevy_color = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }
bevy_transform = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }
bevy_platform = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }
gltf = { git = "https://github.com/gltf-rs/gltf", rev = "50d65229" }
gltf-json = { git = "https://github.com/gltf-rs/gltf", rev = "50d65229" }
winit = { git = "https://github.com/decentraland/dcl-one", rev = "ee0414e120eb9837c1f5892a325791dddb586cc2" }
wgpu = { git = "https://github.com/decentraland/dcl-one", rev = "189227bff6dafe7e2cdb720ae028a12072dd642f" }
wgpu-types = { git = "https://github.com/decentraland/dcl-one", rev = "189227bff6dafe7e2cdb720ae028a12072dd642f" }
naga = { git = "https://github.com/decentraland/dcl-one", rev = "189227bff6dafe7e2cdb720ae028a12072dd642f" }
bevy_console = { git = "https://github.com/decentraland/dcl-one", rev = "62b94f3c152da9e748d7790c7e9126aed493d327" }
bevy_kira_audio = { git = "https://github.com/decentraland/dcl-one", rev = "343c72eb0e0e4b232aea96a4f5210209d06e113b" }
[patch."https://github.com/robtfm/bevy"]
bevy = { git = "https://github.com/decentraland/dcl-one", rev = "c3bf1c8f84dd4e3aa17e9534c20447615c0a4a5e" }

[patch."https://github.com/robtfm/bevy_ecss"]
bevy_ecss = { git = "https://github.com/decentraland/dcl-one", rev = "da37b8fbfd7d2561257254f4ae9370ca33a71acb" }

[patch."https://github.com/robtfm/copypwasmta"]
copypwasmta = { git = "https://github.com/decentraland/dcl-one", rev = "b56757323a5f73eb4a373fef69c4e840f76f98f2" }
