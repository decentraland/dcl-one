[package]
name = "catalyst-camera-reel"
version.workspace = true
edition = "2024"
description = "Camera reel: the photo upload, gallery and metadata service"
publish = false

[dependencies]
dcl-auth.workspace = true
catalyst-shared = { path = "../shared" }
catalyst-storage = { path = "../storage" }
catalyst-content = { path = "../content" }
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true
base64.workspace = true
image.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "catalyst-shared/ts", "catalyst-storage/ts", "catalyst-content/ts"]
test-support = ["catalyst-shared/test-support", "catalyst-storage/test-support", "catalyst-content/test-support"]

[dev-dependencies]
dcl-http = { workspace = true, features = ["db"] }
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-storage = { path = "../storage", features = ["test-support"] }
catalyst-content = { path = "../content", features = ["test-support"] }
catalyst-builder = { path = "../builder", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
alloy = { version = "2", default-features = false, features = ["std", "signer-local"] }
