[package]
name = "catalyst-land-authz"
version.workspace = true
edition = "2024"
description = "LAND authorization: who may deploy to a parcel, from the land-manager index and its event stream"
publish = false

[dependencies]
dcl-http = { workspace = true, features = ["db"] }
catalyst-jobs = { path = "../jobs" }
catalyst-shared = { path = "../shared" }
catalyst-chain-index = { path = "../chain-index" }
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
parking_lot.workspace = true
alloy-primitives.workspace = true
url.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "catalyst-shared/ts", "catalyst-chain-index/ts"]
test-support = ["catalyst-shared/test-support", "catalyst-chain-index/test-support"]

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-chain-index = { path = "../chain-index", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
