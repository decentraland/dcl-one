[bans]
multiple-versions = "allow"
wildcards = "allow"
# One V8 in the SDK7 scene host: a second v8, or the engine-agnostic v8x backend, links two engines.
deny = [{ crate = "v8", deny-multiple-versions = true }, { crate = "v8x" }]
