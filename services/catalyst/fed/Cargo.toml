[package]
name = "catalyst-fed"
version = "0.1.0"
edition = "2024"
description = "Federation signing (EIP-712) for the catalyst node"
publish = false

[dependencies]
dcl-auth.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
sha2.workspace = true
rand.workspace = true
alloy = { workspace = true, optional = true }

# Signing helpers for dependents' federation tests.
[features]
test-support = ["dep:alloy"]

[dev-dependencies]
alloy.workspace = true
