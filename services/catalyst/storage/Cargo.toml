[package]
name = "catalyst-storage"
version.workspace = true
edition = "2024"
description = "Blob storage behind the content server: filesystem and S3 backends, the denylist"
publish = false

[dependencies]
dcl-auth.workspace = true
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures.workspace = true
bytes.workspace = true
uuid.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
libc.workspace = true
sha1.workspace = true
url.workspace = true

[features]
ts = []
test-support = []

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
tokio = { workspace = true, features = ["test-util"] }
