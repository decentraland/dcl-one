[package]
name = "catalyst-content"
version.workspace = true
edition = "2024"
description = "The content server: entity deployment, validation, sync from the catalyst network, snapshots and the content routes"
publish = false

[dependencies]
dcl-http = { workspace = true, features = ["db"] }
dcl-auth.workspace = true
catalyst-jobs = { path = "../jobs" }
catalyst-shared = { path = "../shared" }
catalyst-config = { path = "../config" }
catalyst-storage = { path = "../storage" }
catalyst-chain-index = { path = "../chain-index" }
catalyst-land-authz = { path = "../land-authz" }
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
uuid.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
hex.workspace = true
libc.workspace = true
urlencoding.workspace = true
base64.workspace = true
alloy-primitives.workspace = true
sha2.workspace = true
bs58.workspace = true
reqwest.workspace = true
flate2.workspace = true
url.workspace = true
regex.workspace = true
image.workspace = true
metrics.workspace = true

[features]
ts = ["catalyst-shared/ts", "catalyst-config/ts", "catalyst-storage/ts", "catalyst-chain-index/ts", "catalyst-land-authz/ts"]
test-support = ["catalyst-shared/test-support", "catalyst-config/test-support", "catalyst-storage/test-support", "catalyst-chain-index/test-support", "catalyst-land-authz/test-support"]

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-config = { path = "../config", features = ["test-support"] }
catalyst-storage = { path = "../storage", features = ["test-support"] }
catalyst-chain-index = { path = "../chain-index", features = ["test-support"] }
catalyst-land-authz = { path = "../land-authz", features = ["test-support"] }
catalyst-testing = { path = "../testing" }
catalyst-db = { path = "../db", features = ["scratch"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
alloy = { version = "2", default-features = false, features = ["std", "signer-local"] }
