[package]
name = "catalyst-comms"
version.workspace = true
edition = "2024"
description = "Comms and multiplayer: pulse, the archipelago connector, the gatekeeper and live presence"
publish = false

[dependencies]
dcl-http = { workspace = true, features = ["db"] }
dcl-auth.workspace = true
catalyst-jobs = { path = "../jobs" }
catalyst-shared = { path = "../shared" }
catalyst-config = { path = "../config" }
catalyst-chain-index = { path = "../chain-index" }
catalyst-content = { path = "../content" }
catalyst-explore = { path = "../explore" }
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
uuid.workspace = true
tokio-util.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
hex.workspace = true
base64.workspace = true
alloy-primitives.workspace = true
sha2.workspace = true
reqwest.workspace = true
url.workspace = true
prost.workspace = true
hmac.workspace = true
getrandom.workspace = true
rand.workspace = true
rusty_enet.workspace = true
web-transport-quinn.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
async-nats.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
ts-rs = { workspace = true, optional = true }

[build-dependencies]
prost-build.workspace = true
prost-types.workspace = true
protox.workspace = true

[features]
ts = ["dep:ts-rs", "catalyst-shared/ts", "catalyst-config/ts", "catalyst-chain-index/ts", "catalyst-content/ts", "catalyst-explore/ts"]
test-support = ["catalyst-shared/test-support", "catalyst-config/test-support", "catalyst-chain-index/test-support", "catalyst-content/test-support", "catalyst-explore/test-support"]

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-config = { path = "../config", features = ["test-support"] }
catalyst-chain-index = { path = "../chain-index", features = ["test-support"] }
catalyst-content = { path = "../content", features = ["test-support"] }
catalyst-explore = { path = "../explore", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
alloy = { version = "2", default-features = false, features = ["std", "signer-local"] }
tokio-tungstenite.workspace = true
proptest = "1.11.0"
rcgen = "0.14.10"
