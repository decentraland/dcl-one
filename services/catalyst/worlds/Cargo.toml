[package]
name = "catalyst-worlds"
version.workspace = true
edition = "2024"
description = "Worlds: scene identity, access policy, authoritative hosting, the pulse relay and world federation"
publish = false

[dependencies]
dcl-http = { workspace = true, features = ["db"] }
dcl-auth.workspace = true
catalyst-jobs = { path = "../jobs" }
catalyst-shared = { path = "../shared" }
catalyst-config = { path = "../config" }
catalyst-storage = { path = "../storage" }
catalyst-chain-index = { path = "../chain-index" }
catalyst-land-authz = { path = "../land-authz" }
catalyst-content = { path = "../content" }
catalyst-explore = { path = "../explore" }
catalyst-comms = { path = "../comms" }
tokio.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
flate2.workspace = true
uuid.workspace = true
tokio-util.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
hex.workspace = true
base64.workspace = true
reqwest.workspace = true
url.workspace = true
bcrypt.workspace = true
v8.workspace = true
aes-gcm.workspace = true
rand.workspace = true
toml.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs", "catalyst-shared/ts", "catalyst-config/ts", "catalyst-storage/ts", "catalyst-chain-index/ts", "catalyst-land-authz/ts", "catalyst-content/ts", "catalyst-explore/ts", "catalyst-comms/ts"]
test-support = ["catalyst-shared/test-support", "catalyst-config/test-support", "catalyst-storage/test-support", "catalyst-chain-index/test-support", "catalyst-land-authz/test-support", "catalyst-content/test-support", "catalyst-explore/test-support", "catalyst-comms/test-support"]

[dev-dependencies]
catalyst-shared = { path = "../shared", features = ["test-support"] }
catalyst-config = { path = "../config", features = ["test-support"] }
catalyst-storage = { path = "../storage", features = ["test-support"] }
catalyst-chain-index = { path = "../chain-index", features = ["test-support"] }
catalyst-land-authz = { path = "../land-authz", features = ["test-support"] }
catalyst-content = { path = "../content", features = ["test-support"] }
catalyst-explore = { path = "../explore", features = ["test-support"] }
catalyst-comms = { path = "../comms", features = ["test-support"] }
catalyst-db = { path = "../db", features = ["scratch"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
alloy = { version = "2", default-features = false, features = ["std", "signer-local"] }
tokio-tungstenite.workspace = true
proptest = "1.12.0"
