worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Keep the sign-in shell outside the engine's isolated document, as upstream does.
    map $uri $document_isolation {
        default "";
        /app.html isolate-and-credentialless;
        /engine/headless.html isolate-and-credentialless;
    }
    map $uri $opener_policy {
        default same-origin;
        / "";
        /index.html "";
        /app.html "";
        /engine/headless.html "";
    }
    map $opener_policy $embedder_policy { default credentialless; "" ""; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Document-Isolation-Policy $document_isolation always;
        add_header Cross-Origin-Opener-Policy $opener_policy always;
        add_header Cross-Origin-Embedder-Policy $embedder_policy always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        location = /healthz { return 200 "ok\n"; }
        location / { try_files $uri $uri/ =404; }
    }
}
