# No package runs code at install time: esbuild's binary ships as an optional dependency.
ignoreScripts: true
# New dependencies are saved with exact versions, so regenerating the lockfile never picks up a newer release.
saveExact: true
nodeLinker: hoisted
minimumReleaseAge: 1440
packages:
  - .
  - ../../../library/hashing
overrides:
  '@dcl/hashing': workspace:*
  protobufjs: 7.6.6
  '@dcl/quests-client>@dcl/sdk': 7.30.1
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
  # dcl-catalyst-client lists cookie and loads it from no file.
  'dcl-catalyst-client>cookie': '-'
  # @dcl/sdk-commands starts i18next with its file backend and calls only t().
  '@dcl/sdk-commands>i18next': ^26.3.4
  # @dcl/asset-packs lists glob for its own build scripts; no published file loads it.
  '@dcl/asset-packs>glob': '-'
  '@dcl/asset-packs>@types/glob': '-'
  # extract-zip 2 has no fixed release. Creator Hub's zip-extract has the same call and makes no link.
  extract-zip: file:../../creator-hub/packages/zip-extract
allowBuilds:
  "@dcl/sdk-commands": false
  esbuild: false
  protobufjs: false
