[package]
name = "dcl-auth"
version = "0.1.0"
edition = "2024"
description = "Hashes, signatures, principals and auth chains, shared by the catalyst node and dcl-scene-cli"
publish = false
workspace = "../../services/catalyst"

[dependencies]
dcl-http.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
hex.workspace = true
alloy-primitives.workspace = true
sha2.workspace = true
bs58.workspace = true
data-encoding.workspace = true
reqwest.workspace = true
getrandom.workspace = true
# 0.14, not the workspace's 0.13: off crypto-bigint 0.5 (RUSTSEC-2026-0387).
k256 = { version = "0.14", features = ["ecdsa"] }
zeroize = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
alloy.workspace = true
futures.workspace = true
