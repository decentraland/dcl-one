nodeLinker: hoisted
# The workspace packages stay out of the root node_modules, as the SDK's own resolution and tests expect.
hoistWorkspacePackages: false
packages:
  - packages/@dcl/*
  - ../hashing
overrides:
  "react@^18.2.0": "18.3.1"
  "react-reconciler@^0.29.0": "0.29.0"
  "scheduler@^0.23.0": "0.23.0"
  "@dcl/asset-packs": "2.17.2"
  '@dcl/hashing': workspace:*
  "protobufjs": "7.6.6"
  "semver@<7.5.2": "^7.5.4"
  "minimatch@<3.1.4": "^3.1.4"
  "zod@<=3.22.2": "^3.23.8"
  "ajv@<6.14.0": "^6.14.0"
  # typedoc 0.23 calls Minimatch.matchOne, which minimatch 11 removed, so its 7.x range stays out of this.
  "minimatch@>=8 <11.0.1": "^11.0.1"
  "test-exclude": "^7.0.1"
  "glob@10": "^14.0.2"
  # asset-packs lists glob for its own build scripts; nothing it ships loads it.
  '@dcl/asset-packs>glob': '-'
  '@dcl/asset-packs>@types/glob': '-'
  # The inspector's entry point calls only merge.withOptions, which version 8 keeps.
  '@dcl/inspector>ts-deepmerge': '^8.0.0'
minimumReleaseAge: 1440
allowBuilds:
  '@dcl/sdk-commands': false
  esbuild: false
  protobufjs: false
