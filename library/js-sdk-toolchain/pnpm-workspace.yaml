packages:
  - packages/@dcl/*
  - test/snapshots
  - test/build-ecs/fixtures/*
nodeLinker: hoisted
ignoreScripts: true
saveExact: true
overrides:
  protobufjs: ^7.6.3
  semver@<7.5.2: ^7.5.4
  minimatch@<3.1.4: ^3.1.4
  zod@<=3.22.2: ^3.23.8
  ajv@<6.14.0: ^6.14.0
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  test-exclude: ^7.0.1
  glob@10: ^13.0.6
allowBuilds:
  '@dcl/sdk-commands': false
  esbuild: false
  protobufjs: false
  unrs-resolver: false
