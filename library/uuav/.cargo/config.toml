[env]
# the FFmpeg prefix the helper links: `nix build .#uuav-ffmpeg -o
# library/uuav/.third_party/ffmpeg` (macOS, Linux) or
# tooling/uuav/fetch-ffmpeg-windows.sh (the BtbN LGPL shared build)
FFMPEG_DIR = { value = ".third_party/ffmpeg", relative = true }

[build]
target-dir = ".target"

# The GNU toolchain rather than MSVC: GNU ld can be told not to stamp the
# PE header, which is what makes two builds byte-identical. The linker is
# resolved from PATH (MSYS2's mingw-w64-x86_64-gcc on Windows, pkgsCross
# mingw-w64 in the Nix cross build).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "link-arg=-Wl,--no-insert-timestamp"]

# @loader_path rpath: uuav-helper resolves the @rpath/... FFmpeg dylibs
# from its own folder
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]

# $ORIGIN RUNPATH: the Linux analog; every shipped .so carries the same
# entry (infra/packages/uuav.nix) so the whole set resolves from the
# helper's directory
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

# aarch64 Linux ships nothing; it only serves container-based testing
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
