[workspace]
members = ["uuav-ipc", "uuav-server", "uuav-client"]

# symbols are dead weight in the shipped helper (-32%); panic backtraces
# still resolve through the module+offset the host's crash reporter captures
[profile.release]
strip = "symbols"


[package]
name = "uuav-core"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
arc-swap = "1.7.1"
crossbeam-channel = "0.5.16"
dashmap = "6.1.0"

ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat", "swresample", "swscale"] }

# http(s) input: FFmpeg has no https/tls protocol, see src/playback/http.rs
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
webpki-root-certs = "1.0.11"
# AES-128 HLS segments
aes = "0.8.4"

libc = "0.2"
parking_lot = "0.12"
ringbuf = "0.5"

[target.'cfg(not(windows))'.dependencies]
rustls-native-certs = "0.8.5"

[target.'cfg(windows)'.dependencies]
# the root store, read-only (rustls-native-certs opens it for writing)
schannel = "0.1.30"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

# objc2 over the old gfx-rs `metal` crate: actively maintained, and its
# Retained<T> RAII with Option-returning constructors fits the crate's
# no-panic rule (the metal crate panics internally).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# the objc2-io-surface feature unlocks the IOSurface bridging APIs
# (newTextureWithDescriptor:iosurface:plane:, CVPixelBufferGetIOSurface)
objc2-metal = { version = "0.3", features = ["objc2-io-surface"] }
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = "0.3"

# The core only ever ships inside the uuav-helper process: a plain Rust
# library the helper links. Its C ABI stays the helper's adapter surface.
[lib]
name = "uuav_core"
crate-type = ["rlib"]
