syntax = "proto3";

import "decentraland/common/vectors.proto";

package decentraland.kernel.comms.v3;

// Server->Client messsages
message ChallengeResponseMessage {
  reserved 3;
  reserved "selection";
  string challenge_to_sign = 1;
  bool already_connected = 2;
}

message WelcomeMessage {
  reserved 2;
  reserved "context";
  string peer_id = 1;
}

message IslandChangedMessage {
  string island_id = 1;
  string conn_str = 2;
  optional string from_island_id = 3;
  map<string, decentraland.common.Position> peers = 4;
  AssignmentContext assignment_context = 5;
}

message LeftIslandMessage {
  string island_id = 1;
  string peer_id = 2;
}

message JoinIslandMessage {
  string island_id = 1;
  string peer_id = 2;
}

enum KickedReason {
  KR_NEW_SESSION = 0;
}

message KickedMessage {
  KickedReason reason = 1;
}

message ServerPacket {
  oneof message {
    ChallengeResponseMessage challenge_response = 1;
    WelcomeMessage welcome = 2;
    IslandChangedMessage island_changed = 3;
    LeftIslandMessage  left_island = 4;
    JoinIslandMessage join_island = 5;
    KickedMessage kicked = 6;
    Ack ack = 7;
    ControlError error = 8;
  }
  uint64 request_sequence = 15;
}

// Client->Server messsages
message ChallengeRequestMessage {
  reserved 2;
  reserved "offer";
  string address = 1;
}

message SignedChallengeMessage {
  reserved 2;
  reserved "typed_auth_chain";
  string auth_chain_json = 1;
}

message Heartbeat {
  decentraland.common.Position position = 1;
  optional string desired_room = 2;
  optional uint64 sample_sequence = 3;
}

message ClientPacket {
  oneof message {
    ChallengeRequestMessage challenge_request = 1;
    SignedChallengeMessage signed_challenge = 2;
    Heartbeat heartbeat = 3;
    Ack ack = 4;
    RequestSnapshot request_snapshot = 5;
  }
  uint64 request_sequence = 15;
}

message AssignmentContext {
  uint32 lane_handle = 1;
  uint64 assignment_revision = 2;
  uint64 realm_revision = 3;
  uint64 fencing_token = 4;
  uint64 lease_expires_at_ms = 5;
  bool removed = 6;
}

message Ack {
  uint32 lane_handle = 1;
  uint64 applied_revision = 2;
}

message RequestSnapshot {
  uint32 lane_handle = 1;
  optional uint64 from_revision = 2;
}

enum ControlErrorCode {
  CONTROL_ERROR_CODE_UNSPECIFIED = 0;
  CONTROL_ERROR_CODE_INVALID_FRAME = 1001;
  CONTROL_ERROR_CODE_PROTOCOL_VIOLATION = 1002;
  CONTROL_ERROR_CODE_AUTH_FAILED = 1003;
  CONTROL_ERROR_CODE_STALE_EPOCH = 1004;
  CONTROL_ERROR_CODE_AUTHORITY_UNAVAILABLE = 1005;
  CONTROL_ERROR_CODE_AUTHORITY_CONFLICT = 1006;
  CONTROL_ERROR_CODE_GAP_REQUIRES_SNAPSHOT = 1007;
  CONTROL_ERROR_CODE_LIMIT_EXCEEDED = 1008;
  CONTROL_ERROR_CODE_INVALID_LANE = 1009;
  CONTROL_ERROR_CODE_STALE_REQUEST = 1010;
}

enum ControlRetryClass {
  CONTROL_RETRY_CLASS_UNSPECIFIED = 0;
  CONTROL_RETRY_CLASS_NEVER = 1;
  CONTROL_RETRY_CLASS_AFTER_RECONNECT = 2;
  CONTROL_RETRY_CLASS_LATER = 3;
}

message ControlError {
  ControlErrorCode code = 1;
  ControlRetryClass retry = 2;
  optional string public_detail = 3;
}

// Others
message IslandData {
  string id = 1;
  repeated string peers = 2;
  uint32 max_peers = 3;
  decentraland.common.Position center = 4;
  double radius = 5;
}

message IslandStatusMessage {
  repeated IslandData data = 1;
}

message ServiceStatus {
  uint64 current_time = 1;
  optional string commit_hash = 2;
  uint32 user_count = 3;
}

message ServiceDiscoveryMessage {
  string server_name = 1;
  ServiceStatus status = 2;
}
