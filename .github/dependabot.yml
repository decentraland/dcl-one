# Keeps the commit-pinned actions in .github/workflows current: one grouped pull request a week
# that moves each pin to the action's newest release and refreshes the version comment next to it.
# Bevy Explorer / CI runs a reduced matrix for dependabot[bot] (see its test job).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [ci]
