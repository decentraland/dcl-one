# Path rules for .github/workflows/pr-labeler.yml (actions/labeler).
# Paths mirror the explorer-rust area in ownership.json.
explorer-rust:
  - changed-files:
      - any-glob-to-any-file:
          - 'rendering/bevy-explorer/source/crates/**'
          - 'rendering/bevy-explorer/source/src/**'
          - 'rendering/bevy-explorer/source/Cargo.toml'
          - 'rendering/bevy-explorer/source/Cargo.lock'
          - 'rendering/bevy-explorer/source/build.rs'
          - 'rendering/bevy-explorer/source/.cargo/config.toml'
          - 'rendering/bevy-explorer/source/local-harness/benchmark/**'
          - 'rendering/bevy-explorer/source/local-harness/presence/harness-util/**'
          - 'rendering/bevy-explorer/source/vendor/**'
          - 'rendering/bevy-explorer/bevy/**'
          - 'rendering/bevy-explorer/cargo-patches.toml'
          - 'rendering/bevy-explorer/forks.toml'
