# Path rules for .github/workflows/pr-labeler.yml (actions/labeler).
# Paths mirror the explorer-client area in ownership.json.
explorer:
  - changed-files:
      - any-glob-to-any-file:
          - 'rendering/bevy-explorer/**'
          - 'apps/bevy-explorer/**'
          - '.github/workflows/bevy-explorer-*.yml'
          - '.github/actions/bevy-explorer-*/**'
