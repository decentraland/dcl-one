# Adapted from upstream bevy-explorer's workflows for this repository's layout.
name: Bevy Explorer / Headless packages
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Publish npm packages and create a prerelease after all four platforms pass
        type: boolean
        default: false
  workflow_run:
    workflows: ['Bevy Explorer / CI']
    types: [completed]
jobs:
  source:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      attempt: ${{ steps.source.outputs.attempt }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: python3 tooling/bevy-ci.py source --consumer headless
  build:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bevy-explorer-headless-build.yml

  publish:
    concurrency:
      group: bevy-headless-publish
      queue: max
      cancel-in-progress: false
    # all-or-nothing: never advertise a version that is missing a platform
    needs: [source, build]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' && needs.source.result == 'success' && needs.source.outputs.build == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish && needs.build.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write # npm OIDC trusted publishing — no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || github.sha }}
      - name: Skip superseded main publication
        id: current
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.source.outputs.run_id }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
          SOURCE_CONSUMER: headless
        run: python3 tooling/ci-publication.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.current.outputs.publish == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.publish == 'true'
        with:
          run-id: ${{ needs.source.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: bevy-headless-*-${{ needs.source.outputs.sha || github.sha }}
          path: rendering/bevy-explorer/source/deploy/headless/artifacts
          merge-multiple: true
      - name: Validate all four platforms and pin the launcher to their version
        if: steps.current.outputs.publish == 'true'
        env:
          REVISION: ${{ needs.source.outputs.sha || github.sha }}
        run: python3 ../../../apps/bevy-explorer/headless-packages.py deploy/headless/artifacts deploy/headless/launcher/package.json --revision "$REVISION"
      - name: Publish platform packages
        if: steps.current.outputs.publish == 'true'
        # platform packages first: the launcher pins them by exact version. A re-run of a
        # partly published version skips packages the registry already holds with these
        # exact bytes and refuses to continue past one that differs, before any write.
        env:
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && 'latest' || 'next' }}
        run: |
          set -euo pipefail
          pending=()
          for tgz in deploy/headless/artifacts/*.tgz; do
            spec=$(tar -xOf "$tgz" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); `${p.name}@${p.version}`')
            integrity="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 | tr -d '\n')"
            published=$(npm view "$spec" dist.integrity 2>/dev/null || true)
            if [ -z "$published" ]; then
              pending+=("$tgz")
            elif [ "$published" = "$integrity" ]; then
              echo "$spec is already published with these bytes; skipping"
            else
              echo "$spec is already published with different bytes" >&2
              exit 1
            fi
          done
          for tgz in "${pending[@]+"${pending[@]}"}"; do
            npm publish "$tgz" --access public --tag "$DIST_TAG"
          done
      - name: Publish the matching launcher
        if: steps.current.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && 'latest' || 'next' }}
        run: |
          cd deploy/headless/launcher
          tgz=$(npm pack --silent)
          spec=$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')
          integrity="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 | tr -d '\n')"
          published=$(npm view "$spec" dist.integrity 2>/dev/null || true)
          if [ -z "$published" ]; then
            npm publish "$tgz" --access public --tag "$DIST_TAG"
          elif [ "$published" != "$integrity" ]; then
            echo "$spec is already published with different bytes" >&2
            exit 1
          fi
    defaults:
      run:
        working-directory: rendering/bevy-explorer/source
        shell: bash
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bevy-explorer-headless-*
          merge-multiple: true
          path: dist
      - name: Create the component prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: bevy-explorer-headless-v0.1.0-${{ github.run_number }}
          REVISION: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/* --target "$REVISION" --title "$RELEASE_TAG" --generate-notes --prerelease
permissions:
  contents: read
  actions: read
