name: SDK / CI
on:
  push:
    branches: [main]
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - library/ecs-math/**
      - library/rpc/**
      - flake.nix
      - flake.lock
      - .github/workflows/sdk.yml
  pull_request:
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - library/ecs-math/**
      - library/rpc/**
      - flake.nix
      - flake.lock
      - .github/workflows/sdk.yml
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  # a newer push supersedes a PR run; main runs finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: true
  # the development shell's protoc generates the SDK's code; nothing downloads one
  SDK_PROTOC: protoc
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop "$GITHUB_WORKSPACE" --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: sdk-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('library/js-sdk-toolchain/pnpm-lock.yaml', 'library/protocol/pnpm-lock.yaml', 'library/ecs-math/pnpm-lock.yaml', 'library/rpc/pnpm-lock.yaml') }}
          restore-keys: |
            sdk-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install (builds library/protocol, library/ecs-math and library/rpc first)
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain install
      - name: Lint
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain lint
      - name: Package manifests agree
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain lint-packages
  build-test:
    name: Build, test, pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop "$GITHUB_WORKSPACE" --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: sdk-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('library/js-sdk-toolchain/pnpm-lock.yaml', 'library/protocol/pnpm-lock.yaml', 'library/ecs-math/pnpm-lock.yaml', 'library/rpc/pnpm-lock.yaml') }}
          restore-keys: |
            sdk-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install (builds library/protocol, library/ecs-math and library/rpc first)
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain install
      - name: Test library/ecs-math and library/rpc
        run: |
          nix develop "$GITHUB_WORKSPACE" --command make -C library/ecs-math test
          nix develop "$GITHUB_WORKSPACE" --command make -C library/rpc test
      - name: Build
        id: build
        # a changed API report fails here; the regenerated files are still uploaded below
        continue-on-error: true
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain build
      - name: Test
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain test
        env:
          # as upstream: the snapshot test rewrites a stale .crdt in place and still fails on it,
          # so the artifact below carries what to commit
          UPDATE_SNAPSHOTS: true
      - name: Upload the regenerated API report and snapshots
        # what a local `make update-snapshots` would commit, for a reviewer or an author without the toolchain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-generated-${{ github.sha }}
          path: |
            library/js-sdk-toolchain/packages/@dcl/playground-assets/temp/playground-assets.api.md
            library/js-sdk-toolchain/test/snapshots/**/*.crdt
            library/js-sdk-toolchain/test/snapshots/**/*.ts
            !library/js-sdk-toolchain/test/snapshots/**/node_modules/**
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on a build error
        # also when Test failed first, or a build error hides behind the test failure
        if: ${{ !cancelled() && steps.build.outcome != 'success' }}
        run: |
          echo 'make build failed (see the Build step); its regenerated API report is in the sdk-generated artifact' >&2
          exit 1
      - name: Test the CLI
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain test-cli
      - name: Prepare releasable packages
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/js-sdk-toolchain prepare
        env:
          # nothing is published from this job, and @dcl/protocol has no version published from here yet:
          # the packed manifests say so instead of naming a version that is not on npm
          PROTOCOL_VERSION: 0.0.0-unpublished.${{ github.sha }}
      - name: Packed manifests name no local dependency
        working-directory: library/js-sdk-toolchain
        run: |
          rm -rf .packed && mkdir .packed
          for tgz in packages/@dcl/*/*.tgz; do mkdir -p ".packed/$(basename "$tgz" .tgz)" && tar -xzf "$tgz" -C ".packed/$(basename "$tgz" .tgz)"; done
          nix develop "$GITHUB_WORKSPACE" --command node scripts/check-no-local-packages.cjs .packed
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
