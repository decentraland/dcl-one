name: SDK / CI
on:
  push:
    branches: [main]
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - apps/dcl-scene-cli/**
      - apps/bevy-explorer/e2e/scenes/environment/**
      - library/dcl-scene-build/**
      - library/hashing/**
      - tooling/check-local-hashing.mjs
      - .github/workflows/sdk.yml
  pull_request:
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - apps/dcl-scene-cli/**
      - apps/bevy-explorer/e2e/scenes/environment/**
      - library/dcl-scene-build/**
      - library/hashing/**
      - tooling/check-local-hashing.mjs
      - .github/workflows/sdk.yml
  workflow_dispatch:
    inputs:
      release:
        description: 'snapshot publishes to npm next; patch, minor or major releases to npm latest'
        type: choice
        options: [snapshot, patch, minor, major]
        default: snapshot
      dry-run:
        description: 'Pack and run pnpm publish --dry-run (always on outside main)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: true
jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: corepack enable
      - name: Install (builds library/protocol's out-ts and library/hashing first)
        run: make install
      - name: Lint
        run: make lint
      - name: Package manifests agree
        run: make lint-packages
  build-test:
    name: Build, test, pack
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: corepack enable
      - name: Install (builds library/protocol's out-ts and library/hashing first)
        run: make install
      - name: Test the embedded CLI SDK contracts and declarations
        run: node --test ../../apps/dcl-scene-cli/scripts/environment-sdk.test.mjs
      - name: Build
        id: build
        # a changed API report fails here; the regenerated files are still uploaded below
        continue-on-error: true
        run: make build
      - name: Test
        id: test
        run: make test
        env:
          # as upstream: the snapshot test rewrites a stale .crdt in place and still fails on it,
          # so the artifact below carries what to commit
          UPDATE_SNAPSHOTS: true
      - name: Test SDK init in isolation
        # A separate required check under the same 180 s command budget, even after suite failure.
        # The npm cache is warm and tests do not compete here; a pass does not prove cold or contended installs.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: node_modules/.bin/jest --detectOpenHandles --forceExit --colors --runTestsByPath test/sdk-commands/blackbox/init.spec.ts
        env:
          SDK_INIT_FIXTURE: isolated
      - name: Upload the regenerated API report and snapshots
        # what a local `make update-snapshots` would commit, for a reviewer or an author without the toolchain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-generated-${{ github.sha }}
          path: |
            library/js-sdk-toolchain/packages/@dcl/playground-assets/temp/playground-assets.api.md
            library/js-sdk-toolchain/test/snapshots/**/*.crdt
            library/js-sdk-toolchain/test/snapshots/**/*.ts
            !library/js-sdk-toolchain/test/snapshots/**/node_modules/**
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on a build error
        # also when Test failed first, or a build error hides behind the test failure
        if: ${{ !cancelled() && steps.build.outcome != 'success' }}
        run: |
          echo 'make build failed (see the Build step); its regenerated API report is in the sdk-generated artifact' >&2
          exit 1
      - name: Test the CLI
        run: make test-cli
      - name: Prepare releasable packages
        run: make prepare
        env:
          # nothing is published from this job, and @dcl/protocol and @dcl/hashing have no version published
          # from here yet: the packed manifests say so instead of naming a version that is not on npm
          PROTOCOL_VERSION: 0.0.0-unpublished.${{ github.sha }}
          HASHING_VERSION: 0.0.0-unpublished.${{ github.sha }}
      - name: Packed manifests name no local dependency
        run: |
          rm -rf .packed && mkdir .packed
          for tgz in packages/@dcl/*/*.tgz; do mkdir -p ".packed/$(basename "$tgz" .tgz)" && tar -xzf "$tgz" -C ".packed/$(basename "$tgz" .tgz)"; done
          node scripts/check-no-local-packages.cjs .packed
  channel:
    name: Release channel
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      bump: ${{ steps.channel.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Pick latest for a manual release or an Inspector bump, next otherwise
        id: channel
        env:
          RELEASE: ${{ inputs.release }}
          BEFORE: ${{ github.event.before }}
        run: |
          manifest=library/js-sdk-toolchain/packages/@dcl/sdk-commands/package.json
          pin() { git show "$1:$manifest" 2>/dev/null | jq -r '.dependencies["@dcl/inspector"] // empty'; }
          if [ -n "$RELEASE" ] && [ "$RELEASE" != snapshot ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"; echo "bump=$RELEASE" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && [ "$(pin "$BEFORE")" != "$(pin "$GITHUB_SHA")" ]; then
            echo "@dcl/inspector $(pin "$BEFORE") -> $(pin "$GITHUB_SHA")"
            echo "channel=latest" >> "$GITHUB_OUTPUT"; echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "channel=next" >> "$GITHUB_OUTPUT"; echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi
  publish:
    name: Publish
    needs: [lint, build-test, channel]
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'sdk-release' || '' }}
    concurrency:
      group: ${{ needs.channel.outputs.channel == 'latest' && 'sdk-release-latest' || format('sdk-release-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    env:
      CHANNEL: ${{ needs.channel.outputs.channel }}
      BUMP: ${{ needs.channel.outputs.bump }}
      DRY_RUN: ${{ (github.ref != 'refs/heads/main' || inputs.dry-run == true) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Version
        id: version
        run: |
          previous=$(git tag -l '@dcl/sdk@*' --sort=-v:refname | sed 's|^@dcl/sdk@||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$previous" ]; then
            if [ "$DRY_RUN" != true ]; then
              echo "::error::No @dcl/sdk@X.Y.Z tag found; tag the last released version before publishing from main"
              exit 1
            fi
            previous=$(pnpm view @dcl/sdk dist-tags.latest)
            echo "::warning::No @dcl/sdk@X.Y.Z tag; counting from npm latest $previous"
          fi
          IFS=. read -r major minor patch <<< "$previous"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            *) next="$major.$minor.$((patch + 1))" ;;
          esac
          if [ "$CHANNEL" != latest ]; then next="$next-$GITHUB_RUN_ID.commit-${GITHUB_SHA::7}"; fi
          echo "$CHANNEL $previous -> $next (dry run: $DRY_RUN)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Install (builds library/protocol's out-ts and library/hashing first)
        run: make install
      - name: Pack @dcl/protocol and @dcl/hashing
        id: deps
        run: |
          rm -rf .published && mkdir .published
          for pkg in protocol hashing; do
            dir="../$pkg"
            sha=$(git log -1 --format=%H -- "$dir" | cut -c1-7)
            name=$(jq -r .name "$dir/package.json")
            version=$(pnpm view "$name" versions --json 2>/dev/null | jq -r --arg s ".commit-$sha" 'if type == "array" then . else [.] end | map(select(endswith($s))) | last // empty')
            if [ -z "$version" ]; then
              version="$(jq -r .version "$dir/package.json")-$GITHUB_RUN_ID.commit-$sha"
              pnpm --dir "$dir" pkg set version="$version"
              pnpm --dir "$dir" pack --pack-destination "$PWD/.published"
            fi
            echo "$name@$version"
            echo "$pkg=$version" >> "$GITHUB_OUTPUT"
          done
      - name: Set the release version
        working-directory: library/js-sdk-toolchain/packages/@dcl/sdk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm pkg set version="$VERSION"
      - name: Build
        run: make build
      - name: Prepare releasable packages
        run: make prepare
        env:
          PROTOCOL_VERSION: ${{ steps.deps.outputs.protocol }}
          HASHING_VERSION: ${{ steps.deps.outputs.hashing }}
      - name: Packed manifests name no local dependency
        run: |
          rm -rf .packed && mkdir .packed
          for tgz in packages/@dcl/*/*.tgz; do mkdir -p ".packed/$(basename "$tgz" .tgz)" && tar -xzf "$tgz" -C ".packed/$(basename "$tgz" .tgz)"; done
          node scripts/check-no-local-packages.cjs .packed
      - name: Publish to npm
        run: |
          dry=()
          [ "$DRY_RUN" = true ] && dry=(--dry-run)
          for pkg in js-runtime ecs react-ecs sdk-commands playground-assets sdk; do
            mv packages/@dcl/$pkg/*.tgz .published/
          done
          for tgz in .published/dcl-hashing-*.tgz .published/dcl-protocol-*.tgz \
            .published/dcl-js-runtime-*.tgz .published/dcl-ecs-*.tgz .published/dcl-react-ecs-*.tgz \
            .published/dcl-sdk-commands-*.tgz .published/dcl-playground-assets-*.tgz .published/dcl-sdk-[0-9]*.tgz; do
            [ -e "$tgz" ] || continue
            manifest=$(tar -xOzf "$tgz" package/package.json)
            spec="$(jq -r .name <<<"$manifest")@$(jq -r .version <<<"$manifest")"
            if [ "$DRY_RUN" != true ] && [ -n "$(pnpm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already on npm; skipping"
              continue
            fi
            tag=$CHANNEL
            case "$spec" in @dcl/protocol@*|@dcl/hashing@*) tag=next ;; esac
            pnpm publish "$tgz" --provenance --access public --tag "$tag" --no-git-checks "${dry[@]}"
          done
      - name: Release notes
        if: env.CHANNEL == 'latest' && env.DRY_RUN != 'true'
        id: release_notes
        uses: ./.github/actions/creator-hub-generate-release-notes
        with:
          previous_version: ${{ steps.version.outputs.previous }}
          current_version: ${{ steps.version.outputs.version }}
          paths: 'library/js-sdk-toolchain,library/protocol,library/hashing'
          section_names: 'SDK Changes,Protocol Changes,Hashing Changes'
          release_title: '@dcl/sdk'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: '@dcl/sdk@'
      - name: Tag and release
        if: env.CHANNEL == 'latest' && env.DRY_RUN != 'true'
        uses: ./.github/actions/creator-hub-update-release-description
        with:
          tag_name: '@dcl/sdk@${{ steps.version.outputs.version }}'
          release_notes: ${{ steps.release_notes.outputs.release_notes }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_if_not_exists: true
