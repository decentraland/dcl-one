name: SDK / CI
on:
  push:
    branches: [main]
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - apps/dcl-scene-cli/**
      - apps/bevy-explorer/e2e/scenes/environment/**
      - library/dcl-scene-build/**
      - library/hashing/**
      - library/dcl-scene-authoring/**
      - library/dcl-preview-tunnel/**
      - library/dcl-preview-tunnel-protocol/**
      - library/dcl-auth/**
      - library/dcl-http/**
      - library/dcl-livekit-token/**
      - apps/ui3/src/atoms/primitives.css
      - apps/ui3/src/atoms/button.css
      - apps/ui3/src/components/surface.css
      - apps/bevy-explorer/prepare-native-cache.py
      - services/catalyst/Cargo.toml
      - services/catalyst/Cargo.lock
      - .cargo/**
      - tooling/check-local-hashing.mjs
      - .github/workflows/sdk.yml
  pull_request:
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - apps/dcl-scene-cli/**
      - apps/bevy-explorer/e2e/scenes/environment/**
      - library/dcl-scene-build/**
      - library/hashing/**
      - library/dcl-scene-authoring/**
      - library/dcl-preview-tunnel/**
      - library/dcl-preview-tunnel-protocol/**
      - library/dcl-auth/**
      - library/dcl-http/**
      - library/dcl-livekit-token/**
      - apps/ui3/src/atoms/primitives.css
      - apps/ui3/src/atoms/button.css
      - apps/ui3/src/components/surface.css
      - apps/bevy-explorer/prepare-native-cache.py
      - services/catalyst/Cargo.toml
      - services/catalyst/Cargo.lock
      - .cargo/**
      - tooling/check-local-hashing.mjs
      - .github/workflows/sdk.yml
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  # a newer push supersedes a PR run; main runs finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # the SDK's make install downloads protoc 3.20.1 for the runner's arch; nothing publishes
  CI: true
jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: corepack enable
      - name: Install (builds library/protocol's out-ts and library/hashing first)
        run: make install
      - name: Lint
        run: make lint
      - name: Package manifests agree
        run: make lint-packages
  build-test:
    name: Build, test, pack
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: corepack enable
      - name: Install (builds library/protocol's out-ts and library/hashing first)
        run: make install
      - name: Test the embedded CLI SDK contracts and declarations
        run: node --test ../../apps/dcl-scene-cli/scripts/environment-sdk.test.mjs
      - name: Build
        id: build
        # a changed API report fails here; the regenerated files are still uploaded below
        continue-on-error: true
        run: make build
      - name: Test
        id: test
        run: make test
        env:
          # as upstream: the snapshot test rewrites a stale .crdt in place and still fails on it,
          # so the artifact below carries what to commit
          UPDATE_SNAPSHOTS: true
      - name: Test SDK init in isolation
        # A separate required check under the same 180 s command budget, even after suite failure.
        # The npm cache is warm and tests do not compete here; a pass does not prove cold or contended installs.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: node_modules/.bin/jest --detectOpenHandles --forceExit --colors --runTestsByPath test/sdk-commands/blackbox/init.spec.ts
        env:
          SDK_INIT_FIXTURE: isolated
      - name: Upload the regenerated API report and snapshots
        # what a local `make update-snapshots` would commit, for a reviewer or an author without the toolchain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-generated-${{ github.sha }}
          path: |
            library/js-sdk-toolchain/packages/@dcl/playground-assets/temp/playground-assets.api.md
            library/js-sdk-toolchain/test/snapshots/**/*.crdt
            library/js-sdk-toolchain/test/snapshots/**/*.ts
            !library/js-sdk-toolchain/test/snapshots/**/node_modules/**
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on a build error
        # also when Test failed first, or a build error hides behind the test failure
        if: ${{ !cancelled() && steps.build.outcome != 'success' }}
        run: |
          echo 'make build failed (see the Build step); its regenerated API report is in the sdk-generated artifact' >&2
          exit 1
      - name: Test the CLI
        run: make test-cli
      - name: Prepare releasable packages
        run: make prepare
        env:
          # nothing is published from this job, and @dcl/protocol and @dcl/hashing have no version published
          # from here yet: the packed manifests say so instead of naming a version that is not on npm
          PROTOCOL_VERSION: 0.0.0-unpublished.${{ github.sha }}
          HASHING_VERSION: 0.0.0-unpublished.${{ github.sha }}
      - name: Packed manifests name no local dependency
        run: |
          rm -rf .packed && mkdir .packed
          for tgz in packages/@dcl/*/*.tgz; do mkdir -p ".packed/$(basename "$tgz" .tgz)" && tar -xzf "$tgz" -C ".packed/$(basename "$tgz" .tgz)"; done
          node scripts/check-no-local-packages.cjs .packed
  scene-cli:
    name: dcl-scene-cli tests
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 60
    env:
      # the workspace toolchain file adds components and wasm targets these tests never use
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    defaults:
      run:
        working-directory: services/catalyst
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # golden, scene_editor and the script wrappers run node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - name: Prepare the pinned native toolchain for caching
        run: python3 ../../apps/bevy-explorer/prepare-native-cache.py
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/catalyst -> target
          key: sdk-scene-cli
          save-if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
      - name: Rust tests
        run: >-
          cargo test --locked --no-fail-fast
          -p dcl-scene-cli -p dcl-scene-authoring -p dcl-scene-build
          -p dcl-preview-tunnel -p dcl-preview-tunnel-protocol
      - name: Basis Universal encoder determinism (ignored by default as slow)
        run: cargo test --locked -p dcl-scene-cli --lib textures::basisu -- --ignored
      - name: Script tests
        # environment-sdk needs make install and runs in build-test
        working-directory: apps/dcl-scene-cli/scripts
        run: find . -maxdepth 1 -name '*.test.mjs' ! -name environment-sdk.test.mjs -exec node --test {} +
