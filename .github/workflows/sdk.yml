name: SDK / CI
on:
  push:
    branches: [main]
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - .github/workflows/sdk.yml
  pull_request:
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - .github/workflows/sdk.yml
permissions:
  contents: read
concurrency:
  group: sdk-ci-${{ github.ref }}
  # a newer push supersedes a PR run; main runs finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # the SDK's make install downloads protoc 3.20.1 for the runner's arch
  CI: true
  # playground-assets is built and tested with the rest but not published
  SDK_PACKAGES: ecs js-runtime react-ecs sdk-commands sdk
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          # library/protocol keeps no lockfile (it ignores package-lock.json)
          cache-dependency-path: library/js-sdk-toolchain/package-lock.json
      - name: Install (builds library/protocol's out-ts first)
        run: make install
      - name: Lint
        run: make lint
      - name: Package manifests agree
        run: make lint-packages
  build-test:
    name: Build, test, pack
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          # library/protocol keeps no lockfile (it ignores package-lock.json)
          cache-dependency-path: library/js-sdk-toolchain/package-lock.json
      - name: Install (builds library/protocol's out-ts first)
        run: make install
      - name: Build
        id: build
        # a changed API report fails here; the regenerated files are still uploaded below
        continue-on-error: true
        run: make build
      - name: Test
        run: make test
        env:
          # as upstream: the snapshot test rewrites a stale .crdt in place and still fails on it,
          # so the artifact below carries what to commit
          UPDATE_SNAPSHOTS: true
      - name: Upload the regenerated API report and snapshots
        # what a local `make update-snapshots` would commit, for a reviewer or an author without the toolchain
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-generated-${{ github.sha }}
          path: |
            library/js-sdk-toolchain/packages/@dcl/playground-assets/temp/playground-assets.api.md
            library/js-sdk-toolchain/test/snapshots/**/*.crdt
            library/js-sdk-toolchain/test/snapshots/**/*.ts
            !library/js-sdk-toolchain/test/snapshots/**/node_modules/**
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on a build error
        # also when Test failed first, or a build error hides behind the test failure
        if: ${{ !cancelled() && steps.build.outcome != 'success' }}
        run: |
          echo 'make build failed (see the Build step); its regenerated API report is in the sdk-generated artifact' >&2
          exit 1
      - name: Test the CLI
        run: make test-cli
      - name: Stamp the snapshot version into @dcl/sdk
        # <latest patch+1>-<run>.commit-<sha>, after the tests, which expect the placeholder;
        # make prepare copies it to the other packages.
        # Fork PRs keep the placeholder: nothing publishes them.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: decentraland/oddish-action@a4e98664bf53d4aae1f6d20d1a43ff2c79b555b3 # v1.0.1
        with:
          cwd: ./library/js-sdk-toolchain/packages/@dcl/sdk
          deterministic-snapshot: true
          only-update-versions: true
        env:
          # A PR checkout is a detached merge commit, so oddish cannot read the branch from git.
          BRANCH_NAME: ${{ github.head_ref }}
      - name: Prepare releasable packages
        run: make prepare
      - name: Packed manifests name no local dependency
        run: |
          rm -rf .packed && mkdir .packed
          for tgz in packages/@dcl/*/*.tgz; do mkdir -p ".packed/$(basename "$tgz" .tgz)" && tar -xzf "$tgz" -C ".packed/$(basename "$tgz" .tgz)"; done
          node scripts/check-no-local-packages.cjs .packed
          rm -rf dist && mkdir dist
          for name in $SDK_PACKAGES; do mv packages/@dcl/"$name"/*.tgz dist/; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-packages-${{ github.sha }}
          path: library/js-sdk-toolchain/dist/*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    # PR previews are published by sdk-preview.yml, which runs from main's copy of the workflow
    name: Publish next
    needs: [lint, build-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # only main may use it (a repository setting, so a branch cannot lift it); the npm trusted
    # publishers require it
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing — no token secret
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages-${{ github.sha }}
          path: dist
      - name: Publish in dependency order
        # a rerun of this run repeats the snapshot version, so packages already on npm are skipped
        run: |
          set -euo pipefail
          manifest() { tar -xOf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version'; }
          # the packages' scope (@dcl, or @dcl-regenesislabs while the @dcl names cannot be published from here)
          first=$(manifest ./dist/*-js-runtime-[0-9]*.tgz)
          scope=${first%%/*}; version=${first##*@}
          for name in $SDK_PACKAGES; do
            # ./ keeps npm from reading dist/<file> as a GitHub owner/repo shorthand
            tgz=./dist/${scope#@}-$name-$version.tgz
            spec=$scope/$name@$version
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already on npm; skipping"
            else
              npm publish "$tgz" --access public --tag next
            fi
          done
