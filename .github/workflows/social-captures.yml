name: Social source captures
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  social-captures:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
      # No install or source recapture: every test imports only Node and local tooling.
      - name: Test catalog validation and capture preflight failures
        run: node --test tooling/tests/social-*.test.cjs
      - name: Parse all 48 frozen fixtures and syntax check captures and helpers
        run: node tooling/social-capture-check.cjs
      - name: Validate generated ownership
        run: python3 tooling/owners.py --check
