name: Remove closed PR caches
on:
  pull_request_target:
    types: [closed]
permissions: {}
concurrency:
  group: closed-pr-cache-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # This privileged workflow never checks out code or downloads artifacts.
      # Only the trusted base workflow and GitHub's event/API data are used.
      - name: Delete caches belonging to this closed PR merge ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          number = os.environ['PR_NUMBER']
          if not re.fullmatch(r'[1-9][0-9]*', number):
              raise ValueError('Invalid pull request number')
          ref = f'refs/pull/{number}/merge'
          repository = os.environ['GITHUB_REPOSITORY']
          # Snapshot all pages before deleting, so pagination cannot skip entries.
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--method', 'GET', '--paginate', '--slurp',
              f'repos/{repository}/actions/caches', '-f', f'ref={ref}',
              '-f', 'per_page=100',
          ], text=True))
          cache_ids = {
              cache['id']
              for page in pages for cache in page['actions_caches']
              if cache.get('ref') == ref and type(cache.get('id')) is int
          }
          for cache_id in sorted(cache_ids):
              subprocess.run([
                  'gh', 'api', '--method', 'DELETE',
                  f'repos/{repository}/actions/caches/{cache_id}',
              ], check=True)
          print(f'Removed {len(cache_ids)} cache entries for {ref}')
          PY
