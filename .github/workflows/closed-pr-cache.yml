name: Remove closed PR caches
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
# Pending close events can coalesce; the hourly sweep also removes late uploads
# and caches from any close event replaced while another cleanup was running.
concurrency:
  group: closed-pr-cache
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      # This privileged workflow never checks out code or downloads artifacts.
      # Only the trusted base workflow and GitHub's event/API data are used.
      - name: Delete caches belonging to this closed PR merge ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          number = os.environ.get('PR_NUMBER', '')
          event = os.environ.get('GITHUB_EVENT_NAME', 'pull_request')
          targeted = event == 'pull_request'
          if targeted and not re.fullmatch(r'[1-9][0-9]*', number):
              raise ValueError('Invalid pull request number')
          if event not in ('pull_request', 'schedule', 'workflow_dispatch'):
              raise ValueError('Unsupported cleanup event')
          ref = f'refs/pull/{number}/merge' if targeted else None
          repository = os.environ['GITHUB_REPOSITORY']
          # Snapshot all pages before deleting, so pagination cannot skip entries.
          request = [
              'gh', 'api', '--method', 'GET', '--paginate', '--slurp',
              f'repos/{repository}/actions/caches', '-f', 'per_page=100',
          ]
          if targeted:
              request += ['-f', f'ref={ref}']
          pages = json.loads(subprocess.check_output(request, text=True))
          caches = [cache for page in pages for cache in page['actions_caches']
                    if type(cache.get('id')) is int]
          cache_ids, closed, snapshots, images = set(), {}, {}, {}
          # The smoke snapshots and every rust-cache key, whose prefix ends with the platform.
          # A flake hash inside a prefix folds away, so a flake update supersedes the entry.
          namespace = re.compile(r'^foundation-dev-v2-smoke-' + re.escape(repository)
                                 + r'-(Linux|macOS)-(X64|ARM64)-'
                                 r'|^v0-rust-.+?-(Linux|Darwin|Windows_NT)-(x64|arm64)-')
          image_namespace = re.compile(
              r'images-v2-(main|pr-[1-9][0-9]*)-(catalyst|sites|apis)-(amd64|arm64)-[0-9a-f]{64}')
          for cache in caches:
              cache_ref = cache.get('ref', '')
              if targeted:
                  if cache_ref == ref:
                      cache_ids.add(cache['id'])
                  continue
              match = re.fullmatch(r'refs/pull/([1-9][0-9]*)/merge', cache_ref)
              if match:
                  pr = match[1]
                  if pr not in closed:
                      payload = json.loads(subprocess.check_output([
                          'gh', 'api', f'repos/{repository}/pulls/{pr}',
                      ], text=True))
                      closed[pr] = payload['state'] == 'closed'
                  if closed[pr]:
                      cache_ids.add(cache['id'])
                      continue
              elif cache_ref != 'refs/heads/main':
                  continue
              image = image_namespace.fullmatch(cache.get('key', ''))
              scope = f'pr-{match[1]}' if match else 'main'
              if image and image[1] == scope:
                  images.setdefault((cache_ref, image[2], image[3]), []).append(cache)
              family = namespace.match(cache.get('key', ''))
              if family:
                  prefix = re.sub(r'[0-9a-f]{64}', '*', family.group())
                  snapshots.setdefault((cache_ref, prefix), []).append(cache)
          # Keep the newest entry per prefix, platform and ref. Only first attempts save, and
          # the workflows with a per-ref concurrency group run main in push order; elsewhere
          # an older run that saves later costs one miss until the next main save.
          for entries in snapshots.values():
              entries.sort(key=lambda cache: (cache.get('created_at', ''), cache['id']), reverse=True)
              cache_ids.update(cache['id'] for cache in entries[1:])
          # Preserve two image generations for overlapping builds. Delete only IDs
          # in this listing; concurrent uploads are handled by a later sweep.
          for entries in images.values():
              entries.sort(key=lambda cache: (cache.get('created_at', ''), cache['id']), reverse=True)
              cache_ids.update(cache['id'] for cache in entries[2:])
          for cache_id in sorted(cache_ids):
              subprocess.run([
                  'gh', 'api', '--method', 'DELETE',
                  f'repos/{repository}/actions/caches/{cache_id}',
              ], check=True)
          print(f'Removed {len(cache_ids)} cache entries; inspected {len(caches)} entries, '
                f'{sum(cache.get("size_in_bytes", 0) for cache in caches)} bytes')
          PY
