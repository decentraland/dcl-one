name: Shared UI library key scan

# The Figma file key check. It runs from the default branch, never from a pull request: workflow_run always
# uses main's copy of this file, the only checkout is main (trusted/), and the pull request's commits and its
# Review build are read as data (Git objects and a downloaded artifact) by main's key guard. No pull request
# file is ever executed while FIGMA_FILE_KEY is set. ui-library.yml itself holds no secret.
on:
  workflow_run:
    workflows: ['Shared UI library']
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read

# Git reads no system or global configuration anywhere in this workflow.
env:
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_CONFIG_GLOBAL: /dev/null

concurrency:
  group: ui-library-key-scan-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  key-scan:
    runs-on: ubuntu-26.04
    steps:
      # No FIGMA_FILE_KEY is in scope here. Anything unexpected ends the job before the key is read. The
      # triggering workflow is pinned by its file path and by the id GitHub assigns to that file, resolved
      # through the API from this repository, never by display name.
      - name: Validate the triggering run
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          skip() { echo "scan=false" >> "$GITHUB_OUTPUT"; echo "not scanned: $1"; exit 0; }
          [ "$WORKFLOW_PATH" = .github/workflows/ui-library.yml ] || skip "triggered by another workflow file"
          expected_id=$(gh api "repos/$REPOSITORY/actions/workflows/ui-library.yml" --jq .id) || skip "workflow id unavailable"
          [ "$WORKFLOW_ID" = "$expected_id" ] || skip "triggered by another workflow id"
          [ "$CONCLUSION" = success ] || skip "the run concluded $CONCLUSION"
          [ "$HEAD_REPO" = "$REPOSITORY" ] || skip "the head repository is not this repository"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[0-9]+$ ]] || skip "unexpected head sha or run id"
          if [ "$EVENT" = pull_request ]; then
            [ "$(jq 'length' <<< "$PULL_REQUESTS")" = 1 ] || skip "not exactly one pull request"
            base=$(jq -r '.[0].base.sha' <<< "$PULL_REQUESTS")
            head=$(jq -r '.[0].head.sha' <<< "$PULL_REQUESTS")
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || skip "unexpected pull request base"
            [ "$head" = "$HEAD_SHA" ] || skip "the pull request head is not the run's head"
          elif [ "$EVENT" = push ] && [ "$HEAD_BRANCH" = "$DEFAULT_BRANCH" ]; then
            # workflow_run omits push.before. Read it from the controller-generated job name, not from
            # artifact contents, step output or a commit message that pull request code can influence.
            boundary=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
              --jq ".jobs[] | select(.run_id == $RUN_ID and .head_sha == \"$HEAD_SHA\" and .conclusion == \"success\" and (.name | startswith(\"UI key push boundary \"))) | .name")
            pattern='^UI key push boundary ([0-9a-f]{40})\.\.([0-9a-f]{40})$'
            if [[ ! "$boundary" =~ $pattern ]]; then
              echo "Missing or ambiguous trusted push boundary" >&2
              exit 1
            fi
            base="${BASH_REMATCH[1]}"
            [ "${BASH_REMATCH[2]}" = "$HEAD_SHA" ] || { echo "Push boundary head mismatch" >&2; exit 1; }
          else
            skip "event $EVENT on $HEAD_BRANCH"
          fi
          artifact="ui-review-$HEAD_SHA"
          count=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq "[.artifacts[] | select(.name == \"$artifact\" and .workflow_run.id == $RUN_ID and .workflow_run.head_sha == \"$HEAD_SHA\")] | length" | paste -sd+ - | bc)
          [ "$count" = 1 ] || skip "the run has no single artifact named for its head sha"
          {
            echo "scan=true"
            echo "head=$HEAD_SHA"
            echo "base=$base"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.trigger.outputs.scan == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      # The scanned commits enter the object store under a private ref. Nothing is checked out from them. LFS
      # objects come from this repository's own fixed endpoint, through main's configuration only (no system or
      # global Git config, and the scanned commits' .lfsconfig and .gitattributes are never read), and only for
      # library/ui. The read token reaches Git through the environment of this one step and is not persisted.
      - name: Fetch the scanned commits and their library/ui LFS objects
        if: steps.trigger.outputs.scan == 'true'
        env:
          HEAD_SHA: ${{ steps.trigger.outputs.head }}
          BASE: ${{ steps.trigger.outputs.base }}
          REPOSITORY: ${{ github.repository }}
          READ_TOKEN: ${{ github.token }}
        run: |
          header=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_1=lfs.url
          export GIT_CONFIG_VALUE_1="https://github.com/$REPOSITORY.git/info/lfs"
          git -C trusted fetch --no-tags --no-recurse-submodules origin "+$HEAD_SHA:refs/key-scan/head"
          if [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git -C trusted fetch --no-tags --no-recurse-submodules origin "+$BASE:refs/key-scan/base"
          fi
          git -C trusted lfs fetch --include "library/ui/**" origin "$HEAD_SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.trigger.outputs.scan == 'true'
        with:
          name: ${{ steps.trigger.outputs.artifact }}
          path: ${{ runner.temp }}/pr-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.trigger.outputs.scan == 'true'
        with:
          node-version: 24

      # The only step that holds the key: main's key guard over the scanned commits, their library/ui tree and
      # the unpacked Review build (enumerated without following links, and size and count limited), all as data.
      - name: Scan for the Figma file key
        id: scan
        if: steps.trigger.outputs.scan == 'true'
        env:
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
          HEAD_SHA: ${{ steps.trigger.outputs.head }}
          BASE: ${{ steps.trigger.outputs.base }}
        run: |
          set -o pipefail
          range="$BASE..$HEAD_SHA"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then range="$HEAD_SHA"; fi
          node trusted/library/ui/figma/key-guard.mjs --root trusted --no-worktree \
            --range "$range" --tree "$HEAD_SHA:library/ui" --allowlist-from "$HEAD_SHA" \
            --artifact "$RUNNER_TEMP/pr-artifact" | tee "$RUNNER_TEMP/key-scan.txt"
          grep -qx 'check key: ran' "$RUNNER_TEMP/key-scan.txt"

      # The summary is the scanner's stdout alone, which the scanner redacts: the key never appears in a path,
      # a finding or an error line it prints. Its stderr stays in the job log and is never part of the summary.
      - name: Report the result on the scanned commit
        if: always() && steps.trigger.outputs.scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.trigger.outputs.head }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          conclusion=failure
          [ "$OUTCOME" = success ] && conclusion=success
          summary=$(head -c 60000 "$RUNNER_TEMP/key-scan.txt" 2> /dev/null || echo "The scan did not run.")
          gh api --method POST "repos/$REPOSITORY/check-runs" \
            -f name='UI library key scan' -f head_sha="$HEAD_SHA" -f status=completed \
            -f conclusion="$conclusion" -f "output[title]=Figma file key scan: $conclusion" \
            -f "output[summary]=$summary" > /dev/null
