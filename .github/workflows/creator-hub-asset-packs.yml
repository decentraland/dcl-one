name: Asset Packs
on:
  workflow_call:
    outputs:
      s3_bucket_key:
        description: "S3 bucket key for the published Asset Packs package"
        value: ${{ jobs.publish.outputs.s3_bucket_key }}
      version:
        description: "Version of the Asset Packs package"
        value: ${{ jobs.version.outputs.version }}
      changed:
        description: "Whether the version of the Asset Packs package has changed"
        value: ${{ jobs.version.outputs.changed }}

defaults:
  run:
    shell: 'bash'
    working-directory: apps/creator-hub

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Bump release version
        id: version
        uses: paulhatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: "@dcl/asset-packs@"
          version_format: ${major}.${minor}.${patch}
          major_pattern: "/^(major|breaking).+/"
          minor_pattern: "/^(minor|feat).+/"
          bump_each_commit: false
          bump_each_commit_patch_pattern: "/^(patch|fix).+/"
          search_commit_body: true
          user_format_type: "json"
          change_path: "apps/creator-hub/packages/asset-packs"

      # With no `@dcl/asset-packs@X.Y.Z` tag, semantic-version counts from 0.0.0, and a release on main
      # would publish 0.1.0 as the npm `latest`. Tag the last released version first (cut-over runbook).
      - name: Require a baseline version tag on main
        if: github.ref == 'refs/heads/main'
        env:
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
        run: |
          if [ "$PREVIOUS_VERSION" = 0.0.0 ]; then
            echo "::error::No @dcl/asset-packs@X.Y.Z tag found; tag the last released version before releasing from main"
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    needs: [version]
    if: ${{ needs.version.outputs.changed == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/creator-hub-lfs
      - uses: ./.github/actions/creator-hub-setup
        id: setup

      - name: install
        if: steps.setup.outputs.node-modules-cache-hit != 'true'
        run: npm i --silent && make install-asset-packs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: validate
        run: make validate-asset-packs

  publish:
    runs-on: ubuntu-latest
    needs: [version, validate]
    # npm trusted publishing names this environment for main; PR builds publish nothing to npm.
    environment: ${{ github.ref == 'refs/heads/main' && 'creator-hub-release' || '' }}
    if: ${{ needs.version.outputs.changed == 'true' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      s3_bucket_key: ${{ steps.s3-upload.outputs.s3-key }}
    env:
      # Fork and Dependabot PRs get no secrets and no OIDC token, so they build and pack without
      # uploading, as creator-hub-desktop.yml does.
      CAN_UPLOAD: ${{ secrets.SDK_TEAM_S3_BUCKET != '' && vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/creator-hub-lfs

      - uses: ./.github/actions/creator-hub-setup
        id: setup

      - name: install
        if: steps.setup.outputs.node-modules-cache-hit != 'true'
        run: npm i --silent && make install-asset-packs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: build
        run: make build-asset-packs

      - name: copy bin to dist
        working-directory: apps/creator-hub/packages/asset-packs
        run: cp -r bin dist

      - name: npm version
        working-directory: apps/creator-hub/packages/asset-packs
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="${{ needs.version.outputs.version }}"
          else
            VERSION="${{ needs.version.outputs.version }}-commit-${{ github.sha }}"
          fi
          npm version "$VERSION" --force --no-git-tag-version --allow-same-version

      - name: npm pack
        working-directory: apps/creator-hub/packages/asset-packs
        id: npm-pack
        run: |
          PACK_OUTPUT=$(npm pack --json)
          PACK_FILENAME=$(echo "$PACK_OUTPUT" | jq -r '.[0].filename')
          echo "pack-filename=$PACK_FILENAME" >> $GITHUB_OUTPUT

      - name: upload package to S3
        if: env.CAN_UPLOAD == 'true'
        uses: ./.github/actions/creator-hub-s3-upload
        id: s3-upload
        with:
          file-path: apps/creator-hub/packages/asset-packs/${{ steps.npm-pack.outputs.pack-filename }}
          bucket: ${{ secrets.SDK_TEAM_S3_BUCKET }}
          region: ${{ secrets.SDK_TEAM_AWS_REGION }}
          prefix: 'creator-hub/branch/${{ github.head_ref || github.ref }}/@dcl/asset-packs'
          role-to-assume: ${{ vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN }}
          content-type: 'application/gzip'
          acl: 'public-read'
          cache-control: 'max-age=0,private'

      - name: publish to npm registry
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/creator-hub-npm-publish
        id: npm-publish
        with:
          working-directory: apps/creator-hub/packages/asset-packs
          initial-tag: 'latest'
          access: 'public'

  upload:
    runs-on: ubuntu-latest
    needs: [version, publish]
    if: ${{ needs.version.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
    environment: creator-hub-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/creator-hub-lfs
      - uses: ./.github/actions/creator-hub-setup
        id: setup

      - name: install
        if: steps.setup.outputs.node-modules-cache-hit != 'true'
        run: npm i --silent && make install-asset-packs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: build
        run: make build-asset-packs

      - name: AWS role for the production asset CDN
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CREATOR_HUB_ASSETS_PRD_ROLE_ARN }}
          aws-region: us-east-1

      - name: upload assets to S3 prod
        run: make upload-asset-packs
        env:
          S3_BUCKET_NAME: ${{ secrets.BUILDER_ITEMS_S3_BUCKET_PRD }}
          S3_REGION: us-east-1
          S3_UPLOAD_CONCURRENCY: 20

  notify:
    needs: [version, publish]
    if: ${{ github.event.pull_request.number && needs.version.outputs.changed == 'true' && needs.publish.outputs.s3_bucket_key != '' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Test @dcl/asset-packs package

      - name: create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            # Test @dcl/asset-packs package

            - Install via NPM:
              ```bash
              npm install "${{ secrets.SDK_TEAM_S3_BASE_URL }}/${{ needs.publish.outputs.s3_bucket_key }}"
              ```

            > **Note:** If new assets are added in this PR, they won't be available on the CDN until the PR is merged. This package can be used to test changes to the library code or `catalog.json`, but won't work for testing newly added items.
          edit-mode: replace

  # Tags the version only once its media is on the production CDN (`upload`, main only): a failed
  # upload leaves the version untagged, so the next run uploads it again.
  release:
    needs: [version, publish, upload]
    if: ${{ needs.version.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: generate release notes
        if: ${{ github.ref == 'refs/heads/main' }}
        id: release_notes
        uses: ./.github/actions/creator-hub-generate-release-notes
        with:
          previous_version: ${{ needs.version.outputs.previous_version }}
          current_version: ${{ needs.version.outputs.version }}
          paths: 'apps/creator-hub/packages/asset-packs'
          section_names: 'Asset Packs Changes'
          release_title: '@dcl/asset-packs'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: '@dcl/asset-packs@'

      - name: update release description
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/creator-hub-update-release-description
        with:
          tag_name: "@dcl/asset-packs@${{ needs.version.outputs.version }}"
          release_notes: ${{ steps.release_notes.outputs.release_notes }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_if_not_exists: true
          prerelease: true
