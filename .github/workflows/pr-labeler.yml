name: PR labeler
# Labels pull requests by changed paths (rules in .github/labeler.yml).
# Same-repository PRs get the declared write token and nothing is checked out.
# Fork and Dependabot PRs only get a read-only token, so they are skipped;
# Dependabot labels its own PRs from .github/dependabot.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
