name: PR labeler
# Labels pull requests by changed paths (rules in .github/labeler.yml).
# pull_request_target runs with a write token on the base ref and checks out
# nothing, so fork PRs get labelled without executing their code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
