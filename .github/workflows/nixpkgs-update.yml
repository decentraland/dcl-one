name: Update nixpkgs
# flake.nix pins nixpkgs by commit. On the first of each month this moves the pin to the
# nixos-unstable tip, relocks, evaluates the flake for every supported system and opens or
# refreshes one pull request on the update/nixpkgs branch; tooling/nixpkgs-update.py does the
# update. Monthly, because every update rolls the caches keyed on flake.lock. The pull request
# comes from a GitHub App, since Actions may not open pull requests in this repository and one
# opened with the workflow token would run no checks: the variable NIXPKGS_UPDATE_APP_ID and the
# secret NIXPKGS_UPDATE_APP_PRIVATE_KEY name an app installed here with contents and pull
# requests write access.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: nixpkgs-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.NIXPKGS_UPDATE_APP_ID }}
          private-key: ${{ secrets.NIXPKGS_UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Move the nixpkgs pin to the nixos-unstable tip
        id: update
        run: python3 tooling/nixpkgs-update.py
      - name: Evaluate the flake for every supported system
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --all-systems --no-build
      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}[bot]
          OLD: ${{ steps.update.outputs.old }}
          NEW: ${{ steps.update.outputs.new }}
          DATE: ${{ steps.update.outputs.date }}
        run: |
          git config user.name "$APP"
          git config user.email "$(gh api "users/$APP" --jq .id)+$APP@users.noreply.github.com"
          branch=update/nixpkgs
          title="chore: update nixpkgs to nixos-unstable $DATE"
          body="Moves the nixpkgs pin from ${OLD:0:12} to ${NEW:0:12}, the nixos-unstable tip of $DATE. The flake evaluated for every supported system; generated by the Update nixpkgs workflow."
          git checkout -B "$branch"
          git add flake.nix flake.lock
          git commit -m "$title" -m "nixpkgs ${OLD:0:12} -> ${NEW:0:12}, generated by tooling/nixpkgs-update.py."
          git push --force origin "$branch"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head "$branch" --title "$title" --body "$body"
          fi
