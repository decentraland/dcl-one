name: Development environment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flake.*'
      - 'infra/dev/**'
      - 'infra/gateway/**'
      - 'infra/packages/**'
      - 'tooling/dev*'
      - 'tooling/catalyst-test*'
      - 'tooling/enet-provenance.py'
      - 'tooling/*.py'
      - 'tooling/tests/**'
      - 'tooling/migration/**'
      - 'services/catalyst/**'
      # the node never links the scene CLI, but the workspace reads its manifest; sdk.yml lints its sources
      - 'apps/dcl-scene-cli/Cargo.toml'
      - 'library/**'
      - '.cargo/**'
      - 'apps/sites/**'
      - 'apps/ui3/**'
      # the editor scene's install copies it (apps/ui3/editor-scene/pnpm-workspace.yaml)
      - 'apps/creator-hub/packages/zip-extract/**'
      - 'schemas/**'
      - 'Makefile'
      - '.github/workflows/development.yml'
      - '.github/workflows/bevy-explorer-benchmark.yml'
      # tooling/tests/test_dev_workflow.py reads its label logic
      - '.github/workflows/creator-hub-ci.yml'
      # tooling/tests/test_dev_workflow.py and test_image_cache.py run its sweep script
      - '.github/workflows/closed-pr-cache.yml'
      - '!**/*.md'
      - '!docs/**'
      - '!services/catalyst/docs/**'
      - '!rendering/bevy-explorer/docs/**'
      - 'apps/sites/content/**'
      - 'services/catalyst/**/tests/fixtures/**'
      - 'library/**/tests/fixtures/**'
  # Every pull request, so "CI gate" always reports and can be a required check; the `changes` plan skips the
  # heavy jobs when nothing under push.paths changed (a skipped job counts as passing for a required check).
  # ready_for_review: the Explorer CI gate fails a draft's held run, so the smoke job reads the ready run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  actions: read
concurrency:
  group: development-${{ github.ref }}
  # Main runs finish: they are the macOS check for source that PRs test on Linux only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  ERROR_PAGE_LFS: library/ui/apps/sites/assets/errors/**,library/ui/assets/**,library/ui/foundations/typography/fonts/**
jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      web-units: ${{ steps.web-coverage.outputs.run-web-unit-tests }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select the jobs
        id: plan
        env:
          CI_MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
        run: python3 tooling/dev-ci.py plan
      - name: Select web unit coverage
        id: web-coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tooling/dev-ci.py
  rust:
    name: Rust tests
    needs: changes
    # Runs whatever the plan's outcome unless it found nothing to test or no input of the Rust tests; without a
    # plan (other events, a failed plan job) it runs. PRs run on Linux; main and the ci:macos label add macOS.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos') && '["ubuntu-26.04"]' || '["ubuntu-26.04", "macos-15"]') }}
        # Each shard builds its assigned integration tests and runs the binaries selected by recorded times.
        # One shard also runs the provisioned Archipelago tests (CATALYST_TEST_PROVISIONED_SHARD).
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os == 'ubuntu-26.04' && (vars.RUNNER_LINUX_X86 || 'ubuntu-26.04')
      || matrix.os == 'macos-15' && (vars.RUNNER_MACOS || 'macos-15')
      || matrix.os }}
    timeout-minutes: 100
    env:
      CATALYST_TEST_SHARD: ${{ matrix.shard }}/3
      CATALYST_TEST_PROVISIONED_SHARD: '1'
      # The doc-tests run in one shard (tooling/catalyst-test.sh).
      CATALYST_TEST_DOC_SHARD: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FOUNDATION_DEV_STARTUP_TIMEOUT: '120'
      # The cluster holds only scratch databases; see tooling/dev.py DISPOSABLE_POSTGRES_SETTINGS.
      FOUNDATION_DEV_DISPOSABLE_POSTGRES: '1'
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # The catalyst test build, the Nix store and the pnpm store can fill the disk of a hosted runner.
          # The delete takes time, so it runs only when 25 GB or less is free.
          avail=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)
          if [ "${avail:-0}" -le 25 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          fi
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && matrix.shard == 1 }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop .#ci --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Verify the exact public ENet source pin
        run: nix develop .#ci --command python3 tooling/enet-provenance.py
      - name: Put the Nix Rust toolchain on PATH for the cache action
        run: |
          toolchain=$(dirname "$(nix develop .#ci --command bash -c 'command -v cargo')")
          test -x "$toolchain/rustc"
          echo "$toolchain" >> "$GITHUB_PATH"
      - name: Restore the Rust dependency cache
        id: deps
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # The key hashes every toolchain rustup lists, so the runner image's own would
          # miss the cache on each image update. An unusable home makes rustup fail, and
          # only the Nix rustc counts.
          RUSTUP_HOME: /dev/null
        with:
          # Dependencies only: before saving, the action removes the output of the crates
          # under services/catalyst (every test binary of theirs) and the extracted registry
          # sources, so the entry stays near one gigabyte instead of accumulating a full
          # artifact set per Cargo.lock change. The library members outside that directory
          # stay in the entry; their output is tens of megabytes.
          # flake.lock joins the key because the action cannot see the Nix-provided libraries.
          # First attempts only: a re-run of an older main run would save a superseded
          # entry as the newest one, and the sweep keeps the newest.
          workspaces: services/catalyst
          shared-key: dev-tests-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && matrix.shard == 1 }}
          cache-on-failure: true
      # cache-hit is false for a partial match too, which is every PR whose manifests differ
      # from main's last save; the restored target directory tells it apart from a miss.
      - name: Check whether the dependency cache restored an entry
        id: deps-restored
        run: |
          if [ -d services/catalyst/target/debug/deps ]; then restored=true; else restored=false; fi
          echo "restored=$restored" >> "$GITHUB_OUTPUT"
          # The v8 build script copies the prebuilt library to target/debug/gn_out, which the
          # dependency cache does not keep, while it keeps the script's fingerprint. When a
          # changed Cargo.lock makes v8 itself recompile, the script counts as fresh and the
          # link finds no rusty_v8; dropping its fingerprint makes it copy the library again.
          # An exact cache hit has nothing to recompile, so it keeps the fingerprint.
          if [ "$restored" = true ] && [ "${{ steps.deps.outputs.cache-hit }}" != true ] && ! compgen -G 'services/catalyst/target/debug/gn_out/obj/*rusty_v8*' > /dev/null; then
            rm -rf services/catalyst/target/debug/build/v8-* services/catalyst/target/debug/.fingerprint/v8-*
          fi
      # Optional: without the tool, or without its server, the tests compile as before.
      - name: Install the optional compiler cache
        id: compiler-cache
        continue-on-error: true
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
          disable_annotations: true
      - name: Run backend tests with PostgreSQL and isolated NATS
        env:
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_GHA_VERSION: dcl-dev-rust-tests-v1
          # The server stays until the job ends, so the statistics after the tests are complete.
          SCCACHE_IDLE_TIMEOUT: '0'
          # Only with the dependencies restored, from an exact or a partial key: the compiler cache
          # then holds what that entry does not, the workspace crates, the separate rusty_enet
          # workspace (about 40 results) and usually only the few changed dependencies.
          USE_COMPILER_CACHE: ${{ steps.deps-restored.outputs.restored == 'true' && steps.compiler-cache.outcome == 'success' }}
        run: |
          # The wrapper is set here, not in the job environment, so the dependency cache key stays
          # unchanged, and only after the server starts against the GitHub cache.
          if [ "$USE_COMPILER_CACHE" = true ] && sccache --start-server; then
            export RUSTC_WRAPPER=sccache
          else
            echo "Compiler cache off: the tests compile without it."
          fi
          status=0
          nix develop .#ci --command bash tooling/dev-test.sh rust || status=$?
          [ -z "${RUSTC_WRAPPER:-}" ] || sccache --show-stats || true
          exit "$status"
      - name: Run provisioned auth stress
        if: matrix.shard == 2
        run: |
          source tooling/catalyst-test-resources.sh
          if [ "$RUNNER_OS:$RUNNER_ENVIRONMENT" = macOS:github-hosted ]; then provision_hosted_macos_test_resources; fi
          nix develop .#ci --command bash -euo pipefail -c '
          source tooling/catalyst-test-resources.sh
          prepare_catalyst_test_resources
          python3 tooling/dev-regressions.py --auth-stress
          '
      - name: Preserve database logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-rust-logs-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}
          path: .cache/dev/*.log
          retention-days: 7
  clippy:
    name: Rust clippy
    needs: changes
    # Same selection as the Rust tests; Linux only, the lints do not depend on the platform.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' && needs.changes.outputs.rust != 'false' }}
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop .#ci --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Put the Nix Rust toolchain on PATH for the cache action
        run: |
          toolchain=$(dirname "$(nix develop .#ci --command bash -c 'command -v cargo')")
          test -x "$toolchain/rustc"
          echo "$toolchain" >> "$GITHUB_PATH"
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Only the Nix rustc enters the key; see the Rust tests job.
          RUSTUP_HOME: /dev/null
        with:
          # Clippy keeps check metadata, not the test build's artifacts, so it has its own entry.
          workspaces: services/catalyst -> target-clippy
          shared-key: dev-clippy-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          cache-on-failure: true
      - name: Clippy over every workspace target
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/services/catalyst/target-clippy
        run: |
          nix develop .#ci --command \
            cargo clippy --manifest-path services/catalyst/Cargo.toml --locked --workspace --all-targets -- -D warnings
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos') && '["ubuntu-26.04"]' || '["ubuntu-26.04", "macos-15"]') }}
    runs-on: ${{ matrix.os == 'ubuntu-26.04' && (vars.RUNNER_LINUX_X86 || 'ubuntu-26.04')
      || matrix.os == 'macos-15' && (vars.RUNNER_MACOS || 'macos-15')
      || matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FOUNDATION_DEV_STARTUP_TIMEOUT: '5400'
      FOUNDATION_PLAY_WAIT_SECONDS: '5400'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # The catalyst test build, the Nix store and the pnpm store can fill the disk of a hosted runner.
          # The delete takes time, so it runs only when 25 GB or less is free.
          avail=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)
          if [ "${avail:-0}" -le 25 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          fi
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the embedded error-page images and fonts
        run: git lfs pull --include="$ERROR_PAGE_LFS" --exclude=''
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-default-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-default-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Evaluate supported systems
        run: nix flake show --all-systems
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Identify Rust build inputs
        id: rust-inputs
        shell: bash
        run: |
          # Hash tracked inputs, not the commit: unrelated documentation edits
          # reuse a snapshot, while schema, protocol and vendored SDK edits do not.
          source=$(git ls-tree -r HEAD -- services/catalyst library schemas .cargo apps/dcl-scene-cli flake.nix Makefile tooling infra/dev infra/packages .github/workflows/development.yml | git hash-object --stdin)
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: foundation-dev-v2-smoke-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}-${{ steps.rust-inputs.outputs.source }}
          restore-keys: |
            foundation-dev-v2-smoke-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}-
            foundation-dev-v2-smoke-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-
      - name: Give unchanged sources the file times of the snapshot
        # Cargo compares file times, and a checkout gives every file the current time. Without this
        # step Cargo compiles every workspace crate again although the snapshot holds them.
        run: |
          if [ -d services/catalyst/target ]; then du -k -d 2 services/catalyst/target | sort -nr; fi
          python3 tooling/cargo-mtimes.py restore services/catalyst/target
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/*/pnpm-lock.yaml') }}
          restore-keys: |
            foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Start the API and web app without upstream data
        run: nix develop --command bash tooling/dev-smoke.sh
      - name: Measure Rust build directories after smoke
        if: always()
        run: |
          if [ -d services/catalyst/target ]; then du -k -d 2 services/catalyst/target | sort -nr; fi
      - name: Run Sites end-to-end tests against the development stack
        timeout-minutes: 75
        run: nix develop --command bash tooling/dev-test.sh e2e
      - name: Show the service logs
        if: failure()
        run: |
          for log in .cache/dev/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 150 "$log"
            echo "::endgroup::"
          done
      - name: Preserve startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-logs-${{ runner.os }}-${{ runner.arch }}
          path: .cache/dev/*.log
          retention-days: 7
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Prune superseded Rust build artifacts from the smoke snapshot
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          echo "Before pruning (KiB)"
          du -k -d 2 services/catalyst/target | sort -nr
          nix develop --command python3 tooling/catalyst-smoke-cache.py
          echo "After pruning (KiB)"
          du -k -d 2 services/catalyst/target | sort -nr
      - name: Record the source file times in the snapshot
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        run: python3 tooling/cargo-mtimes.py record services/catalyst/target
      - name: Save successful smoke build snapshot
        # PR smoke jobs restore main's snapshots without creating multi-GB copies.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  # The tooling unit tests read only the source and the dev shell, whose binaries start the PostgreSQL
  # clusters they test, so they run beside smoke.
  tooling:
    name: Tooling tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos') && '["ubuntu-26.04"]' || '["ubuntu-26.04", "macos-15"]') }}
    runs-on: ${{ matrix.os == 'ubuntu-26.04' && (vars.RUNNER_LINUX_X86 || 'ubuntu-26.04')
      || matrix.os == 'macos-15' && (vars.RUNNER_MACOS || 'macos-15')
      || matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-default-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-default-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Check configuration and PostgreSQL lifecycle
        timeout-minutes: 20
        run: nix develop --command python3 -m unittest discover -s tooling/tests -v

  web:
    name: Web tests and contracts (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: [sites, ui3]
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned docs integration-test diagram and the error-page art, background and Inter files the static pages embed
        run: git lfs pull --include="apps/sites/content/docs/creator/images/wearables-and-emotes/creating-wearables/19_skin_uv.webp,${ERROR_PAGE_LFS}" --exclude=''
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-default-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-default-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' && matrix.app == 'ui3' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/*/pnpm-lock.yaml') }}
          restore-keys: |
            foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install web dependencies
        run: |
          nix develop --command pnpm --dir apps/ui3 install --frozen-lockfile
          nix develop --command pnpm --dir apps/sites install --frozen-lockfile
      - name: Run UI3 unit tests
        if: matrix.app == 'ui3' && needs.changes.outputs.web-units != 'false'
        timeout-minutes: 20
        run: nix develop --command pnpm --dir apps/ui3 test
      - name: Run UI3 browser tests
        if: matrix.app == 'ui3' && needs.changes.outputs.web-units != 'false'
        timeout-minutes: 10
        run: nix develop --command pnpm --dir apps/ui3 test:browser
      - name: Run Sites unit tests
        id: sites-tests
        if: matrix.app == 'sites' && needs.changes.outputs.web-units != 'false'
        timeout-minutes: 20
        run: nix develop --command pnpm --dir apps/sites test
      - name: Diagnose isolated header geometry startup
        if: ${{ failure() && steps.sites-tests.outcome == 'failure' && steps.sites-tests.outputs.capture-missing-port == 'true' }}
        timeout-minutes: 4
        run: nix develop --command pnpm --dir apps/sites test src/features/components/chrome/header-geometry.test.ts
      - name: Run editor scene unit tests
        if: matrix.app == 'ui3' && needs.changes.outputs.web-units != 'false'
        timeout-minutes: 20
        run: |
          nix develop --command pnpm --dir apps/ui3/editor-scene install --frozen-lockfile
          nix develop --command pnpm --dir apps/ui3/editor-scene test
      - name: Check UI3 types
        if: matrix.app == 'ui3'
        timeout-minutes: 15
        run: nix develop --command pnpm --dir apps/ui3 typecheck
      - name: Check Sites types and generated artifacts
        if: matrix.app == 'sites'
        timeout-minutes: 15
        run: |
          nix develop --command pnpm --dir apps/sites typecheck
          nix develop --command pnpm --dir apps/sites typecheck:scripts
          for check in gen:schemas:check schemas:honesty:check schemas:dupes:check telemetry:check check:flowmap; do
            nix develop --command pnpm --dir apps/sites "$check"
          done
      - name: Save the pnpm store from main
        if: matrix.app == 'ui3' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  # The one check to mark required on main. It always reports: green when the Rust, smoke, tooling and web jobs
  # passed or were skipped because nothing they test changed, red when one failed, was cancelled or is missing.
  gate:
    name: CI gate
    # The tooling tests include the workflow tests: they check that the Rust shards cover every test.
    needs: [changes, rust, clippy, smoke, tooling, web]
    if: ${{ always() }}
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - name: Require the Rust, clippy, smoke, tooling and web jobs to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          CLIPPY: ${{ needs.clippy.result }}
          SMOKE: ${{ needs.smoke.result }}
          TOOLING: ${{ needs.tooling.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "changes=$CHANGES rust=$RUST clippy=$CLIPPY smoke=$SMOKE tooling=$TOOLING web=$WEB"
          for result in "$CHANGES" "$RUST" "$CLIPPY" "$SMOKE" "$TOOLING" "$WEB"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended as '$result'"; exit 1 ;;
            esac
          done
