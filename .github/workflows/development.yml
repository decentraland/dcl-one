name: Development environment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flake.*'
      - 'rendering/bevy-explorer/upstream.lock.json'
      - 'infra/dev/**'
      - 'infra/gateway/**'
      - 'tooling/dev*'
      - 'tooling/enet-provenance.py'
      - 'tooling/*.py'
      - 'tooling/tests/**'
      - 'services/catalyst/**'
      - 'library/**'
      - '.cargo/**'
      - 'apps/sites/**'
      - 'apps/ui3/**'
      - 'schemas/**'
      - 'Makefile'
      - '.github/workflows/development.yml'
      - '.github/workflows/bevy-explorer-benchmark.yml'
      - '!**/*.md'
      - '!docs/**'
      - '!services/catalyst/docs/**'
      - '!rendering/bevy-explorer/docs/**'
      - 'apps/sites/content/**'
      - 'services/catalyst/**/tests/fixtures/**'
      - 'library/**/tests/fixtures/**'
  # Every pull request, so "CI gate" always reports and can be a required check; the `changes` plan skips the
  # heavy jobs when nothing under push.paths changed (a skipped job counts as passing for a required check).
  pull_request:
permissions:
  contents: read
  actions: read
concurrency:
  group: development-${{ github.ref }}
  # Main runs finish: they are the macOS check for source that PRs test on Linux only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select the jobs and the Rust test platforms
        id: plan
        run: python3 tooling/dev-ci.py plan
  rust:
    name: Rust tests
    needs: changes
    # Runs whatever the plan's outcome unless it found nothing to test; without a plan (other events, a failed
    # plan job) it runs, and includes macOS.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((needs.changes.outputs.macos != 'false' || contains(github.event.pull_request.labels.*.name, 'ci:macos')) && '["ubuntu-26.04", "macos-26"]' || '["ubuntu-26.04"]') }}
    runs-on: ${{ contains(matrix.os, 'windows') && (vars.RUNNER_WINDOWS || matrix.os)
      || contains(matrix.os, 'macos') && (vars.RUNNER_MACOS || matrix.os)
      || endsWith(matrix.os, '-arm') && (vars.RUNNER_LINUX_ARM || matrix.os)
      || vars.RUNNER_LINUX || matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FOUNDATION_DEV_STARTUP_TIMEOUT: '120'
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux'
        run: |
          # The catalyst test build, the Nix store and the pnpm store outgrow the hosted runner's
          # free space (the end-to-end step died with "No space left on device"); its SDKs are unused.
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop .#ci --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Verify the exact public ENet source pin
        run: nix develop .#ci --command python3 tooling/enet-provenance.py
      - name: Put the Nix Rust toolchain on PATH for the cache action
        run: |
          toolchain=$(dirname "$(nix develop .#ci --command bash -c 'command -v cargo')")
          test -x "$toolchain/rustc"
          echo "$toolchain" >> "$GITHUB_PATH"
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # The key hashes every toolchain rustup lists, so the runner image's own would
          # miss the cache on each image update. An unusable home makes rustup fail, and
          # only the Nix rustc counts.
          RUSTUP_HOME: /dev/null
        with:
          # Dependencies only: before saving, the action removes the output of the crates
          # under services/catalyst (every test binary of theirs) and the extracted registry
          # sources, so the entry stays near one gigabyte instead of accumulating a full
          # artifact set per Cargo.lock change. The library members outside that directory
          # stay in the entry; their output is tens of megabytes.
          # flake.lock joins the key because the action cannot see the Nix-provided libraries.
          # First attempts only: a re-run of an older main run would save a superseded
          # entry as the newest one, and the sweep keeps the newest.
          workspaces: services/catalyst
          shared-key: dev-tests-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          cache-on-failure: true
      - name: Run backend tests with PostgreSQL and isolated NATS
        run: nix develop .#ci --command bash tooling/dev-test.sh rust
      - name: Preserve database logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-rust-logs-${{ runner.os }}-${{ runner.arch }}
          path: .cache/dev/*.log
          retention-days: 7
  smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos') && '["ubuntu-26.04"]' || '["ubuntu-26.04", "macos-26"]') }}
    runs-on: ${{ contains(matrix.os, 'windows') && (vars.RUNNER_WINDOWS || matrix.os)
      || contains(matrix.os, 'macos') && (vars.RUNNER_MACOS || matrix.os)
      || endsWith(matrix.os, '-arm') && (vars.RUNNER_LINUX_ARM || matrix.os)
      || vars.RUNNER_LINUX || matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FOUNDATION_DEV_STARTUP_TIMEOUT: '5400'
      FOUNDATION_PLAY_WAIT_SECONDS: '5400'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux'
        run: |
          # The catalyst test build, the Nix store and the pnpm store outgrow the hosted runner's
          # free space (the end-to-end step died with "No space left on device"); its SDKs are unused.
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-default-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-default-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Evaluate supported systems
        run: nix flake show --all-systems
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Identify Rust build inputs
        id: rust-inputs
        shell: bash
        run: |
          # Hash tracked inputs, not the commit: unrelated documentation edits
          # reuse a snapshot, while schema, protocol and vendored SDK edits do not.
          source=$(git ls-tree -r HEAD -- services/catalyst library schemas .cargo apps/dcl-scene-cli flake.nix Makefile tooling infra/dev .github/workflows/development.yml | git hash-object --stdin)
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: foundation-dev-v2-smoke-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}-${{ steps.rust-inputs.outputs.source }}
          restore-keys: |
            foundation-dev-v2-smoke-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}-
            foundation-dev-v2-smoke-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/*/pnpm-lock.yaml') }}
          restore-keys: |
            foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Check configuration and PostgreSQL lifecycle
        timeout-minutes: 10
        run: nix develop --command python3 -m unittest discover -s tooling/tests -v
      - name: Start the API and web app without upstream data
        run: nix develop --command bash tooling/dev-smoke.sh
      - name: Run Sites end-to-end tests against the development stack
        timeout-minutes: 75
        run: nix develop --command bash tooling/dev-test.sh e2e
      - name: Show the service logs
        if: failure()
        run: |
          for log in .cache/dev/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 150 "$log"
            echo "::endgroup::"
          done
      - name: Report Rust cache size
        if: always()
        run: |
          if [ -d services/catalyst/target ]; then
            du -sh services/catalyst/target
          fi
      - name: Preserve startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-logs-${{ runner.os }}-${{ runner.arch }}
          path: .cache/dev/*.log
          retention-days: 7
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Save successful smoke build snapshot
        # PR smoke jobs restore main's snapshots without creating multi-GB copies.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  web:
    name: Web tests and contracts
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the pinned docs integration-test diagram
        run: git lfs pull --include='apps/sites/content/docs/creator/images/wearables-and-emotes/creating-wearables/19_skin_uv.webp' --exclude=''
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-default-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-default-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/*/pnpm-lock.yaml') }}
          restore-keys: |
            foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install web dependencies
        run: |
          nix develop --command pnpm --dir apps/ui3 install --frozen-lockfile
          nix develop --command pnpm --dir apps/sites install --frozen-lockfile
      - name: Select web unit coverage
        id: web-coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tooling/dev-ci.py
      - name: Run UI3 unit tests
        if: steps.web-coverage.outputs.run-web-unit-tests != 'false'
        timeout-minutes: 20
        run: nix develop --command pnpm --dir apps/ui3 test
      - name: Run Sites unit tests
        if: steps.web-coverage.outputs.run-web-unit-tests != 'false'
        timeout-minutes: 20
        run: nix develop --command pnpm --dir apps/sites test
      - name: Run editor scene unit tests
        if: steps.web-coverage.outputs.run-web-unit-tests != 'false'
        timeout-minutes: 20
        run: |
          nix develop --command pnpm --dir apps/ui3/editor-scene install --frozen-lockfile
          nix develop --command pnpm --dir apps/ui3/editor-scene test
      - name: Check web types and generated artifacts
        timeout-minutes: 15
        run: |
          nix develop --command pnpm --dir apps/ui3 typecheck
          nix develop --command pnpm --dir apps/sites typecheck
          nix develop --command pnpm --dir apps/sites typecheck:scripts
          for check in gen:schemas:check schemas:honesty:check schemas:dupes:check telemetry:check check:flowmap gen:seed-catalog:check; do
            nix develop --command pnpm --dir apps/sites "$check"
          done
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  # The one check to mark required on main. It always reports: green when the Rust and web jobs passed or were
  # skipped because nothing they test changed, red when either failed, was cancelled or is missing. Smoke is left
  # out: it also fails on hosted-runner limits that are not the change's.
  gate:
    name: CI gate
    needs: [changes, rust, web]
    if: ${{ always() }}
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - name: Require the Rust and web jobs to pass or be skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "changes=$CHANGES rust=$RUST web=$WEB"
          for result in "$CHANGES" "$RUST" "$WEB"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended as '$result'"; exit 1 ;;
            esac
          done
