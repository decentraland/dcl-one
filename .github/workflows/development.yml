name: Development environment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flake.*'
      - 'rendering/bevy-explorer/upstream.lock.json'
      - 'infra/dev/**'
      - 'tooling/dev*'
      - 'tooling/enet-provenance.py'
      - 'tooling/*.py'
      - 'tooling/tests/**'
      - 'services/catalyst/**'
      - 'library/**'
      - '.cargo/**'
      - 'apps/sites/**'
      - 'apps/ui3/**'
      - 'schemas/**'
      - 'Makefile'
      - '.github/workflows/development.yml'
  pull_request:
    paths:
      - 'flake.*'
      - 'rendering/bevy-explorer/upstream.lock.json'
      - 'infra/dev/**'
      - 'tooling/dev*'
      - 'tooling/enet-provenance.py'
      - 'tooling/*.py'
      - 'tooling/tests/**'
      - 'services/catalyst/**'
      - 'library/**'
      - '.cargo/**'
      - 'apps/sites/**'
      - 'apps/ui3/**'
      - 'schemas/**'
      - 'Makefile'
      - '.github/workflows/development.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FOUNDATION_DEV_STARTUP_TIMEOUT: '120'
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux'
        run: |
          # The catalyst test build, the Nix store and the pnpm store outgrow the hosted runner's
          # free space (the end-to-end step died with "No space left on device"); its SDKs are unused.
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Verify the exact public ENet source pin
        run: nix develop --command python3 tooling/enet-provenance.py
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: foundation-dev-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}
          restore-keys: |
            foundation-dev-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-
      - name: Run backend tests with PostgreSQL and isolated NATS
        run: nix develop --command bash tooling/dev-test.sh rust
      - name: Preserve database logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-rust-logs-${{ runner.os }}-${{ runner.arch }}
          path: .cache/dev/*.log
          retention-days: 7
      - name: Save Rust build cache from main
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos') && '["ubuntu-26.04"]' || '["ubuntu-26.04", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      FOUNDATION_DEV_STARTUP_TIMEOUT: '5400'
      FOUNDATION_PLAY_WAIT_SECONDS: '5400'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux'
        run: |
          # The catalyst test build, the Nix store and the pnpm store outgrow the hosted runner's
          # free space (the end-to-end step died with "No space left on device"); its SDKs are unused.
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Evaluate supported systems
        run: nix flake show --all-systems
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/catalyst/target
            ~/.cargo/registry
            ~/.cargo/git
          key: foundation-dev-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}
          restore-keys: |
            foundation-dev-nodebug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/*/pnpm-lock.yaml') }}
          restore-keys: |
            foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Check configuration and PostgreSQL lifecycle
        timeout-minutes: 10
        run: nix develop --command python3 -m unittest discover -s tooling/tests -v
      - name: Start the API and web app without upstream data
        run: nix develop --command bash tooling/dev-smoke.sh
      - name: Run Sites end-to-end tests against the development stack
        timeout-minutes: 75
        run: nix develop --command bash tooling/dev-test.sh e2e
      - name: Show the service logs
        if: failure()
        run: |
          for log in .cache/dev/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 150 "$log"
            echo "::endgroup::"
          done
      - name: Report Rust cache size
        if: always()
        run: |
          if [ -d services/catalyst/target ]; then
            du -sh services/catalyst/target
          fi
      - name: Preserve startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-logs-${{ runner.os }}-${{ runner.arch }}
          path: .cache/dev/*.log
          retention-days: 7
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  web:
    name: Web tests and contracts
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/*/pnpm-lock.yaml') }}
          restore-keys: |
            foundation-dev-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install web dependencies
        run: |
          nix develop --command pnpm --dir apps/ui3 install --frozen-lockfile
          nix develop --command pnpm --dir apps/sites install --frozen-lockfile
      - name: Run the web unit tests
        timeout-minutes: 20
        run: |
          nix develop --command pnpm --dir apps/ui3 test
          nix develop --command pnpm --dir apps/sites test
          nix develop --command pnpm --dir apps/ui3/editor-scene install --frozen-lockfile
          nix develop --command pnpm --dir apps/ui3/editor-scene test
      - name: Check web types and generated artifacts
        timeout-minutes: 15
        run: |
          nix develop --command pnpm --dir apps/ui3 typecheck
          nix develop --command pnpm --dir apps/sites typecheck
          nix develop --command pnpm --dir apps/sites typecheck:scripts
          for check in gen:schemas:check schemas:honesty:check schemas:dupes:check telemetry:check check:flowmap gen:seed-catalog:check; do
            nix develop --command pnpm --dir apps/sites "$check"
          done
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
