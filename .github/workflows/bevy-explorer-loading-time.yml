# Loading time of the live web client, three times a day: `pnpm run loading-time`
# (apps/bevy-explorer/e2e, "Loading-time check") opens the client at the fixed locations of
# `loading-time.json`, records the time to world and the teleport time between them, and keeps
# each run's readings as an artifact. A run over a threshold opens one issue or comments on the
# open one; a run that could not take a reading does the same on an issue of its own, so trouble
# with the runner never reads as a slower client.
#
# It runs on the Windows GPU runner the end-to-end suite uses (BEVY_E2E_WINDOWS_RUNNER); until that
# variable is set the measuring job is skipped. Each client signs in as a guest, so the measuring
# job holds no secret and no write permission; the issue is written by a hosted job that reads the
# uploaded readings as data.
name: Bevy Explorer / Loading time
'on':
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: bevy-explorer-loading-time
  cancel-in-progress: false
jobs:
  measure:
    name: Measure (Windows GPU)
    if: vars.BEVY_E2E_WINDOWS_RUNNER != ''
    runs-on: ${{ vars.BEVY_E2E_WINDOWS_RUNNER }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
        working-directory: apps/bevy-explorer/e2e
    env:
      WEBGPU_FLAGS: --enable-unsafe-webgpu --ignore-gpu-blocklist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/bevy-explorer/e2e
            rendering/bevy-explorer/source/local-harness/web-driver
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the suite
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # As in Bevy Explorer / E2E: the image's Chrome, else the pinned Chrome for Testing build.
      - name: Find a browser
        working-directory: ${{ runner.temp }}
        env:
          CHROME_VERSION: '157.0.8103.38'
          CHROME_SHA256: ae0deef27d449e1d7529df7705d609bab102de48464da13567ed3dd2ee1a0586
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installed = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LocalAppData\Google\Chrome\Application\chrome.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($installed) { Write-Output "Chrome: $installed"; exit 0 }
          $zip = 'chrome-win64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri "https://storage.googleapis.com/chrome-for-testing-public/$env:CHROME_VERSION/win64/$zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CHROME_SHA256) { throw "$zip has sha256 $hash, not $env:CHROME_SHA256" }
          Expand-Archive -Path $zip -DestinationPath chrome -Force
          $exe = Join-Path (Get-Location) 'chrome\chrome-win64\chrome.exe'
          if (-not (Test-Path $exe)) { throw "$zip holds no chrome-win64\chrome.exe" }
          Write-Output "Chrome for Testing $env:CHROME_VERSION at $exe"
          Add-Content -Path $env:GITHUB_ENV -Value "CHROME_PATH=$exe"
      # As in Bevy Explorer / E2E: start the browser on the NVIDIA adapter, not the VM's
      # paravirtual one, where WebGPU finds no hardware. The probe runs under node itself, since
      # Windows PowerShell turns pnpm's stderr line into an error that ends the step.
      - name: GPU probe
        continue-on-error: true
        timeout-minutes: 5
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CHROME_EXTRA_ARGS=$env:WEBGPU_FLAGS"
          $ErrorActionPreference = 'Continue'
          $env:CHROME_EXTRA_ARGS = $env:WEBGPU_FLAGS
          $lines = node scripts/gpu-probe.ts --adapter nvidia 2>&1 | ForEach-Object { "$_" }
          $lines
          $luid = ($lines | Select-String -Pattern '^adapter-luid: (\S+)' | Select-Object -First 1)
          if ($luid) {
            $value = $luid.Matches[0].Groups[1].Value
            Add-Content -Path $env:GITHUB_ENV -Value "CHROME_EXTRA_ARGS=$env:WEBGPU_FLAGS --use-adapter-luid=$value"
          } else {
            Write-Output "::warning title=GPU probe::no NVIDIA adapter LUID; the browser starts on its default adapter"
          }
      - name: Measure the live web client
        timeout-minutes: 45
        run: |
          node scripts/loading-time.ts
          Get-Content report/loading-time/summary.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      # Kept per run: a week of runs is the comparison the thresholds are set from.
      - name: Upload the readings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bevy-explorer-loading-time-${{ github.run_id }}
          path: apps/bevy-explorer/e2e/report/
          if-no-files-found: warn
          retention-days: 90
  issue:
    name: File the issue
    needs: measure
    # a scheduled run past the job's timeout ends `cancelled` too; a cancel by hand files nothing
    if: always() && needs.measure.result != 'skipped' && (needs.measure.result != 'cancelled' || github.event_name == 'schedule')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MEASURE_RESULT: ${{ needs.measure.result }}
    steps:
      - name: Download the readings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bevy-explorer-loading-time-${{ github.run_id }}
          path: report
      # A reading over its threshold files the slow-client issue. Otherwise a reading not taken,
      # no readable readings, or a measuring job that did not succeed (a run cut short leaves only
      # the readings it finished) files the could-not-measure one.
      - name: Open or update the issue
        run: |
          results=report/loading-time/results.json
          readable=false
          if [ -f "$results" ] && jq -e '(.slow | type == "array") and (.unmeasured | type == "array")' "$results" >/dev/null; then
            readable=true
          fi
          if [ "$readable" = true ] && [ "$(jq '.slow | length' "$results")" != 0 ]; then
            export TITLE='Loading-time check: the live web client is over its threshold'
          elif [ "$readable" = false ] || [ "$MEASURE_RESULT" != success ] || [ "$(jq '.unmeasured | length' "$results")" != 0 ]; then
            export TITLE='Loading-time check: the measurement could not run'
          else
            echo 'Every reading is within its threshold.'
            exit 0
          fi
          if [ -f report/loading-time/summary.md ]; then
            cp report/loading-time/summary.md body.md
          else
            printf 'The loading-time check wrote no readings: [run](%s).\n' "$RUN_URL" > body.md
          fi
          if [ "$MEASURE_RESULT" != success ]; then
            printf '\nThe measuring job ended with `%s`: readings after the last one above were not taken.\n' "$MEASURE_RESULT" >> body.md
          fi
          # only this workflow's own issue: one anybody else titles the same is not commented on
          number=$(gh issue list --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
