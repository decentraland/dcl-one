name: Bevy Explorer / Dependency drift
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: bevy-explorer-dependency-drift
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refresh the fork inventory and the patch config
        run: python3 tooling/upstream-forks.py --check-upstream
      - name: Build the dependency drift site
        run: |
          python3 tooling/upstream-drift.py collect
          python3 tooling/upstream-drift-site.py
      - name: Upload the drift site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bevy-explorer-dependency-drift-site
          path: rendering/bevy-explorer/drift/
          retention-days: 30
      - name: Open or update the fork inventory pull request
        run: |
          git add rendering/bevy-explorer/forks.toml rendering/bevy-explorer/cargo-patches.toml
          if git diff --cached --quiet; then
            echo 'No fork branch moved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch=upstream/forks
          title='Fork inventory: branches that moved since the Cargo lock'
          git checkout -B "$branch"
          git commit -m "$title" -m 'Generated by tooling/upstream-forks.py --check-upstream.'
          git push --force origin "$branch"
          if gh pr view "$branch" --json number --jq .number > /dev/null 2>&1; then
            gh pr edit "$branch" --title "$title"
          else
            gh pr create --head "$branch" --title "$title" --body 'Review rendering/bevy-explorer/forks.toml; the dependency drift site is attached to the workflow run.'
          fi
      # Last, so a failure here (v8-report fails when neither V8 could be collected) skips nothing.
      - name: Open, update or close the V8 freshness issue
        env:
          TITLE: 'The Explorer or catalyst scene runtime V8 is behind'
        run: |
          body=.cache/upstream-drift/v8-issue.md
          python3 tooling/upstream-drift.py v8-report --body "$body"
          # Exact title over this workflow's own open issues, oldest first: the search index can lag, and
          # anyone can open an issue with the same title.
          numbers=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and .author.login == "app/github-actions") | .number] | sort | map(tostring) | join(" ")')
          set -- $numbers
          if [ -f "$body" ]; then
            if [ $# -gt 0 ]; then
              keep=$1
              shift
              gh issue edit "$keep" --body-file "$body"
              for extra in "$@"; do
                gh issue close "$extra" --comment "Duplicate of #$keep."
              done
            else
              gh issue create --title "$TITLE" --body-file "$body"
            fi
          else
            for open in "$@"; do
              gh issue close "$open" --comment 'Neither the Explorer nor the catalyst V8 is behind rusty_v8, deno_core or Chrome any more.'
            done
          fi
