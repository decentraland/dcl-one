name: Bevy Explorer / Dependency drift
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: bevy-explorer-dependency-drift
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      v8: ${{ steps.v8.outputs.state }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Where the patch tool keeps the upstream commits. The directory is in the workspace: the cache
      # action stores paths relative to the workspace, so a job on another system restores the archive
      # to the same place.
      DCL_PATCHED_SOURCES_CACHE: ${{ github.workspace }}/.cache/patched-sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails when a pinned commit is not on the ref its source names, or a source cannot be checked.
      - name: Check each pinned source against its upstream
        shell: bash
        run: python3 tooling/upstream-drift.py check | tee -a "$GITHUB_STEP_SUMMARY"
      # This run rebuilds every source from its upstream commit and patch series and proves the tree
      # and the `rev`. The upstream commits come from the Actions cache.
      - name: Identify the upstream commits
        id: bases
        if: ${{ !cancelled() }}
        run: echo "key=$(grep -hE '^[[:space:]]*(upstream|commit|url)[[:space:]]*=' rendering/bevy-explorer/patches/*/source.toml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # A changed pin has no exact match: the newest cache of the other upstream commits is restored
      # and only the new commit is fetched.
      - name: Restore the upstream commits
        id: restore
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/patched-sources
          key: bevy-explorer-patch-bases-${{ steps.bases.outputs.key }}
          restore-keys: |
            bevy-explorer-patch-bases-
      - name: Prove each patch series against its upstream commit, tree and revision
        id: verify
        if: ${{ !cancelled() }}
        run: python3 tooling/patched-sources.py verify
      - name: Save the upstream commits
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/patched-sources
          key: ${{ steps.restore.outputs.cache-primary-key }}
      # Read-only: fails when this repository has no ref for a pinned `rev`. The publish-sources workflow
      # pushes them on each push to main; a failure here means it failed or did not run.
      - name: Check that this repository has a ref for each pinned revision
        if: ${{ !cancelled() }}
        run: python3 tooling/patched-sources.py publish --check
      - name: Prove the in-tree crates against their public repositories
        if: ${{ !cancelled() }}
        run: python3 tooling/vendor-provenance.py
      - name: Build the dependency drift site
        if: ${{ !cancelled() }}
        run: |
          python3 tooling/upstream-drift.py collect
          python3 tooling/upstream-drift-site.py
      - name: Upload the drift site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bevy-explorer-dependency-drift-site
          path: rendering/bevy-explorer/drift/
          retention-days: 30
      # `stale` writes the issue body; `current` writes none. Unset when neither V8 could be collected.
      - name: Check the scene runtime V8 against deno_core, rusty_v8 and Chrome
        id: v8
        if: ${{ !cancelled() }}
        run: |
          body=.cache/upstream-drift/v8-issue.md
          python3 tooling/upstream-drift.py v8-report --body "$body"
          if [ -f "$body" ]; then echo state=stale; else echo state=current; fi >> "$GITHUB_OUTPUT"
      - name: Upload the V8 issue body
        if: ${{ !cancelled() && steps.v8.outputs.state == 'stale' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bevy-explorer-v8-issue
          path: .cache/upstream-drift/v8-issue.md
          retention-days: 7
  # Opens, updates or closes the V8 freshness issue from the drift job's verdict. Like `report` below,
  # it writes issues and runs no code of the repository.
  v8-issue:
    name: Report the scene runtime V8 age
    needs: drift
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.drift.outputs.v8 != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download the V8 issue body
        if: ${{ needs.drift.outputs.v8 == 'stale' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bevy-explorer-v8-issue
          path: v8-issue
      - name: Open, update or close the V8 freshness issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATE: ${{ needs.drift.outputs.v8 }}
          TITLE: 'The Explorer or catalyst scene runtime V8 is behind'
        run: |
          body=v8-issue/v8-issue.md
          # Exact title over this workflow's own open issues, oldest first: the search index can lag, and
          # anyone can open an issue with the same title.
          numbers=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and .author.login == "app/github-actions") | .number] | sort | map(tostring) | join(" ")')
          set -- $numbers
          if [ "$STATE" = stale ]; then
            if [ $# -gt 0 ]; then
              keep=$1
              shift
              gh issue edit "$keep" --body-file "$body"
              for extra in "$@"; do
                gh issue close "$extra" --comment "Duplicate of #$keep."
              done
            else
              gh issue create --title "$TITLE" --body-file "$body"
            fi
          else
            for open in "$@"; do
              gh issue close "$open" --comment 'Neither the Explorer nor the catalyst V8 is behind rusty_v8, deno_core or Chrome any more.'
            done
          fi
  # A failed run on main is reported in one issue: a comment on the open issue with this title, or a
  # new issue. Only this job has a permission to write, and it runs no code of the repository.
  report:
    name: Report a failed run
    needs: drift
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue or add a comment to it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Bevy Explorer: the daily dependency drift run fails'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The daily run of the dependency drift workflow failed: $RUN_URL"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
