# Rebuilds the UUAV native helper and its FFmpeg from the pinned inputs on all
# three targets and proves the build reproducible. Nothing is committed: the
# relock is a human step (library/uuav/README.md, "Relocking"). Expensive
# (FFmpeg from source on macOS and Linux), so it runs only on demand or on a
# PR carrying the `ci:uuav-native` label whose diff touches the paths below.
name: UUAV native build
'on':
  workflow_dispatch:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened]
    paths:
      - library/uuav/**
      - tooling/uuav/**
      - tooling/native-lock/**
      - .gitattributes
      - .cargo/**
      - .github/workflows/uuav-native.yml
permissions:
  contents: read
concurrency:
  group: >-
    ${{ (github.event.label.name == 'ci:uuav-native'
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled'))
      && format('uuav-native-{0}', github.event.pull_request.number || github.ref)
      || format('uuav-native-skip-{0}', github.run_id) }}
  cancel-in-progress: true
env:
  DIST_LFS_GLOB: 'library/uuav/dist/**'
  LOCK: tooling/uuav/uuav-binaries.lock.json
  UUAV: library/uuav
jobs:
  gate:
    name: Should this run
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:uuav-native')
      || (github.event.action != 'labeled' && github.event.action != 'unlabeled'
          && contains(github.event.pull_request.labels.*.name, 'ci:uuav-native'))
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    steps:
      - run: 'true'

  macos:
    name: Build macos-universal
    needs: gate
    runs-on: ${{ vars.RUNNER_MACOS || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - run: git lfs pull --include "$DIST_LFS_GLOB"

      - name: Read pins from the lock
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          target = json.load(open(os.environ["LOCK"]))["targets"]["macos-universal"]
          print(f"ffmpeg_tag={target['ffmpeg']['tag']}")
          print(f"ffmpeg_commit={target['ffmpeg']['commit']}")
          print(f"mbedtls_tag={target['ffmpeg']['mbedtls']['tag']}")
          print(f"mbedtls_commit={target['ffmpeg']['mbedtls']['commit']}")
          print(f"builder={target['ffmpeg']['builder']}")
          PY

      # pkg-config: FFmpeg's configure only finds libxml2 (DASH demuxer) and
      # mbedtls through pkg-config, against the .pc files build-ffmpeg-macos.sh
      # synthesizes from the SDK and installs from the mbedTLS build
      - name: Install nasm, pkg-config and cmake
        run: brew install nasm pkg-config cmake

      # In library/uuav, always: rustup reads its rust-toolchain.toml there,
      # and nowhere else in this checkout. At the repo root every rustc/cargo/
      # rustup command would address the runner image's default toolchain
      # instead of the pinned one the build compiles with, so the slices would
      # be added to the wrong toolchain and the recorded identities would name
      # a compiler that produced none of the bytes - the identities Gate B
      # then pins reproduction against.
      - name: Install both Rust slices
        working-directory: library/uuav
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          sysroot="$(rustc --print sysroot)"
          for slice in aarch64-apple-darwin x86_64-apple-darwin; do
            if [ ! -d "$sysroot/lib/rustlib/$slice/lib" ]; then
              echo "::error::the pinned rustc ($(rustc --version), sysroot $sysroot) has no $slice std; the universal build cannot work"
              exit 1
            fi
          done

      # rustc and cargo are asked from library/uuav for the reason above; the
      # file itself is written at the repo root, where Gate B and the upload
      # expect it.
      - name: Record the toolchain actually used
        run: |
          set -uo pipefail
          {
            echo "rustc: $(cd "$UUAV" && rustc --version)"
            echo "cargo: $(cd "$UUAV" && cargo --version)"
            echo "clang: $(clang --version | head -1)"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ' | sed 's/ *$//')"
            echo "sdk: macosx$(xcrun --sdk macosx --show-sdk-version) ($(xcrun --sdk macosx --show-sdk-build-version))"
            echo "ld: $(ld -v 2>&1 | head -1 || true)"
          } | tee toolchain-macos.txt

      - name: Build FFmpeg from the pinned source
        working-directory: library/uuav
        run: |
          set -euo pipefail
          bash "scripts/$(basename "${{ steps.pins.outputs.builder }}")"
          actual=$(git -C .ffmpeg-src rev-parse HEAD)
          expected="${{ steps.pins.outputs.ffmpeg_commit }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::FFmpeg tag ${{ steps.pins.outputs.ffmpeg_tag }} resolved to $actual but the lock pins $expected"
            exit 1
          fi
          echo "FFmpeg source commit $actual matches the lock."
          actual=$(git -C .mbedtls-src rev-parse HEAD)
          expected="${{ steps.pins.outputs.mbedtls_commit }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::mbedTLS tag ${{ steps.pins.outputs.mbedtls_tag }} resolved to $actual but the lock pins $expected"
            exit 1
          fi
          echo "mbedTLS source commit $actual matches the lock."

      # the FFmpeg headers exist only here, so this is where the two
      # FFmpeg-linking crates get their lint and test pass
      - name: Lint and test the whole workspace
        working-directory: library/uuav
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          DYLD_LIBRARY_PATH="$PWD/.third_party/ffmpeg/lib" cargo test --workspace

      - name: Gate A - the same runner must build the same bytes twice
        run: bash tooling/uuav/repro-gate.sh macos-universal

      - name: Gate B - reproduce the committed binaries, toolchain permitting
        run: python3 tooling/native-lock/reproduces-lock.py --lock "$LOCK" macos-universal --toolchain toolchain-macos.txt

      - name: Compare the fresh build against the lock
        run: python3 tooling/native-lock/verify-binaries.py --lock "$LOCK" --report macos-universal

      # always(): a round that fails a gate is exactly the round whose fresh
      # hashes and recorded toolchain someone needs to read.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: uuav-macos-universal
          path: |
            library/uuav/dist/macos-universal/*
            toolchain-macos.txt
            uuav-macos-universal.sha256
            uuav-macos-universal.gate-b.txt
          if-no-files-found: error

  windows:
    name: Build windows-x86_64
    needs: gate
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - run: git lfs pull --include "$DIST_LFS_GLOB"

      - name: Read pins from the lock
        id: pins
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          # Windows Python writes CRLF in text mode; the \r would survive into
          # every output value and break bash string comparisons downstream.
          sys.stdout.reconfigure(newline="\n")
          target = json.load(open(os.environ["LOCK"]))["targets"]["windows-x86_64"]
          print(f"rust_target={target['rust']['target']}")
          print(f"provenance={target['ffmpeg']['provenance']}")
          print(f"release_tag={target['ffmpeg'].get('release_tag', '-')}")
          print(f"asset={target['ffmpeg'].get('asset', '-')}")
          PY

      - name: Fetch the pinned FFmpeg release asset
        run: |
          set -euo pipefail
          provenance="${{ steps.pins.outputs.provenance }}"
          if [ "$provenance" != "third-party-release-asset" ]; then
            echo "::error::the lock records windows-x86_64 FFmpeg as '$provenance', not a downloadable release asset; this job only knows how to fetch one. See library/uuav/README.md."
            exit 1
          fi
          bash tooling/uuav/fetch-ffmpeg-windows.sh

      # the GNU toolchain the helper links with (.cargo/config.toml names the
      # linker by its mingw name and resolves it from PATH)
      - name: Install the mingw toolchain the build links with
        shell: cmd
        run: C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-gcc
      - run: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Install the Rust target
        working-directory: library/uuav
        run: |
          set -euo pipefail
          rustup target add "${{ steps.pins.outputs.rust_target }}"
          if [ "${{ steps.pins.outputs.rust_target }}" != "x86_64-pc-windows-gnu" ]; then
            echo "::error::the lock pins rust target '${{ steps.pins.outputs.rust_target }}' but build.sh builds x86_64-pc-windows-gnu"
            exit 1
          fi

      - name: Record the toolchain actually used
        run: |
          set -uo pipefail
          {
            echo "rustc: $(cd "$UUAV" && rustc --version)"
            echo "cargo: $(cd "$UUAV" && cargo --version)"
            echo "gcc: $(x86_64-w64-mingw32-gcc --version | head -1)"
          } | tee toolchain-windows.txt

      - name: Lint and test the whole workspace
        working-directory: library/uuav
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
          PATH="$PWD/.third_party/ffmpeg/bin:$PATH" cargo test --workspace --target x86_64-pc-windows-gnu

      - name: Gate A - the same runner must build the same bytes twice
        run: bash tooling/uuav/repro-gate.sh windows-x86_64

      - name: Gate B - reproduce the committed binaries, toolchain permitting
        run: python tooling/native-lock/reproduces-lock.py --lock "$LOCK" windows-x86_64 --toolchain toolchain-windows.txt

      - name: Compare the fresh build against the lock
        run: python tooling/native-lock/verify-binaries.py --lock "$LOCK" --report windows-x86_64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: uuav-windows-x86_64
          path: |
            library/uuav/dist/windows-x86_64/*
            toolchain-windows.txt
            uuav-windows-x86_64.sha256
            uuav-windows-x86_64.gate-b.txt
          if-no-files-found: error

  linux:
    name: Build linux-x86_64
    needs: gate
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - run: git lfs pull --include "$DIST_LFS_GLOB"

      - name: Read pins from the lock
        id: pins
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          target = json.load(open(os.environ["LOCK"]))["targets"]["linux-x86_64"]
          print(f"ffmpeg_tag={target['ffmpeg']['tag']}")
          print(f"ffmpeg_commit={target['ffmpeg']['commit']}")
          print(f"mbedtls_tag={target['ffmpeg']['mbedtls']['tag']}")
          print(f"mbedtls_commit={target['ffmpeg']['mbedtls']['commit']}")
          print(f"libva_tag={target['ffmpeg']['libva']['tag']}")
          print(f"libva_commit={target['ffmpeg']['libva']['commit']}")
          print(f"builder={target['ffmpeg']['builder']}")
          PY

      # nasm assembles FFmpeg's SIMD kernels; cmake builds mbedTLS; meson and
      # ninja build libva; libxml2 (DASH demuxer), libdrm (libva's DRM
      # backend) and zlib are the base-system libraries the shipped set links;
      # patchelf stamps the $ORIGIN RUNPATH; libclang serves bindgen
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config cmake meson ninja-build \
            libxml2-dev libdrm-dev zlib1g-dev patchelf libclang-dev

      - name: Install the Rust target
        working-directory: library/uuav
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Record the toolchain actually used
        run: |
          set -uo pipefail
          {
            echo "rustc: $(cd "$UUAV" && rustc --version)"
            echo "cargo: $(cd "$UUAV" && cargo --version)"
            echo "gcc: $(gcc --version | head -1)"
            echo "binutils: $(ld --version | head -1)"
            echo "glibc: $(ldd --version | head -1)"
          } | tee toolchain-linux.txt

      - name: Build FFmpeg, mbedTLS and libva from the pinned sources
        working-directory: library/uuav
        run: |
          set -euo pipefail
          bash "scripts/$(basename "${{ steps.pins.outputs.builder }}")"
          for pair in ".ffmpeg-src:${{ steps.pins.outputs.ffmpeg_commit }}:FFmpeg ${{ steps.pins.outputs.ffmpeg_tag }}" \
                      ".mbedtls-src:${{ steps.pins.outputs.mbedtls_commit }}:mbedTLS ${{ steps.pins.outputs.mbedtls_tag }}" \
                      ".libva-src:${{ steps.pins.outputs.libva_commit }}:libva ${{ steps.pins.outputs.libva_tag }}"; do
            dir="${pair%%:*}"; rest="${pair#*:}"; expected="${rest%%:*}"; name="${rest#*:}"
            actual=$(git -C "$dir" rev-parse HEAD)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name resolved to $actual but the lock pins $expected"
              exit 1
            fi
            echo "$name source commit $actual matches the lock."
          done

      - name: Lint and test the whole workspace
        working-directory: library/uuav
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          LD_LIBRARY_PATH="$PWD/.third_party/ffmpeg/lib" cargo test --workspace

      - name: Gate A - the same runner must build the same bytes twice
        run: bash tooling/uuav/repro-gate.sh linux-x86_64

      - name: Gate B - reproduce the committed binaries, toolchain permitting
        run: python3 tooling/native-lock/reproduces-lock.py --lock "$LOCK" linux-x86_64 --toolchain toolchain-linux.txt

      - name: Compare the fresh build against the lock
        run: python3 tooling/native-lock/verify-binaries.py --lock "$LOCK" --report linux-x86_64

      # the headless end-to-end check: the fresh helper, staged next to the
      # smoke example, takes an HTTPS clip to PLAYING in software (hosted
      # runners decode nothing in hardware) and survives being killed
      - name: Smoke the fresh build (software decode)
        working-directory: library/uuav
        env:
          UUAV_FORCE_SW_DECODE: '1'
        run: |
          set -euo pipefail
          cargo build -p uuav-client --example smoke
          python3 ../../tooling/uuav/stage-dist.py linux-x86_64 .target/debug/examples
          timeout 300 .target/debug/examples/smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: uuav-linux-x86_64
          path: |
            library/uuav/dist/linux-x86_64/*
            toolchain-linux.txt
            uuav-linux-x86_64.sha256
            uuav-linux-x86_64.gate-b.txt
          if-no-files-found: error

  publish:
    name: Publish manifest
    needs: [macos, windows, linux]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
      - name: Assemble the release manifest
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p manifest
          cp "$LOCK" manifest/uuav-binaries.lock.json
          cat built/*/*.sha256 > manifest/SHA256SUMS
          cat built/*/toolchain-*.txt > manifest/TOOLCHAINS.txt
          {
            echo "### UUAV native build"
            echo
            echo "| target | Gate B |"
            echo "|---|---|"
            for f in built/*/*.gate-b.txt; do
              target=$(basename "$f" .gate-b.txt); target=${target#uuav-}
              echo "| $target | $(cat "$f") |"
            done
            echo
            echo '```'
            cat manifest/SHA256SUMS
            echo '```'
            echo
            echo '```'
            cat manifest/TOOLCHAINS.txt
            echo '```'
            echo
            echo '> [!WARNING]'
            echo "> **Nothing was committed** - this workflow has \`contents: read\` and only verifies. If this build is meant to ship, follow the relock steps in \`library/uuav/README.md\`: commit the binaries from this run's artifacts into \`library/uuav/dist/<target>/\`, then run \`tooling/native-lock/verify-binaries.py --lock $LOCK --update --only <target> --toolchain toolchain-<os>.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uuav-manifest
          path: manifest
          if-no-files-found: error
