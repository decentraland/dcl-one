name: Creator Hub / CI
# The entry point for the Creator Hub workspace (apps/creator-hub): it calls every other
# creator-hub-*.yml workflow. Reusable workflows can't widen the token, so this grants the
# most any of them needs and each job narrows it.
#
# Pull requests run it whatever they change, so its one required check, `Creator Hub CI`, always
# reports: `changes` skips every job when nothing Creator Hub changed, and a path filter would
# leave the check pending forever on the pull requests it filtered out.
#
# Pull requests build the desktop app for macOS, Windows and Linux only with the `ci:desktop`
# label, and for Linux alone with the `ci:linux` label: add the label, then push or reopen. Main
# builds all three; a manual run on another branch builds macOS and Windows.
#
# A run publishes the installers as a pre-release only on main, and only when it is asked to: a
# push whose pull request has the `release:creator-hub` label, or a manual run with `release` set.
# Every other run builds the unsigned test installers and publishes nothing, so it needs no signing
# secret. The npm packages do not use the label: they publish on every push to main.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the installers as a pre-release (main only)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/creator-hub/**'
      # The ui3 and shop files in the renderer bundle: the include list of
      # apps/creator-hub/packages/creator-hub/renderer/tsconfig.ui3.json. The bundlers also read
      # the ui3 package (sideEffects) and its compiler settings (jsx, paths).
      - 'apps/ui3/package.json'
      - 'apps/ui3/tsconfig.json'
      - 'apps/ui3/src/atoms/**'
      - 'apps/ui3/src/shop/land/**'
      - 'apps/ui3/src/shop/checkout/chain/**'
      - 'apps/ui3/src/shop/pageOverride.ts'
      - 'apps/ui3/src/explorer/components/MapSurface.tsx'
      - 'apps/ui3/src/explorer/components/mapsurface.css'
      - 'apps/ui3/src/data/**'
      - 'apps/ui3/src/generated/bridge/**'
      - 'library/shop/**'
      - 'library/web-core/shop-chain-env.ts'
      - 'library/web-core/site.ts'
      - '.github/workflows/creator-hub-*'
      - '.github/actions/creator-hub-*/**'
      - 'tooling/creator-hub-ci.py'
      - 'tooling/ci_paths.py'
      - 'tooling/tests/test_creator_hub_ci.py'
  pull_request:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write

concurrency:
  group: creator-hub-ci-${{ github.ref }}
  # A newer push cancels a branch's run, never main's: main's run may be mid-publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      creator-hub: ${{ steps.plan.outputs.creator-hub }}
      e2e: ${{ steps.plan.outputs.run }}
      e2e-inspector: ${{ steps.plan.outputs.inspector }}
      e2e-inspector-specs: ${{ steps.plan.outputs.inspector-specs }}
      e2e-creator-hub-offline: ${{ steps.plan.outputs.creator-hub-offline }}
      e2e-creator-hub-live: ${{ steps.plan.outputs.creator-hub-live }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .github
            tooling
            apps/creator-hub/packages/inspector/test/e2e
      - name: Test the e2e selection
        run: python3 -m unittest discover -s tooling/tests -p test_creator_hub_ci.py
      - name: Which e2e does this change require?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 tooling/creator-hub-ci.py plan
      - name: Take the e2e label off the pushed commit
        if: steps.plan.outputs.remove-label == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/ci%3Acreator-hub-e2e" --silent || true
      - name: Report what e2e this change requires
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          STATE: ${{ steps.plan.outputs.state }}
          DESCRIPTION: ${{ steps.plan.outputs.description }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" --silent \
            -f context='Creator Hub e2e' -f state="$STATE" -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATE" = pending ]; then echo "::notice::$DESCRIPTION"; fi
      - name: Point at the desktop build labels
        if: github.event_name == 'pull_request' && steps.plan.outputs.creator-hub == 'true'
        env:
          DESKTOP: ${{ contains(github.event.pull_request.labels.*.name, 'ci:desktop') }}
        run: |
          if [ "$DESKTOP" != true ]; then
            echo "::notice::The desktop builds run on main. Add the ci:desktop label to build the desktop app for macOS, Windows and Linux on this pull request, or ci:linux for Linux alone."
          fi
      # A push is one merged pull request, so its labels are read from the pushed commit. The
      # labels are read when the job runs: a run started again after the label is added releases.
      - name: Does this run release the installers?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ inputs.release }}
        run: |
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              release=$([ "$MANUAL" = true ] && echo true || echo false)
            elif [ "$GITHUB_EVENT_NAME" = push ]; then
              release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq 'any(.[]; .merged_at != null and any(.labels[]; .name == "release:creator-hub"))')
              if [ "$release" != true ]; then
                echo "::notice::This run does not publish the installers. To publish them, add the release:creator-hub label to a pull request before it merges, or start this workflow on main with release set."
              fi
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
  build:
    needs: [ changes ]
    if: needs.changes.outputs.creator-hub == 'true'
    uses: ./.github/workflows/creator-hub-build.yml
  lint:
    needs: [ changes ]
    if: needs.changes.outputs.creator-hub == 'true'
    uses: ./.github/workflows/creator-hub-lint.yml
  typechecking:
    needs: [ build ]
    uses: ./.github/workflows/creator-hub-typechecking.yml
  tests:
    needs: [ build ]
    uses: ./.github/workflows/creator-hub-tests.yml
  e2e:
    needs: [ changes, build ]
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/creator-hub-e2e.yml
    secrets:
      E2E_LAND: ${{ secrets.E2E_LAND }}
      E2E_NAME: ${{ secrets.E2E_NAME }}
      E2E_PRIVATE_KEY: ${{ secrets.E2E_PRIVATE_KEY }}
    with:
      inspector: ${{ needs.changes.outputs.e2e-inspector == 'true' }}
      inspector-specs: ${{ needs.changes.outputs.e2e-inspector-specs }}
      creator-hub-offline: ${{ needs.changes.outputs.e2e-creator-hub-offline == 'true' }}
      creator-hub-live: ${{ needs.changes.outputs.e2e-creator-hub-live == 'true' }}
  e2e-status:
    name: e2e status
    needs: [ changes, e2e ]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Report the e2e result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          case "$RESULT" in
            success) state=success description=Passed ;;
            cancelled) state=error description='Cancelled: run the workflow again' ;;
            *) state=failure description="Failed ($RESULT)" ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD" --silent \
            -f context='Creator Hub e2e' -f state="$state" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
  drop_pre_release:
    name: drop pre-release
    needs: [ changes, lint, typechecking, tests ]
    uses: ./.github/workflows/creator-hub-drop.yml
    secrets:
      CREATOR_HUB_RELEASES_APP_PRIVATE_KEY: ${{ secrets.CREATOR_HUB_RELEASES_APP_PRIVATE_KEY }}
    with:
      # dry-run == false only on a release run (`changes` decides)
      dry-run: ${{ needs.changes.outputs.release != 'true' }}
      # Before the build only unfinished pre-releases go (no `creator-hub@X.Y.Z` tag here), so this
      # run can rebuild that version. A finished one, possibly awaiting promote approval, stays.
      unfinished-only: true
  asset-packs:
    needs: [ drop_pre_release ]
    uses: ./.github/workflows/creator-hub-asset-packs.yml
    secrets:
      BUILDER_ITEMS_S3_BUCKET_PRD: ${{ secrets.BUILDER_ITEMS_S3_BUCKET_PRD }}
      SDK_TEAM_AWS_REGION: ${{ secrets.SDK_TEAM_AWS_REGION }}
      SDK_TEAM_S3_BASE_URL: ${{ secrets.SDK_TEAM_S3_BASE_URL }}
      SDK_TEAM_S3_BUCKET: ${{ secrets.SDK_TEAM_S3_BUCKET }}
  inspector:
    needs: [ asset-packs ]
    uses: ./.github/workflows/creator-hub-inspector.yml
    secrets:
      SDK_TEAM_AWS_REGION: ${{ secrets.SDK_TEAM_AWS_REGION }}
      SDK_TEAM_S3_BASE_URL: ${{ secrets.SDK_TEAM_S3_BASE_URL }}
      SDK_TEAM_S3_BUCKET: ${{ secrets.SDK_TEAM_S3_BUCKET }}
    with:
      asset_packs_s3_bucket_key: ${{ needs.asset-packs.outputs.s3_bucket_key }}
      asset_packs_version: ${{ needs.asset-packs.outputs.version }}
      asset_packs_changed: ${{ needs.asset-packs.outputs.changed == 'true' }}
  creator-hub:
    needs: [ changes, inspector ]
    # The macOS, Windows and Linux builds, and the test builds they attach to a pull request.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:desktop') || contains(github.event.pull_request.labels.*.name, 'ci:linux')
    uses: ./.github/workflows/creator-hub-desktop.yml
    secrets:
      CREATOR_HUB_RELEASES_APP_PRIVATE_KEY: ${{ secrets.CREATOR_HUB_RELEASES_APP_PRIVATE_KEY }}
      ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
      ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      SDK_TEAM_AWS_REGION: ${{ secrets.SDK_TEAM_AWS_REGION }}
      SDK_TEAM_S3_BASE_URL: ${{ secrets.SDK_TEAM_S3_BASE_URL }}
      SDK_TEAM_S3_BUCKET: ${{ secrets.SDK_TEAM_S3_BUCKET }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_ALLOWED_EXTERNAL_ORIGINS: ${{ secrets.VITE_ALLOWED_EXTERNAL_ORIGINS }}
      VITE_SEGMENT_CREATORS_HUB_API_KEY: ${{ secrets.VITE_SEGMENT_CREATORS_HUB_API_KEY }}
      VITE_SEGMENT_INSPECTOR_API_KEY: ${{ secrets.VITE_SEGMENT_INSPECTOR_API_KEY }}
      WINDOWS_CREDENTIAL_ID_SIGNER: ${{ secrets.WINDOWS_CREDENTIAL_ID_SIGNER }}
    with:
      # dry-run == false only on a release run (`changes` decides)
      dry-run: ${{ needs.changes.outputs.release != 'true' }}
      inspector_s3_bucket_key: ${{ needs.inspector.outputs.s3_bucket_key }}
      inspector_version: ${{ needs.inspector.outputs.version }}
      inspector_changed: ${{ needs.inspector.outputs.changed == 'true' }}
      macos-windows: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:desktop') }}
      linux: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'ci:desktop') || contains(github.event.pull_request.labels.*.name, 'ci:linux') }}
  # Older finished pre-releases go only once the new one is fully published, which is kept. A run
  # that fails part-way leaves the previous pre-release in place, still promotable.
  prune_pre_releases:
    name: prune pre-releases
    needs: [ changes, creator-hub ]
    uses: ./.github/workflows/creator-hub-drop.yml
    secrets:
      CREATOR_HUB_RELEASES_APP_PRIVATE_KEY: ${{ secrets.CREATOR_HUB_RELEASES_APP_PRIVATE_KEY }}
    with:
      dry-run: ${{ needs.changes.outputs.release != 'true' }}
      keep: ${{ needs.creator-hub.outputs.version }}
  result:
    name: Creator Hub CI
    if: always()
    needs: [ changes, build, lint, typechecking, tests, e2e, drop_pre_release, asset-packs, inspector, creator-hub, prune_pre_releases ]
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    permissions: {}
    steps:
      - name: Check every Creator Hub job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$RESULTS" | jq -e --arg event "$GITHUB_EVENT_NAME" \
            'if $event == "pull_request" then del(.e2e) else . end
             | to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null
