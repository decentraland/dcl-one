name: Bevy Explorer / Publish patched sources
# Keeps each pinned `rev` after the fork that served it before the merge is gone. The tool and the series are those
# of main: publish rebuilds each commit that this repository lacks from its upstream commit and series, fails when
# that is not the `rev`, and pushes it to refs/patched-sources/<name>/<rev>. It never deletes and never forces a ref,
# and pushes nothing when every ref is there.
#
# No concurrency group: a group keeps one pending run and cancels the others, and a cancelled run would leave the
# `rev` of its push without a ref. Overlapping runs are safe: a ref that another run already pushed is up to
# date, and of two runs that create it at once one fails, which a rerun repairs.
# A push publishes the pins of its last commit only; a squash merge pushes one commit.
on:
  push:
    branches:
      - main
    paths:
      - rendering/bevy-explorer/patches/**
  # Repairs a failed run: it publishes what main pins.
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish the patched sources
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DCL_PATCHED_SOURCES_CACHE: ${{ github.workspace }}/.cache/patched-sources
    steps:
      # The token reaches git through the environment of the publish step only, never the checkout's configuration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the upstream commits
        id: bases
        run: echo "key=$(grep -hE '^[[:space:]]*(upstream|commit|url)[[:space:]]*=' rendering/bevy-explorer/patches/*/source.toml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      - name: Restore the upstream commits
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/patched-sources
          key: bevy-explorer-patch-bases-${{ steps.bases.outputs.key }}
          restore-keys: |
            bevy-explorer-patch-bases-
      # The tool reads the caller's git configuration for a push; GIT_CONFIG_* hands it the token's header.
      - name: Push a ref for each pinned revision that this repository lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" python3 tooling/patched-sources.py publish
