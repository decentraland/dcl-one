# Adapted from the exact snapshot in rendering/bevy-explorer/source/.github/workflows/.
name: Bevy Explorer / CDN rollout
'on':
- deployment_status
jobs:
  set-rollout:
    if: github.event.deployment.payload.packageName == '@dcl-regenesislabs/bevy-explorer-web' && github.event.deployment.task == 'upload-to-cdn' && github.event.deployment_status.state == 'success'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        sparse-checkout: .github/actions/bevy-explorer-ci-status
        sparse-checkout-cone-mode: false
    # PR previews and publish-tag builds reach the CDN too; only the next release goes to /play.
    - name: Check the version is next
      id: next
      env:
        VERSION: ${{ github.event.deployment.payload.packageVersion }}
      run: |
        source "$GITHUB_WORKSPACE/.github/actions/bevy-explorer-ci-status/retry.sh"
        NPM_READ_ATTEMPTS=3
        NPM_READ_INITIAL_DELAY_SECONDS=15
        NPM_READ_MAX_DELAY_SECONDS=30
        for ((attempt=1; attempt<=NPM_READ_ATTEMPTS; attempt++)); do
          tags=$(npm view @dcl-regenesislabs/bevy-explorer-web dist-tags --json) && break
          [ "$attempt" -ge "$NPM_READ_ATTEMPTS" ] && exit 1
          retry_after_attempt "$attempt" "$NPM_READ_ATTEMPTS" "$NPM_READ_MAX_DELAY_SECONDS" "$NPM_READ_INITIAL_DELAY_SECONDS"
        done
        if jq -e --arg v "$VERSION" '.next == $v' <<<"$tags" >/dev/null; then
          echo 'rollout=true' >> "$GITHUB_OUTPUT"
        elif jq -e --arg v "$VERSION" 'any(to_entries[]; (.key | startswith("pr-")) and .value == $v)' <<<"$tags" >/dev/null; then
          echo "skipping PR preview $VERSION"
        else
          # A publish-tag build, or a main release npm does not show as next yet.
          echo "::warning::not rolling out $VERSION: next is $(jq -r .next <<<"$tags"); use Manual CDN rollout if it should go live"
        fi
    - name: Set Rollout - Development
      if: steps.next.outputs.rollout == 'true'
      uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
      with:
        token: ${{ github.token }}
        ref: ${{ github.event.deployment.ref }}
        sha: ${{ github.event.deployment.sha }}
        packageName: '@dcl-regenesislabs/bevy-explorer-web'
        packageVersion: ${{ github.event.deployment.payload.packageVersion }}
        deploymentPath: 'play'
        deploymentEnvironment: zone
        deploymentName: _site
        percentage: 100
    timeout-minutes: 10
permissions:
  contents: read
  deployments: write
concurrency:
  group: bevy-explorer-cdn-rollout
  cancel-in-progress: false
