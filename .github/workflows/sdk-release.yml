name: SDK / Release
# next on every push to main, auth-server on every push to the auth-server branch, and a versioned
# release from a manual run on main. All publish the @dcl/* names, and only through the npm-release
# environment (main and auth-server only, a repository setting) that the npm trusted publishers
# require: no other branch's run can use it, whatever its workflow says.
on:
  push:
    branches: [main, auth-server]
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
  workflow_dispatch:
    inputs:
      version:
        description: The version to release the five packages as (e.g. 7.34.0, or 7.34.0-rc.1 for a prerelease)
        type: string
        required: true
      notes:
        description: Text placed at the top of the release notes (optional)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # A branch's pushes publish in order and a waiting one gives way to a newer one, so its dist-tag
  # ends on the newest commit; two runs of one release version do not race on its tag.
  group: sdk-release-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false
env:
  SDK_PACKAGES: ecs js-runtime react-ecs sdk-commands sdk
  PNPM: corepack pnpm@12.21.0
jobs:
  check:
    name: Check the release version
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      - name: The release version is valid and new
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "SDK releases are cut from main, not $GITHUB_REF" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be semver without a v prefix, got '$VERSION'" >&2
            exit 1
          fi
          # a version on npm without its tag is a release that stopped midway: rerunning its failed
          # jobs completes it, and the publish job refuses packages another build put on npm
          if git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/@dcl/sdk@$VERSION" > /dev/null; then
            echo "@dcl/sdk@$VERSION already exists; pick a new version" >&2
            exit 1
          fi
  build:
    needs: check
    uses: ./.github/workflows/sdk.yml
    with:
      version: ${{ inputs.version }}
    # the most sdk.yml's jobs may ask for; its preview job, the one that does, is skipped here
    permissions:
      contents: read
      pull-requests: write
      id-token: write
  publish:
    name: Publish to npm
    needs: [check, build]
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/auth-server' && github.event_name == 'push')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      id-token: write # npm OIDC trusted publishing — no token secret
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages-${{ github.sha }}
          path: dist
      - name: Publish in dependency order
        id: publish
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest() { tar -xOf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version'; }
          first=$(manifest ./dist/*-js-runtime-[0-9]*.tgz)
          version=${first##*@}
          if [ -n "$RELEASE" ]; then
            case "$version" in *-*) tag=rc ;; *) tag=latest ;; esac
            [ "$version" = "$RELEASE" ] || { echo "packed $first, expected version $RELEASE" >&2; exit 1; }
          else
            case "$GITHUB_REF" in
              refs/heads/main) tag=next ;;
              refs/heads/auth-server) tag=auth-server ;;
              *) echo "no dist-tag for $GITHUB_REF" >&2; exit 1 ;;
            esac
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.commit-[0-9a-f]+$ ]] || { echo "$tag needs a snapshot version, got $first" >&2; exit 1; }
          fi
          latest=$($PNPM view @dcl/sdk dist-tags.latest 2> /dev/null || true)
          if [ "$tag" = latest ] && [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "$version is below $latest and would move the latest dist-tag back" >&2
            exit 1
          fi
          for name in $SDK_PACKAGES; do
            tgz=./dist/dcl-$name-$version.tgz
            if [ "$(manifest "$tgz")" != "@dcl/$name@$version" ]; then
              echo "$tgz is not @dcl/$name@$version" >&2
              exit 1
            fi
          done
          # A rerun of this run's failed jobs repeats the version with the same tarballs, so a package
          # npm already serves is skipped only when it is this tarball; nothing is published otherwise.
          skip=
          for name in $SDK_PACKAGES; do
            on_npm=$($PNPM view "@dcl/$name@$version" dist.shasum 2> /dev/null || true)
            [ -n "$on_npm" ] || continue
            if [ "$on_npm" != "$(sha1sum "./dist/dcl-$name-$version.tgz" | cut -d' ' -f1)" ]; then
              echo "@dcl/$name@$version is already on npm from another build; pick a new version" >&2
              exit 1
            fi
            skip="$skip $name"
          done
          for name in $SDK_PACKAGES; do
            if [[ " $skip " == *" $name "* ]]; then
              echo "@dcl/$name@$version is already on npm; skipping"
            else
              $PNPM publish "./dist/dcl-$name-$version.tgz" --provenance --access public --tag "$tag" --no-git-checks --registry https://registry.npmjs.org
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
  release:
    name: Create the tag and the release
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages-${{ github.sha }}
          path: dist
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          previous=$(git -c versionsort.suffix=- tag --list '@dcl/sdk@*' --sort=-v:refname | head -1)
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "Packages: $(for name in $SDK_PACKAGES; do printf '%s@dcl/%s@%s%s ' '`' "$name" "$VERSION" '`'; done)"
            echo "Protocol: \`library/protocol\` as of $(git log -1 --format=%h -- library/protocol)."
            echo
            echo "## Changes${previous:+ since $previous}"
            git log --format='- %s (%h)' ${previous:+"$previous.."}HEAD -- library/js-sdk-toolchain library/protocol
          } > notes.md
          args=(--target "$GITHUB_SHA" --title "@dcl/sdk@$VERSION" --notes-file notes.md --latest=false)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          gh release create "@dcl/sdk@$VERSION" dist/*.tgz "${args[@]}"
