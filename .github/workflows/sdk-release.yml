name: SDK / Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish the six packages as (e.g. 7.34.0, or 7.34.0-rc.1 for a prerelease)
        type: string
        required: true
      notes:
        description: Text placed at the top of the release notes (optional)
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        default: ''
permissions:
  contents: read
env:
  SDK_PACKAGES: ecs js-runtime react-ecs sdk-commands sdk playground-assets
jobs:
  check:
    name: Check the version and the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "SDK releases are cut from main, not ${{ github.ref }}" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be semver without a v prefix, got '$VERSION'" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) prerelease=true; dist_tag=rc ;;
            *) prerelease=false; dist_tag=latest ;;
          esac
          {
            echo "version=$VERSION"
            echo "tag=sdk-v$VERSION"
            echo "prerelease=$prerelease"
            echo "dist-tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"
      - name: The tag and the npm versions are new
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -u
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; pick a new version" >&2
            exit 1
          fi
          for name in $SDK_PACKAGES; do
            if npm view "@dcl/$name@$VERSION" version > /dev/null 2>&1; then
              echo "@dcl/$name@$VERSION is already on npm; pick a new version" >&2
              exit 1
            fi
          done
  build:
    name: Build, test, pack
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: true
    defaults:
      run:
        working-directory: library/js-sdk-toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: library/js-sdk-toolchain/package-lock.json
      - name: Install (builds library/protocol's out-ts first)
        run: make install
      - name: Stamp the version into @dcl/sdk (make prepare copies it to the other packages)
        run: cd packages/@dcl/sdk && npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ inputs.version }}
      - name: Lint
        run: make lint
      - name: Package manifests agree
        run: make lint-packages
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Test the CLI
        run: make test-cli
      - name: Pack the releasable packages
        run: make prepare
      - name: Packed manifests name no local dependency
        run: |
          rm -rf .packed && mkdir .packed
          for tgz in packages/@dcl/*/*.tgz; do mkdir -p ".packed/$(basename "$tgz" .tgz)" && tar -xzf "$tgz" -C ".packed/$(basename "$tgz" .tgz)"; done
          node scripts/check-no-local-packages.cjs .packed
          rm -rf dist && mkdir dist && mv packages/@dcl/*/*.tgz dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-packages-${{ needs.check.outputs.version }}
          path: library/js-sdk-toolchain/dist/*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish to npm and release
    needs: [check, build]
    concurrency:
      group: sdk-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # npm OIDC trusted publishing — no token secret
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-packages-${{ needs.check.outputs.version }}
          path: dist
      - name: Publish in dependency order
        env:
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
        run: |
          set -euo pipefail
          for name in $SDK_PACKAGES; do
            npm publish "dist/dcl-$name-$VERSION.tgz" --access public --tag "$DIST_TAG"
          done
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          previous=$(git tag --list 'sdk-v*' --sort=-v:refname | head -1)
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "Packages: $(for name in $SDK_PACKAGES; do printf '%s@dcl/%s@%s%s ' '`' "$name" "$VERSION" '`'; done)"
            echo "Protocol: \`library/protocol\` as of $(git log -1 --format=%h -- library/protocol)."
            echo
            echo "## Changes${previous:+ since $previous}"
            git log --format='- %s (%h)' ${previous:+"$previous.."}HEAD -- library/js-sdk-toolchain library/protocol
          } > notes.md
          args=(--target "$GITHUB_SHA" --title "SDK $VERSION" --notes-file notes.md --latest=false)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.tgz "${args[@]}"
