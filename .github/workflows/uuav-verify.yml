# Verifies the committed UUAV native binaries against their lock on every
# change that could invalidate it, and checks the FFmpeg-free crates (the
# ones the explorer compiles) on all three platforms. The expensive rebuild
# with the reproducibility gates is uuav-native.yml.
name: UUAV binary verification
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - library/uuav/**
      - tooling/uuav/**
      - tooling/native-lock/**
      - tooling/tests/test_native_lock.py
      - tooling/tests/test_uuav_stage_dist.py
      - .gitattributes
      - .github/workflows/uuav-verify.yml
  push:
    branches: [main]
    paths:
      - library/uuav/**
      - tooling/uuav/**
      - tooling/native-lock/**
permissions:
  contents: read
concurrency:
  group: uuav-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DIST_LFS_GLOB: 'library/uuav/dist/**'
  LOCK: tooling/uuav/uuav-binaries.lock.json
jobs:
  verify:
    name: Verify committed binaries against the lock
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - name: Fetch the runtime binaries from LFS
        run: git lfs pull --include "$DIST_LFS_GLOB"
      - name: Test the lock tooling itself
        run: |
          python3 -m unittest discover -s tooling/tests -p 'test_native_lock.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_uuav_stage_dist.py' -v
      - name: Verify hashes, provenance and build inputs
        run: python3 tooling/native-lock/verify-binaries.py --lock "$LOCK"
      - name: Require new native binaries to be stored in LFS
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")
          # The helper is the one shipped binary no extension rule catches: on
          # macOS and Linux it has none. Named explicitly so a committed child
          # cannot land as a plain blob.
          changed=$(git diff --name-only --diff-filter=AM "$base" "$HEAD_SHA" \
            -- '*.dll' '*.dylib' '*.so' '*.so.*' '*.exe' '*/uuav-helper' || true)
          if [ -z "$changed" ]; then
            echo "No native binaries added or modified."
            exit 0
          fi
          status=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            # A file stored in LFS has an ~130 byte pointer as its git blob
            # whose first line is the spec URL; a plain blob is the whole binary.
            if git cat-file blob "$HEAD_SHA:$path" 2>/dev/null \
                 | head -n1 | grep -q '^version https://git-lfs.github.com/spec/v1'; then
              echo "  ok (lfs)    $path"
            else
              echo "::error file=$path::$path was committed as a plain git blob, not Git LFS. Re-add it with the library/uuav/dist rules in .gitattributes in effect. See library/uuav/README.md."
              status=1
            fi
          done <<< "$changed"
          exit $status
      - name: Summary
        if: always()
        run: |
          {
            echo "### UUAV binary verification"
            echo
            echo "Lock: \`$LOCK\`"
            echo
            echo '```'
            python3 tooling/native-lock/verify-binaries.py --lock "$LOCK" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Checks for the FFmpeg-free crates (${{ matrix.os }})
    # uuav-ipc and uuav-client are what the explorer compiles on every
    # platform; they need no FFmpeg headers, so they get their lint and test
    # pass here. uuav-core and uuav-server need FFmpeg 8.1 and are checked in
    # the full native build (uuav-native.yml).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ contains(matrix.os, 'windows') && (vars.RUNNER_WINDOWS || matrix.os)
      || contains(matrix.os, 'macos') && (vars.RUNNER_MACOS || matrix.os)
      || endsWith(matrix.os, '-arm') && (vars.RUNNER_LINUX_ARM || matrix.os)
      || vars.RUNNER_LINUX || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: library/uuav
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - name: Record the toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
      - name: Nothing in this workspace depends on uuav-client
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json, os, sys
          meta = json.load(open(os.environ["RUNNER_TEMP"] + "/metadata.json"))
          offenders = [p["name"] for p in meta["packages"]
                       if p["name"] != "uuav-client"
                       and any(d["name"] == "uuav-client" for d in p["dependencies"])]
          if offenders:
              print(f"::error::{', '.join(offenders)} depend(s) on uuav-client. The host "
                    f"(the explorer) is its only consumer; a second one inside this "
                    f"workspace would carry a second copy of every uuav_* entry point.")
              sys.exit(1)
          print("no package depends on uuav-client")
          PY
      - name: Format
        run: cargo fmt --all --check
      - name: Check and test uuav-ipc
        run: |
          cargo check -p uuav-ipc --all-targets
          cargo test -p uuav-ipc
      - name: Check and test uuav-client
        run: |
          cargo check -p uuav-client --all-targets
          cargo test -p uuav-client
      - name: Clippy
        run: cargo clippy -p uuav-ipc -p uuav-client --all-targets -- -D warnings
