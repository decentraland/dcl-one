name: UI gallery publish

# Publishes the hosted UI gallery of a pull request that changes the shared UI library, once the key scan has
# cleared its Review artifact, and links it from one comment on the pull request. The decision record is
# docs/adr/2026-11-20-ui-gallery-previews.md. It runs from the default branch only: workflow_run always uses main's
# copy of this file, every job checks out this workflow's commit, and the pull request reaches it only as the
# artifact bytes the scan read.
#   verify   holds no credential. tooling/ui-gallery-publish.py proves the scan run, the scanned pull request run,
#            the open pull request at that head, and the artifact id and digest the scan downloaded. Until the
#            repository variables and the ui-gallery environment exist it ends with a notice.
#   publish  checks the downloaded bytes against that digest and unpacks hosted/ before any credential exists, then
#            assumes UI_GALLERY_ROLE_ARN through OIDC (environment ui-gallery, main only), copies the files to
#            ui-gallery/pr/<n>/<sha>/ and waits until the preview answers.
#   comment  creates or updates the pull request's one gallery comment.
on:
  workflow_run:
    workflows: ["Shared UI library key scan"]
    types: [completed]

permissions: {}

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.verify.outputs.publish }}
      pr: ${{ steps.verify.outputs.pr }}
      head: ${{ steps.verify.outputs.head }}
      run: ${{ steps.verify.outputs.run }}
      artifact: ${{ steps.verify.outputs.artifact }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tooling/ui-gallery-publish.py
          sparse-checkout-cone-mode: false
      - name: Verify the key scan, the pull request and the artifact
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAN_RUN_ID: ${{ github.event.workflow_run.id }}
          SCAN_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UI_GALLERY_ROLE_ARN: ${{ vars.UI_GALLERY_ROLE_ARN }}
          UI_GALLERY_BUCKET: ${{ vars.UI_GALLERY_BUCKET }}
          UI_GALLERY_AWS_REGION: ${{ vars.UI_GALLERY_AWS_REGION }}
          UI_GALLERY_BASE_URL: ${{ vars.UI_GALLERY_BASE_URL }}
        run: python3 -I tooling/ui-gallery-publish.py verify

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: ui-gallery
    concurrency:
      group: ui-gallery-publish-${{ needs.verify.outputs.pr }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      expires: ${{ steps.upload.outputs.expires }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tooling/ui-gallery-publish.py
          sparse-checkout-cone-mode: false
      - name: Check the artifact bytes and unpack the hosted gallery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ needs.verify.outputs.head }}
          SCANNED_RUN_ID: ${{ needs.verify.outputs.run }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.digest }}
          WORK_DIR: ${{ runner.temp }}/ui-gallery
        run: python3 -I tooling/ui-gallery-publish.py fetch
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.UI_GALLERY_ROLE_ARN }}
          aws-region: ${{ vars.UI_GALLERY_AWS_REGION }}
          role-duration-seconds: 900
      - name: Upload the hosted gallery
        id: upload
        env:
          PR_NUMBER: ${{ needs.verify.outputs.pr }}
          HEAD_SHA: ${{ needs.verify.outputs.head }}
          WORK_DIR: ${{ runner.temp }}/ui-gallery
          UI_GALLERY_BUCKET: ${{ vars.UI_GALLERY_BUCKET }}
          UI_GALLERY_AWS_REGION: ${{ vars.UI_GALLERY_AWS_REGION }}
        run: python3 -I tooling/ui-gallery-publish.py upload
      - name: Wait until the preview answers
        env:
          PR_NUMBER: ${{ needs.verify.outputs.pr }}
          HEAD_SHA: ${{ needs.verify.outputs.head }}
          WORK_DIR: ${{ runner.temp }}/ui-gallery
          UI_GALLERY_BASE_URL: ${{ vars.UI_GALLERY_BASE_URL }}
        run: python3 -I tooling/ui-gallery-publish.py probe

  comment:
    needs: [verify, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: ui-gallery-comment-${{ needs.verify.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tooling/ui-gallery-publish.py
          sparse-checkout-cone-mode: false
      - name: Link the preview from the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.verify.outputs.pr }}
          HEAD_SHA: ${{ needs.verify.outputs.head }}
          EXPIRES: ${{ needs.publish.outputs.expires }}
          UI_GALLERY_BASE_URL: ${{ vars.UI_GALLERY_BASE_URL }}
        run: python3 -I tooling/ui-gallery-publish.py comment
