name: APIs + Sites / Images
on:
  workflow_call:
  workflow_run:
    workflows: ['Bevy Explorer / CI']
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested images to the configured Quay repositories
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  source:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      attempt: ${{ steps.source.outputs.attempt }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: python3 tooling/bevy-ci.py source --consumer images
  arches:
    # PRs build amd64 only unless an input that can differ by architecture changes.
    if: github.event_name != 'workflow_run'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          sparse-checkout: .github
          persist-credentials: false
      - id: select
        run: |
          both='[{"arch":"amd64","runner":"ubuntu-26.04"},{"arch":"arm64","runner":"ubuntu-26.04-arm"}]'
          matrix=$both
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet HEAD^1 HEAD -- \
              'flake.*' 'rust-toolchain*' .cargo infra/packages infra/containers/images.nix \
              'services/catalyst/rust-toolchain*' 'services/catalyst/Cargo.*' 'services/catalyst/**/Cargo.toml' \
              'library/**/Cargo.toml' apps/dcl-scene-cli/Cargo.toml \
              apps/sites/package.json apps/sites/pnpm-lock.yaml apps/sites/pnpm-workspace.yaml apps/sites/.npmrc \
              'tooling/image-*' .github/workflows/apis-sites-images.yml; then
            matrix='[{"arch":"amd64","runner":"ubuntu-26.04"}]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Image architectures: $matrix"
  build:
    needs: arches
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.arches.outputs.matrix) }}
    # Cancel only compilation; publishing holds a separate non-cancelable slot.
    concurrency:
      group: apis-sites-build-${{ github.event_name }}-${{ github.ref }}-${{ matrix.arch }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
      cancel-in-progress: true
    runs-on: ${{ contains(matrix.runner, 'windows') && (vars.RUNNER_WINDOWS || matrix.runner)
      || contains(matrix.runner, 'macos') && (vars.RUNNER_MACOS || matrix.runner)
      || endsWith(matrix.runner, '-arm') && (vars.RUNNER_LINUX_ARM || matrix.runner)
      || vars.RUNNER_LINUX || matrix.runner }}
    # Main/tag restores are exact-only; fully cold ARM64 builds are unmeasured.
    # A timeout prevents cache saves and can leave subsequent runs cold.
    timeout-minutes: 100
    steps:
      - name: Preserve disk headroom on small runners
        run: |
          df -h /
          available=$(df --output=avail -B1 / | tail -n 1)
          if [ "$available" -lt "$((50 * 1024 * 1024 * 1024))" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          else
            echo "Skipping SDK cleanup: at least 50 GiB available"
          fi
          df -h /
          free -m
      - name: Fetch only the docs media from Git LFS
        run: git config --global lfs.fetchinclude 'apps/sites/content/**'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check the publication rules
        run: |
          python3 -m unittest discover -s tooling/tests -p 'test_image_publish.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_image_cache.py' -v
          python3 -m unittest discover -s tooling/tests -p 'test_ci_publication.py' -v
      - name: Require the reviewed Sites HUD before compiling
        run: |
          locked=$(python3 -c 'import json; print(json.load(open("rendering/bevy-explorer/upstream.lock.json")).get("hud_source_sha256", ""))')
          if [ "$(python3 tooling/play-artifact.py hud-inputs)" != "$locked" ]; then
            echo "::error::Sites HUD adaptation must be reviewed against the current Explorer HUD source"
            exit 1
          fi
      - name: Validate packaged docs before compiling applications
        run: nix build 'git+file:.?lfs=1#sites.docsContent' --no-link -L
      - name: Identify exact Nix cache inputs
        id: cache-keys
        run: python3 tooling/image-cache.py keys --arch '${{ matrix.arch }}'
      - name: Restore Catalyst dependency cache
        id: catalyst-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalyst-nix
          key: ${{ steps.cache-keys.outputs.catalyst-key }}
          # Only PRs receive a stale dependency prefix. Publishing builds require
          # exact main identities; a PR stale hit saves its replacement after smoke.
          restore-keys: |
            ${{ steps.cache-keys.outputs.catalyst-main-key }}
            ${{ steps.cache-keys.outputs.catalyst-main-prefix }}
      - name: Restore Sites dependency cache
        id: sites-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sites-nix
          key: ${{ steps.cache-keys.outputs.sites-key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.sites-main-key }}
            ${{ steps.cache-keys.outputs.sites-main-prefix }}
      - name: Restore the compiled APIs package
        id: apis-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/apis-nix
          # Exact source/compiler/flags identity; only the runtime closure is
          # cached, not a new multi-gigabyte Cargo target tree on each commit.
          key: ${{ steps.cache-keys.outputs.apis-key }}
          restore-keys: ${{ steps.cache-keys.outputs.apis-main-key }}
      - name: Decide which caches a successful build saves
        id: cache-saves
        env:
          CATALYST: ${{ steps.cache-keys.outputs.catalyst-key }} ${{ steps.catalyst-cache.outputs.cache-matched-key }}
          SITES: ${{ steps.cache-keys.outputs.sites-key }} ${{ steps.sites-cache.outputs.cache-matched-key }}
          APIS: ${{ steps.cache-keys.outputs.apis-key }} ${{ steps.apis-cache.outputs.cache-matched-key }}
        run: |
          # An entry is saved when the restored one, if any, is not this exact derivation set.
          saves() { [ "${2##*-}" != "${1##*-}" ] && echo true || echo false; }
          for group in CATALYST SITES APIS; do
            read -r primary matched <<< "${!group}"
            echo "${group,,}=$(saves "$primary" "$matched")" >> "$GITHUB_OUTPUT"
          done
          cat "$GITHUB_OUTPUT"
      - name: Import cached store paths
        run: |
          for cache in .cache/catalyst-nix .cache/sites-nix .cache/apis-nix; do
            if [ -f "$cache/nix-cache-info" ]; then
              # Import canonical names; --all can enumerate hash-x aliases.
              shopt -s nullglob
              narinfo=("$cache"/*.narinfo)
              paths=()
              if [ ${#narinfo[@]} -gt 0 ]; then
                mapfile -t paths < <(sed -n 's/^StorePath: //p' "${narinfo[@]}")
              fi
              if [ ${#paths[@]} -gt 0 ]; then
                nix copy --no-check-sigs --from "file://$PWD/$cache" "${paths[@]}"
              fi
            fi
            # Imported paths live in /nix/store. Export only current closures after smoke tests.
            rm -rf "$cache"
          done
          df -h /
      - name: Build the complete Sites toolchain and dependencies
        # runtime-deps, unlike the fixed-output sites-deps, rebuilds when the lockfile changes.
        run: nix build .#sites-toolchain .#sites-runtime-deps --no-link -L
      - name: Import the matching tested Bevy build for Sites
        timeout-minutes: 95
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PRODUCTION: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          mkdir -p .cache/images
          flags=()
          if [ "$REQUIRE_PRODUCTION" = 1 ]; then flags+=(--prepare-production .cache/images/play-producer.json); fi
          python3 tooling/fetch-play.py --wait 0 "${flags[@]}"
          echo "PLAY_WEB_DIR=$(python3 tooling/fetch-play.py --print-directory)" >> "$GITHUB_ENV"
      - name: Build the APIs and Sites images with our Bevy artifact
        env:
          PLAY_ALLOW_UNOPTIMIZED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          apis=$(nix build --impure 'git+file:.?lfs=1#image-apis' --no-link --print-out-paths -L)
          sites=$(nix build --impure 'git+file:.?lfs=1#image-sites' --no-link --print-out-paths -L)
          images="$apis $sites"
          for image in $images; do
            cp -L "$image" ".cache/images/${image##*-foundation-}"
          done
          docker load --input .cache/images/apis.tar.gz
          docker load --input .cache/images/sites.tar.gz
          df -h /
      - name: Test the exact images before publication
        run: python3 tooling/image-smoke.py --revision "$GITHUB_SHA"
      - name: Allow cache uploads only from current first attempts
        id: cache-writer
        if: steps.cache-keys.outputs.save == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          allowed=false
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
            ref=${GITHUB_REF#refs/}
            expected=$GITHUB_SHA
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              ref=${ref%/merge}/head
              expected=$PR_HEAD_SHA
            fi
            if [ -n "$expected" ] && current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/$ref" --jq .object.sha); then
              if [ "$current" = "$expected" ]; then allowed=true; fi
            else
              echo '::warning::Cannot verify the current ref; skipping cache uploads'
            fi
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
      - name: Export tested Catalyst dependencies
        if: steps.cache-writer.outputs.allowed == 'true' && steps.cache-saves.outputs.catalyst == 'true'
        run: |
          mkdir -p .cache/catalyst-nix
          nix copy --to "file://$PWD/.cache/catalyst-nix?compression=zstd&compression-level=3" \
            .#catalyst-deps .#catalyst-vendor
          du -sh .cache/catalyst-nix
      - name: Save tested Catalyst dependencies
        if: steps.cache-writer.outputs.allowed == 'true' && steps.cache-saves.outputs.catalyst == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalyst-nix
          key: ${{ steps.cache-keys.outputs.catalyst-key }}
      - name: Export tested Sites dependencies
        if: steps.cache-writer.outputs.allowed == 'true' && steps.cache-saves.outputs.sites == 'true'
        run: |
          mkdir -p .cache/sites-nix
          nix copy --to "file://$PWD/.cache/sites-nix?compression=zstd&compression-level=3" \
            .#sites-deps .#sites-runtime-deps .#sites-toolchain
          du -sh .cache/sites-nix
      - name: Save tested Sites dependencies
        if: steps.cache-writer.outputs.allowed == 'true' && steps.cache-saves.outputs.sites == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sites-nix
          key: ${{ steps.cache-keys.outputs.sites-key }}
      - name: Export the tested APIs package
        if: steps.cache-writer.outputs.allowed == 'true' && steps.cache-saves.outputs.apis == 'true'
        run: |
          cache_drv=$(nix eval --raw .#catalyst.drvPath)
          image_drv=$(nix eval --raw --impure 'git+file:.?lfs=1#catalyst.drvPath')
          if [ "$cache_drv" != "$image_drv" ]; then
            echo '::error::Catalyst derivation differs between cache and image refs'
            exit 1
          fi
          mkdir -p .cache/apis-nix
          # Runtime closure only: no extra Cargo target tree or dependency build cache.
          nix copy --to "file://$PWD/.cache/apis-nix?compression=zstd&compression-level=3" .#catalyst
          du -sh .cache/apis-nix
      - name: Save the tested APIs package
        if: steps.cache-writer.outputs.allowed == 'true' && steps.cache-saves.outputs.apis == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/apis-nix
          key: ${{ steps.cache-keys.outputs.apis-key }}
      - name: Upload tested images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apis-sites-images-${{ matrix.arch }}
          path: |
            .cache/images/*.tar.gz
            .cache/images/play-producer.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload the production receipt for validation
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apis-sites-producer-${{ matrix.arch }}
          path: .cache/images/play-producer.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apis-sites-image-smoke-${{ matrix.arch }}
          path: .cache/image-smoke/*.log
          retention-days: 7
  production-ready:
    needs: [source, build]
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_run' && needs.source.result == 'success' && needs.source.outputs.build == 'true') ||
       (needs.build.result == 'success' &&
        ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
         (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')))) &&
      vars.QUAY_APIS_REPOSITORY != '' && vars.QUAY_SITES_REPOSITORY != ''
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 10
    concurrency:
      group: apis-sites-validate-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.source.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: apis-sites-producer-*
          path: .cache/publish
      - name: Require complete Bevy CI for both prepared images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 arm64; do
            python3 tooling/fetch-play.py --verify-production \
              ".cache/publish/apis-sites-producer-$arch/play-producer.json" --wait 0
          done
  publish:
    concurrency:
      group: apis-sites-publish
      queue: max
      cancel-in-progress: false
    needs: [source, build, production-ready]
    if: >-
      !cancelled() && needs.production-ready.result == 'success'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-26.04' }}
    timeout-minutes: 30
    env:
      IMAGE_REVISION: ${{ needs.source.outputs.sha || github.sha }}
      IMAGE_REF: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
      QUAY_APIS_REPOSITORY: ${{ vars.QUAY_APIS_REPOSITORY }}
      QUAY_SITES_REPOSITORY: ${{ vars.QUAY_SITES_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha || github.sha }}
      - name: Skip superseded main publication
        id: current
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.source.outputs.run_id }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_ATTEMPT: ${{ needs.source.outputs.attempt }}
          SOURCE_CONSUMER: images
        run: python3 tooling/ci-publication.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: steps.current.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.current.outputs.publish == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.publish == 'true'
        with:
          run-id: ${{ needs.source.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: apis-sites-images-*
          path: .cache/publish
      - name: Recheck producer identity before registry writes
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in amd64 arm64; do
            python3 tooling/fetch-play.py --verify-production \
              ".cache/publish/apis-sites-images-$arch/play-producer.json"
          done
      - name: Publish tested archives and multi-platform tags
        if: steps.current.outputs.publish == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: nix shell .#image-tools --command python3 tooling/image-publish.py .cache/publish --revision "$IMAGE_REVISION" --ref "$IMAGE_REF"
