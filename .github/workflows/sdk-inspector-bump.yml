name: SDK / Inspector bump
on:
  workflow_call:
    inputs:
      inspector_version:
        required: true
        type: string
    secrets:
      NIXPKGS_UPDATE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      inspector_version:
        description: '@dcl/inspector version to pin in @dcl/sdk-commands (npm latest when empty)'
        required: false
        type: string
permissions: {}
concurrency:
  group: sdk-inspector-bump
  cancel-in-progress: false
jobs:
  bump:
    name: Open the SDK bump pull request
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.NIXPKGS_UPDATE_APP_ID }}
          private-key: ${{ secrets.NIXPKGS_UPDATE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: corepack enable
      - name: Resolve the Inspector and the asset packs it asks for
        id: versions
        working-directory: library/js-sdk-toolchain
        env:
          REQUESTED: ${{ inputs.inspector_version }}
        run: |
          release() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$1' is not a release version"; exit 1; }; }
          inspector=${REQUESTED:-$(pnpm view @dcl/inspector dist-tags.latest)}
          release "$inspector"
          range=
          for ((i = 1; i <= 12; i++)); do
            range=$(pnpm view "@dcl/inspector@$inspector" 'dependencies.@dcl/asset-packs' 2>/dev/null) && [ -n "$range" ] && break
            echo "@dcl/inspector@$inspector not resolvable yet (attempt $i); retrying in 30s"
            sleep 30
          done
          if [ -z "$range" ]; then
            echo "::error::@dcl/inspector@$inspector is not on npm or names no @dcl/asset-packs"
            exit 1
          fi
          asset_packs=$(pnpm view "@dcl/asset-packs@$range" version --json | jq -r 'if type == "array" then last else . end')
          release "$asset_packs"
          echo "@dcl/inspector@$inspector asks for @dcl/asset-packs@$range: $asset_packs"
          printf 'inspector=%s\nasset_packs=%s\n' "$inspector" "$asset_packs" >> "$GITHUB_OUTPUT"
      - name: Pin them in @dcl/sdk-commands
        id: bump
        working-directory: library/js-sdk-toolchain
        env:
          INSPECTOR: ${{ steps.versions.outputs.inspector }}
          ASSET_PACKS: ${{ steps.versions.outputs.asset_packs }}
        run: |
          sed -i -E "s|^(  \"@dcl/asset-packs\": )\"[^\"]*\"|\1\"$ASSET_PACKS\"|" pnpm-workspace.yaml
          for ((i = 1; i <= 10; i++)); do
            pnpm --filter @dcl/sdk-commands add --save-exact --lockfile-only \
              "@dcl/inspector@$INSPECTOR" "@dcl/asset-packs@$ASSET_PACKS" && break
            [ "$i" = 10 ] && exit 1
            echo "not resolvable yet (attempt $i); retrying in 30s"
            sleep 30
          done
          git diff --stat
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}[bot]
          INSPECTOR: ${{ steps.versions.outputs.inspector }}
          ASSET_PACKS: ${{ steps.versions.outputs.asset_packs }}
        run: |
          git config user.name "$APP"
          git config user.email "$(gh api "users/$APP" --jq .id)+$APP@users.noreply.github.com"
          branch=bot/sdk-inspector-bump
          title="chore(sdk): bump @dcl/inspector to $INSPECTOR"
          body="Pins \`@dcl/inspector@$INSPECTOR\` in \`@dcl/sdk-commands\`, with the \`@dcl/asset-packs@$ASSET_PACKS\` it asks for. Merging it releases a patch of the SDK to npm \`latest\` (SDK / CI). Generated by the SDK / Inspector bump workflow."
          git checkout -B "$branch"
          git add library/js-sdk-toolchain/packages/@dcl/sdk-commands/package.json \
            library/js-sdk-toolchain/pnpm-workspace.yaml library/js-sdk-toolchain/pnpm-lock.yaml
          git commit -m "$title" -m "@dcl/asset-packs $ASSET_PACKS, the version @dcl/inspector@$INSPECTOR asks for."
          git push --force origin "$branch"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head "$branch" --title "$title" --body "$body"
          fi
