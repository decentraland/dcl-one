name: Scene CLI journeys
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing PR journey run to publish; leave empty to capture journeys
        type: string
        default: ''
  pull_request:
    paths: &scene-cli-inputs
      - 'apps/dcl-scene-cli/**'
      - 'library/**'
      - 'services/catalyst/Cargo.*'
      - 'services/catalyst/rust-toolchain.toml'
      - '.cargo/**'
      - 'flake.*'
      - 'tooling/scene-cli-*'
      - 'tooling/tests/test_scene_cli_journeys.py'
      - '.github/workflows/scene-cli-journeys.yml'
  push:
    branches: [main]
    paths: *scene-cli-inputs
permissions:
  contents: read
concurrency:
  group: scene-cli-journeys-${{ inputs.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    if: inputs.run_id == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/scene-cli-target
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: &scene-cli-cache |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/dcl-scene-cli-abgen
            ~/.cache/dcl-scene-cli-livekit
          key: scene-cli-${{ runner.os }}-${{ hashFiles('head/flake.lock', 'head/services/catalyst/Cargo.lock') }}-${{ github.sha }}
          restore-keys: scene-cli-${{ runner.os }}-${{ hashFiles('head/flake.lock', 'head/services/catalyst/Cargo.lock') }}-
      - name: Check report publication contracts
        working-directory: head
        run: python3 -m unittest discover -s tooling/tests -p test_scene_cli_journeys.py -v
      - name: Check editor behavior
        working-directory: head
        run: nix develop --command node --test apps/dcl-scene-cli/scripts/{scene-editor,storage-ui,preview-connection}.test.mjs
      - name: Build base CLI
        id: base
        working-directory: base/services/catalyst
        run: |
          nix develop "$GITHUB_WORKSPACE/base" --command cargo build --locked -p dcl-scene-cli
          cp "$CARGO_TARGET_DIR/debug/dcl-scene-cli" "$RUNNER_TEMP/dcl-scene-cli-base"
      - name: Build proposed CLI
        id: head
        if: ${{ !cancelled() }}
        working-directory: head/services/catalyst
        run: |
          nix develop "$GITHUB_WORKSPACE/head" --command cargo build --locked -p dcl-scene-cli
          cp "$CARGO_TARGET_DIR/debug/dcl-scene-cli" "$RUNNER_TEMP/dcl-scene-cli-head"
      - name: Capture base journeys
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        working-directory: head
        run: nix develop --command node tooling/scene-cli-journeys.mjs --binary "$RUNNER_TEMP/dcl-scene-cli-base" --revision "$BASE_SHA" --label base --output "$GITHUB_WORKSPACE/journeys/base"
      - name: Capture proposed journeys
        if: ${{ !cancelled() && steps.head.outcome == 'success' }}
        working-directory: head
        run: nix develop --command node tooling/scene-cli-journeys.mjs --binary "$RUNNER_TEMP/dcl-scene-cli-head" --revision "$HEAD_SHA" --label head --output "$GITHUB_WORKSPACE/journeys/head"
      - name: Render before and after report
        if: ${{ !cancelled() }}
        working-directory: head
        run: |
          mkdir -p "$GITHUB_WORKSPACE/journeys"
          python3 tooling/scene-cli-journey-report.py render "$GITHUB_WORKSPACE/journeys"
          echo 'Journey screenshots and the HTML comparison are in the scene-cli-journeys artifact. External runtime and live wallet boundaries are listed in the report.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scene-cli-journeys
          path: journeys/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && success()
        with:
          path: *scene-cli-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
  report:
    needs: journeys
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.journeys.result != 'skipped') ||
       (github.event_name == 'workflow_dispatch' && inputs.run_id != ''))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tooling/scene-cli-journey-report.py
          sparse-checkout-cone-mode: false
      - name: Publish changed journeys
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
          PRODUCER_RESULT: ${{ github.event_name == 'pull_request' && needs.journeys.result || '' }}
        run: |
          if [ ! -f tooling/scene-cli-journey-report.py ]; then
            echo '::notice::The publisher becomes available after this workflow is merged.'
            exit 0
          fi
          python3 tooling/scene-cli-journey-report.py publish --repo "$REPO" --run-id "$RUN_ID" --producer-result "$PRODUCER_RESULT"
