name: Protocol / CI
on:
  push:
    branches: [main]
    paths:
      - library/protocol/**
      - flake.nix
      - flake.lock
      - .github/workflows/protocol.yml
  pull_request:
    paths:
      - library/protocol/**
      - flake.nix
      - flake.lock
      - .github/workflows/protocol.yml
permissions:
  contents: read
jobs:
  check:
    name: Lint, build, wire compatibility, generation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against origin/main's proto tree (git archive, no LFS)
          fetch-depth: 0
          lfs: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the development shell and locate the pnpm store
        run: echo "PNPM_STORE=$(nix develop "$GITHUB_WORKSPACE" --command pnpm store path)" >> "$GITHUB_ENV"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: protocol-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('library/protocol/pnpm-lock.yaml') }}
          restore-keys: |
            protocol-pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies and the google well-known types
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/protocol install
      - name: Lint
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/protocol buf-lint
      - name: Build the image
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/protocol buf-build
      - name: Wire compatibility against main
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/protocol buf-breaking
      - name: Generate out-ts/out-js and run the wire tests
        run: nix develop "$GITHUB_WORKSPACE" --command make -C library/protocol build test
      - name: Save the pnpm store from main
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
