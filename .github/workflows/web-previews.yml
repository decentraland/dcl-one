name: Web previews / Build
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: web-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      sites: ${{ steps.changes.outputs.sites }}
      reviewer: ${{ steps.changes.outputs.reviewer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check preview selection and publication rules
        run: python3 -m unittest discover -s tooling/tests -p test_web_preview.py -v
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tooling/web-preview.py select --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
  reviewer:
    name: UI reviewer
    needs: changes
    if: needs.changes.outputs.reviewer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch reviewer media
        run: git lfs pull --include='library/ui/**'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable the pinned package manager
        working-directory: library/ui
        run: corepack enable
      - name: Install reviewer dependencies
        working-directory: library/ui
        run: pnpm install --frozen-lockfile
      - name: Build the static reviewer with relative assets
        working-directory: library/ui
        run: pnpm review:build --base ./
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-preview-reviewer
          path: library/ui/figma/review/review-dist/
          if-no-files-found: error
          retention-days: 7
  sites:
    name: Sites
    needs: changes
    if: needs.changes.outputs.sites == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch Sites media
        run: git lfs pull --include='apps/sites/**,apps/ui3/**'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Enable project package managers
        run: corepack enable
      - name: Install Sites UI dependencies
        working-directory: apps/ui3
        run: pnpm install --frozen-lockfile
      - name: Install Sites dependencies
        working-directory: apps/sites
        run: pnpm install --frozen-lockfile
      - name: Build Sites
        working-directory: apps/sites
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-preview-sites
          path: apps/sites/build/
          if-no-files-found: error
          retention-days: 7
