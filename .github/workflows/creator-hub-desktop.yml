name: Creator Hub
on:
  workflow_call:
    secrets:
      CREATOR_HUB_RELEASES_APP_PRIVATE_KEY:
        required: false
      ES_PASSWORD:
        required: false
      ES_TOTP_SECRET:
        required: false
      ES_USERNAME:
        required: false
      MACOS_CSC_KEY_PASSWORD:
        required: false
      MACOS_CSC_LINK:
        required: false
      MACOS_NOTARIZATION_APPLE_ID:
        required: false
      MACOS_NOTARIZATION_PWD:
        required: false
      MACOS_NOTARIZATION_TEAM_ID:
        required: false
      SDK_TEAM_AWS_REGION:
        required: false
      SDK_TEAM_S3_BASE_URL:
        required: false
      SDK_TEAM_S3_BUCKET:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_DSN:
        required: false
      VITE_ALLOWED_EXTERNAL_ORIGINS:
        required: false
      VITE_SEGMENT_CREATORS_HUB_API_KEY:
        required: false
      VITE_SEGMENT_INSPECTOR_API_KEY:
        required: false
      WINDOWS_CREDENTIAL_ID_SIGNER:
        required: false
    inputs:
      dry-run:
        description: 'Compiles the app but not upload artifacts to distribution server'
        default: false
        required: false
        type: boolean
      inspector_s3_bucket_key:
        description: 'S3 bucket key for the inspector package'
        required: true
        type: string
      inspector_version:
        description: 'Version of the inspector package'
        required: true
        type: string
      inspector_changed:
        description: 'Whether the version of the inspector package has changed'
        required: true
        type: boolean
      macos-windows:
        description: 'Build the macOS and Windows installers'
        required: true
        type: boolean
      linux:
        description: 'Build the Linux installers'
        required: true
        type: boolean
    outputs:
      version:
        description: 'Version of the installers this run built (and, on a release, published)'
        value: ${{ jobs.build.outputs.version }}

concurrency:
  group: creator-hub-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: 'bash'
    working-directory: apps/creator-hub

jobs:
  build:
    strategy:
      # One leg failing must not show up as a cancellation of the other.
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-22.04 ]
        # The caller picks the platforms. An entry that names no leg drops nothing.
        exclude:
          - os: ${{ !inputs.macos-windows && 'macos-latest' || '' }}
          - os: ${{ !inputs.macos-windows && 'windows-latest' || '' }}
          - os: ${{ !inputs.linux && 'ubuntu-22.04' || '' }}
    runs-on: ${{ matrix.os }}
    # Signing, notarization and the release-repo token live in the main-only environment. Only a
    # release reads them.
    environment: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run && 'creator-hub-release' || '' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # One output for each leg: the legs of a matrix share the job's outputs.
      macos: ${{ steps.uploaded.outputs.macos }}
      windows: ${{ steps.uploaded.outputs.windows }}
      linux: ${{ steps.uploaded.outputs.linux }}
      macos-seconds: ${{ steps.uploaded.outputs.macos-seconds }}
      windows-seconds: ${{ steps.uploaded.outputs.windows-seconds }}
      linux-seconds: ${{ steps.uploaded.outputs.linux-seconds }}
    env:
      # Dependabot runs (and re-runs of them) and fork PRs get no repository secrets and a
      # read-only token, so the S3 test build upload and its PR comment can't run there.
      # The compile above them still runs, so the required build checks stay meaningful.
      CAN_UPLOAD_PR_BUILD: ${{ secrets.SDK_TEAM_S3_BUCKET != '' && vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none

      # The time in the pull request's test builds comment counts from here to the upload.
      - name: Start the build clock
        run: echo "BUILD_START_MS=$(node -p 'Date.now()')" >> "$GITHUB_ENV"

      - uses: ./.github/actions/creator-hub-setup
        id: setup
        with:
          cache-electron: 'true'

      - name: install
        if: steps.setup.outputs.node-modules-cache-hit != 'true'
        run: make install-creator-hub
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: install inspector
        working-directory: apps/creator-hub/packages/creator-hub
        env:
          INSPECTOR_S3_KEY: ${{ inputs.inspector_s3_bucket_key }}
          S3_BASE_URL: ${{ secrets.SDK_TEAM_S3_BASE_URL }}
        run: |
          # If the inspector version hasn't changed or we are on main branch, we need to install the latest version
          # Otherwise, we need to install the version from the S3 bucket

          if [[ "${{ github.ref }}" == "refs/heads/main" || ${{ inputs.inspector_changed }} == "false" ]]; then
            echo "Installing latest inspector version: ${{ inputs.inspector_version }}"
            # The registry lists a just-published inspector after up to 12 minutes, then caches the old list for 300s.
            for ((i = 1; i <= 50; i++)); do
              pnpm add "@dcl/inspector@${{ inputs.inspector_version }}" && exit 0
              echo "@dcl/inspector@${{ inputs.inspector_version }} not resolvable yet (attempt $i); retrying in 30s"
              sleep 30
            done
            pnpm view @dcl/inspector versions --json | tail -5 || true
            exit 1
          elif [[ -n "$INSPECTOR_S3_KEY" ]]; then
            echo "Installing inspector version from S3 bucket: $INSPECTOR_S3_KEY"
            # A pull request's inspector package can name its asset-packs by S3 link, which pnpm
            # refuses in a dependency's own dependencies unless told otherwise.
            pnpm add --config.blockExoticSubdeps=false "$S3_BASE_URL/$INSPECTOR_S3_KEY"
          else
            # No S3 package (fork or Dependabot PR): build against the last published inspector.
            echo "::warning::No inspector package for this PR; building against @dcl/inspector@latest"
            pnpm add @dcl/inspector@latest
          fi

      # node-pty has no Linux prebuild, so its install compiles it. Every Linux job shares the
      # node_modules cache and the other jobs run on a newer image: compile it again here, so the
      # installers need no newer glibc than this image has.
      - name: Compile node-pty on the build image
        if: runner.os == 'Linux'
        run: pnpm rebuild node-pty

      - name: build
        run: make build-creator-hub
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          NODE_OPTIONS: "--max-old-space-size=8192"
          MODE: ${{ !inputs.dry-run && 'production' || 'development' }}
          VITE_SEGMENT_CREATORS_HUB_API_KEY: ${{ secrets.VITE_SEGMENT_CREATORS_HUB_API_KEY }}
          VITE_SEGMENT_INSPECTOR_API_KEY: ${{ secrets.VITE_SEGMENT_INSPECTOR_API_KEY }}
          VITE_ALLOWED_EXTERNAL_ORIGINS: ${{ secrets.VITE_ALLOWED_EXTERNAL_ORIGINS }}
          # Sentry AUTH Token
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      # macos-latest runners are arm64, so the install only pulls the host-arch oxc-parser
      # native binding. electron-builder then packs BOTH the arm64 and x64 dmgs from that single
      # node_modules, leaving the Intel build with no loadable parser ("Failed to load native
      # binding"). Fetch the cross-arch binding straight from its tarball into node_modules
      # (an install would reconcile the whole workspace right before packaging) so both dmgs
      # ship a working parser.
      - name: Provision cross-arch macOS oxc-parser binding
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          OXC=$(node -p "require('oxc-parser/package.json').version")
          HOST=$(node -p process.arch)
          OTHER=$([ "$HOST" = "arm64" ] && echo x64 || echo arm64)
          DIR="node_modules/@oxc-parser/binding-darwin-$OTHER"
          if [ ! -e "$DIR/parser.darwin-$OTHER.node" ]; then
            echo "Host arch $HOST -> fetching @oxc-parser/binding-darwin-$OTHER@$OXC"
            TMP=$(mktemp -d)
            SPEC="@oxc-parser/binding-darwin-$OTHER@$OXC"
            curl -fsSL "$(pnpm view "$SPEC" dist.tarball)" -o "$TMP/binding.tgz"
            # The registry's sha512 for that tarball, which npm pack checked on its own.
            INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TMP/binding.tgz" | base64 | tr -d '\n')"
            if [ "$INTEGRITY" != "$(pnpm view "$SPEC" dist.integrity)" ]; then
              echo "::error::$SPEC does not match the registry's integrity"
              exit 1
            fi
            mkdir -p "$DIR"
            tar -xzf "$TMP/binding.tgz" -C "$DIR" --strip-components=1
            rm -rf "$TMP"
          fi
          for A in arm64 x64; do
            test -e "node_modules/@oxc-parser/binding-darwin-$A/parser.darwin-$A.node" \
              || { echo "::error::missing @oxc-parser/binding-darwin-$A native binding"; exit 1; }
          done

      - name: Bump release version
        id: version
        uses: paulhatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: "creator-hub@"
          version_format: ${major}.${minor}.${patch}
          major_pattern: "/^(major|breaking).+/"
          minor_pattern: "/^(minor|feat).+/"
          bump_each_commit: false
          bump_each_commit_patch_pattern: "/^(patch|fix).+/"
          search_commit_body: true
          user_format_type: "json"
          # The renderer bundle also holds apps/ui3/src/atoms (the `@ui` alias in apps/creator-hub/packages/creator-hub/renderer/vite.config.js)
          # and the LAND map with its helpers (the include list of apps/creator-hub/packages/creator-hub/renderer/tsconfig.ui3.json),
          # built with the ui3 package (sideEffects) and compiler settings (jsx, paths).
          change_path: "apps/creator-hub apps/ui3/package.json apps/ui3/tsconfig.json apps/ui3/src/atoms apps/ui3/src/shop/land apps/ui3/src/shop/checkout/chain apps/ui3/src/explorer/components/MapSurface.tsx apps/ui3/src/explorer/components/mapsurface.css apps/ui3/src/data apps/ui3/src/generated/bridge library/shop library/web-core/shop-chain-env.ts library/web-core/site.ts"

      # With no `creator-hub@X.Y.Z` tag, semantic-version counts from 0.0.0, and a release on main
      # would publish 0.1.0 installers. Tag the last released version first (cut-over runbook).
      - name: Require a baseline version tag on main
        if: github.ref == 'refs/heads/main'
        env:
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous_version }}
        run: |
          if [ "$PREVIOUS_VERSION" = 0.0.0 ]; then
            echo "::error::No creator-hub@X.Y.Z tag found; tag the last released version before releasing from main"
            exit 1
          fi

      # Installers are published to decentraland/creator-hub, a release-only repository: every
      # installed app's updater reads its GitHub releases (electron-builder.cjs `publish`).
      - name: Token for the release repository
        id: release-token
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CREATOR_HUB_RELEASES_APP_ID }}
          private-key: ${{ secrets.CREATOR_HUB_RELEASES_APP_PRIVATE_KEY }}
          owner: decentraland
          repositories: creator-hub

      # Download 'SSLcom/esigner-codesign' to a folder called 'esigner-codesign' in the root of the project
      - name: Checkout esigner-codesign repository (Windows)
        if: ${{github.ref == 'refs/heads/main' && matrix.os == 'windows-latest' && !inputs.dry-run}}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'SSLcom/esigner-codesign'
          # Its dist/index.js runs with the eSigner credentials and the release token, so it is
          # pinned like any third-party action (default-branch head on 2025-06-23).
          ref: b7f8ff36fc0de8690fbbab8e5b4421d29802f747
          path: esigner-codesign
          persist-credentials: false

      - name: Compile creator-hub artifacts ${{ inputs.dry-run && ' ' || 'and upload them to github release' }}
        # I use this action because it is capable of retrying multiple times if there are any issues with the distribution server
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 60
          max_attempts: 6
          retry_wait_seconds: 15
          retry_on: error
          shell: 'bash'
          command: cd apps/creator-hub && pnpm exec electron-builder --project packages/creator-hub --config electron-builder.cjs --config.extraMetadata.version=${{ steps.version.outputs.version }} ${{ matrix.os == 'macos-latest' && format('--config.mac.notarize={0}', true) || '' }} --publish ${{ inputs.dry-run && 'never' || 'always' }}
        env:
          # Disable hard links to avoid issues with the installed packages
          USE_HARD_LINKS: false
          # Fix C++ standard for native dependencies
          CXXFLAGS: "-std=gnu++17"
          # Every run but a release builds only the unsigned .zip (no .dmg); see electron-builder.cjs
          DRY_RUN: ${{ inputs.dry-run }}
          # Code Signing params
          # See https://www.electron.build/code-signing
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          # Notarization params
          # See https://www.electron.build/configuration/mac#NotarizeNotaryOptions
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
          # Publishing artifacts
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EP_PRE_RELEASE: true # Publish as pre-release
          # The following are the parameters required by the esigner-codesign action to work, we must explicitly pass in even the optional ones since we're not using the action directly, but from the checked out repo
          # Only set CODE_SIGN_SCRIPT_PATH on main (non-dry-run) to match the esigner-codesign checkout condition above
          CODE_SIGN_SCRIPT_PATH: ${{ github.ref == 'refs/heads/main' && matrix.os == 'windows-latest' && !inputs.dry-run && format('{0}\\esigner-codesign\\dist\\index.js', github.workspace) || '' }}
          INPUT_COMMAND: "sign"
          INPUT_FILE_PATH: "${{ github.workspace }}\\apps\\creator-hub\\dist\\Decentraland Creator Hub-${{ steps.version.outputs.version }}-win-x64.exe"
          INPUT_OVERRIDE: "true"
          INPUT_MALWARE_BLOCK: "false"
          INPUT_CLEAN_LOGS: "false"
          INPUT_JVM_MAX_MEMORY: "1024M"
          INPUT_ENVIRONMENT_NAME: "PROD"
          INPUT_USERNAME: ${{ secrets.ES_USERNAME }}
          INPUT_PASSWORD: ${{ secrets.ES_PASSWORD }}
          INPUT_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          INPUT_CREDENTIAL_ID: ${{ secrets.WINDOWS_CREDENTIAL_ID_SIGNER }}

      # Installed apps on macOS 12 must not take a build that macOS 12 cannot open: electron-updater
      # compares this Darwin version with os.release() (scripts/after-pack.js).
      - name: Check that the macOS update file has the minimum Darwin version
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: apps/creator-hub/packages/creator-hub
        run: |
          grep -Eq "^minimumSystemVersion: '?22\.0\.0'?$" dist/latest-mac.yml && exit 0
          echo "::error::dist/latest-mac.yml has no minimumSystemVersion 22.0.0"
          cat dist/latest-mac.yml
          exit 1

      # Assistant Insights reads which system prompt, tools and skills denylist each release's AI
      # assistant had from this file, checking its hashes against the shared turns'. Built on
      # every run so a broken script fails the PR; attached to the release once, by the macOS leg.
      - name: Build the assistant manifest
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: apps/creator-hub/packages/creator-hub
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          node scripts/assistant-manifest/run.mjs dist/assistant-manifest.json "$VERSION" "$GITHUB_SHA"

      - name: Attach the assistant manifest to the release
        if: ${{ matrix.os == 'macos-latest' && github.ref == 'refs/heads/main' && !inputs.dry-run }}
        working-directory: apps/creator-hub/packages/creator-hub
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$VERSION" dist/assistant-manifest.json --repo decentraland/creator-hub --clobber

      # Installed Windows apps check each update's signature against `publisherName`
      # (electron-builder.cjs `win.signtoolOptions`). A certificate whose name differs would make
      # every Windows update fail, so a release whose installer doesn't match fails here, before
      # anyone promotes it.
      - name: Check the installer's signature matches the update check
        if: ${{ github.ref == 'refs/heads/main' && matrix.os == 'windows-latest' && !inputs.dry-run }}
        shell: pwsh
        working-directory: apps/creator-hub/packages/creator-hub
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $expected = node -p "require('./electron-builder.cjs').win.signtoolOptions.publisherName"
          $signature = Get-AuthenticodeSignature "dist/Decentraland Creator Hub-$env:VERSION-win-x64.exe"
          if ($signature.Status -ne 'Valid') { throw "The installer's signature is $($signature.Status)" }
          $name = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($name -ne $expected) { throw "The certificate is issued to '$name', but updates check for '$expected'" }
          Write-Output "Signed by '$name', as updates expect"

      # electron-updater updates an app that has resources/package-type with that package manager.
      # The deb target writes the file into the unpacked app, which the AppImage is also made from,
      # so an AppImage with the file would install the deb as its update.
      # The last check keeps the supported systems true: a native module or program compiled on a
      # newer image needs a newer glibc or libstdc++ than Ubuntu 22.04 has. It reads app.asar too,
      # since a native module packed there still loads.
      - name: Check the AppImage
        if: runner.os == 'Linux'
        working-directory: apps/creator-hub/packages/creator-hub/dist
        env:
          NEWEST_GLIBC: GLIBC_2.35
          NEWEST_GLIBCXX: GLIBCXX_3.4.30
        run: |
          appimage=$(ls "$PWD"/*.AppImage)
          app=$(dirname "$PWD")
          cd "$RUNNER_TEMP"
          "$appimage" --appimage-extract > /dev/null
          test -f squashfs-root/resources/app-update.yml
          if [ -e squashfs-root/resources/package-type ]; then
            echo "::error::The AppImage has resources/package-type ($(cat squashfs-root/resources/package-type))"; exit 1
          fi
          test -f squashfs-root/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node
          (cd "$app" && node -e "require(require.resolve('@electron/asar', { paths: [require.resolve('app-builder-lib/package.json')] })).extractAll(process.argv[1], process.argv[2])" \
            "$RUNNER_TEMP/squashfs-root/resources/app.asar" "$RUNNER_TEMP/app-asar")
          # Prints the newest version of a symbol prefix (GLIBC_, GLIBCXX_) that the file needs.
          newest() { objdump -T "$1" 2>/dev/null | grep -oE "$2[0-9.]+" | sort -uV | tail -n 1 || true; }
          {
            find squashfs-root/resources app-asar -name '*.node'
            echo squashfs-root/resources/node-bin/bin/node
          } | while read -r file; do
            test -f "$file" || { echo "::error::$file is missing"; exit 1; }
            for limit in "$NEWEST_GLIBC" "$NEWEST_GLIBCXX"; do
              needs=$(newest "$file" "${limit%_*}_")
              if [ -n "$needs" ] && [ "$(printf '%s\n' "$limit" "$needs" | sort -V | tail -n 1)" != "$limit" ]; then
                echo "::error::$file needs $needs, newer than $limit"; exit 1
              fi
            done
          done

      - name: Move artifacts to upload folder
        if: ${{ github.event.pull_request.number && env.CAN_UPLOAD_PR_BUILD == 'true' }}
        working-directory: apps/creator-hub/packages/creator-hub
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # A test build's file name has the pull request and its head commit after the version, as
        # the test builds comment links it (.github/actions/creator-hub-test-builds/section.sh).
        run: |
          mkdir dist/upload
          for file in dist/*.dmg dist/*.exe dist/*.zip dist/*.AppImage dist/*.deb; do
            [ -f "$file" ] || continue
            name=${file##*/}
            cp "$file" "dist/upload/${name/-$VERSION-/-$VERSION-$PR_NUMBER-${HEAD_SHA:0:7}-}"
          done

      - name: AWS role for the SDK bucket
        if: ${{ github.event.pull_request.number && env.CAN_UPLOAD_PR_BUILD == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN }}
          aws-region: ${{ secrets.SDK_TEAM_AWS_REGION }}

      - name: Upload to S3
        if: ${{ github.event.pull_request.number && env.CAN_UPLOAD_PR_BUILD == 'true' }}
        id: upload
        working-directory: apps/creator-hub/packages/creator-hub
        env:
          S3_BUCKET: ${{ secrets.SDK_TEAM_S3_BUCKET }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pnpm dlx @dcl/cdn-uploader@next \
            --bucket "$S3_BUCKET" \
            --local-folder dist/upload \
            --bucket-folder "creator-hub/branch/${HEAD_REF}"

      - name: Record that the test build is in the bucket
        if: ${{ github.event.pull_request.number && env.CAN_UPLOAD_PR_BUILD == 'true' }}
        id: uploaded
        env:
          LEG: ${{ matrix.os == 'macos-latest' && 'macos' || matrix.os == 'windows-latest' && 'windows' || 'linux' }}
        run: |
          echo "$LEG=uploaded" >> "$GITHUB_OUTPUT"
          echo "$LEG-seconds=$(node -p "((Date.now() - $BUILD_START_MS) / 1000).toFixed(3)")" >> "$GITHUB_OUTPUT"

  # One section of the pull request's test builds comment for every platform it built. It also runs
  # when a leg failed, to show which one.
  comment:
    needs: build
    if: ${{ !cancelled() && github.event.pull_request.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # The same limit as the upload in `build`: without the secrets there is no test build, and
      # the token cannot write the comment.
      CAN_UPLOAD_PR_BUILD: ${{ secrets.SDK_TEAM_S3_BUCKET != '' && vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CAN_UPLOAD_PR_BUILD == 'true' && needs.build.outputs.version != ''
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/creator-hub-test-builds
            .github/actions/bevy-explorer-ci-status
          sparse-checkout-cone-mode: false
      - name: Write the desktop section of the test builds comment
        if: env.CAN_UPLOAD_PR_BUILD == 'true' && needs.build.outputs.version != ''
        uses: ./.github/actions/creator-hub-test-builds
        with:
          pr-number: ${{ github.event.pull_request.number }}
          section: desktop
          github-token: ${{ github.token }}
          base-url: ${{ secrets.SDK_TEAM_S3_BASE_URL }}
          version: ${{ needs.build.outputs.version }}
          branch: ${{ github.head_ref }}
          # `skipped`: this run did not build that platform, so the section leaves it out.
          macos: ${{ !inputs.macos-windows && 'skipped' || needs.build.outputs.macos }}
          windows: ${{ !inputs.macos-windows && 'skipped' || needs.build.outputs.windows }}
          linux: ${{ !inputs.linux && 'skipped' || needs.build.outputs.linux }}
          macos-seconds: ${{ needs.build.outputs.macos-seconds }}
          windows-seconds: ${{ needs.build.outputs.windows-seconds }}
          linux-seconds: ${{ needs.build.outputs.linux-seconds }}

  # The installers' releases live in decentraland/creator-hub, so nothing tags this repository.
  # semantic-version reads `creator-hub@X.Y.Z` tags here to compute the next version.
  tag:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the released version
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: creator-hub@${{ needs.build.outputs.version }}
        # A re-run of a finished run finds the tag already there; that is success only when it
        # points at this commit.
        run: |
          if existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null); then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "${TAG} already points at ${GITHUB_SHA}"; exit 0
            fi
            echo "::error::${TAG} already exists at ${existing}, not ${GITHUB_SHA}"; exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}"
