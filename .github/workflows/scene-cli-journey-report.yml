name: Scene CLI journey report
on:
  workflow_run:
    workflows: [Scene CLI journeys]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed pull-request journey run to publish
        type: string
        required: true
permissions: {}
concurrency:
  group: scene-cli-journey-report-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || inputs.run_id }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: tooling/scene-cli-journey-report.py
          sparse-checkout-cone-mode: false
      - name: Publish validated screenshots and update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 tooling/scene-cli-journey-report.py publish --repo "$REPO" --run-id "$RUN_ID"
