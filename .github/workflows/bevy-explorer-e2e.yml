# The Explorer end-to-end suite (apps/bevy-explorer/e2e): explorer-automation's scenarios restated
# against the Bevy Explorer and driven through its console (docs/adr/2026-10-29-explorer-tests-
# through-the-console.md). The suite's own checks (typecheck, the driver's tests against the
# runner's Chrome, the tooling tests) run on pull requests that change it. The scenarios run
# against the web app a Bevy Explorer / CI run built, which tooling/bevy-e2e-inputs.py picks:
#
# - on a pull request of this repository, when a maintainer applies the `ci:e2e` label: the label
#   admits the commit it is applied to, and that alone (a push takes the label off and runs
#   nothing; the maintainer puts it back to run the new commit), from the pull request's own event,
#   so the result is one of its checks and an approval of the `e2e` deployment names its commit.
#   The Inputs job waits for the commit's Bevy Explorer / CI run and takes the web app it built
#   (an expired one is reported, never replaced), or main's newest when the pull request changed
#   no web input but changed the suite;
# - after each Bevy Explorer / CI run of a push to main;
# - nightly, against main's newest web app;
# - by hand, against a commit's web app or main's newest.
#
# The label is what admits a pull request's code (the suite, the scenes' build, dcl-scene-cli's
# build scripts) to the GPU runner and the accounts: a pull request of this repository runs with
# this repository's secrets. The accounts secret still reaches only the two steps that run the
# scenarios, a pull request's run saves no cache, and the status comment is written by a job that
# holds no secret. Required reviewers on the `e2e` environment, a repository setting, add an
# approval step on top of the label.
#
# They need a Windows runner with a GPU, named by the BEVY_E2E_WINDOWS_RUNNER repository variable
# (explorer-automation's `win-gpu-t4-explorer`; an org admin enables it for this repository), and
# the zone accounts in the `e2e` environment (DCL_E2E_ACCOUNT_KEYS, comma-separated private keys,
# one per worker). Until the variable is set the scenarios job is skipped; the Inputs job's summary
# says what would have run. That image carries MinGit alone, so the job runs its steps in
# PowerShell, puts a pinned git-lfs on PATH before the checkout (the scenes' assets), and drives
# Chrome where the image has it, else a pinned Chrome for Testing build. The scenes' CLI is built on a
# hosted Windows runner and handed over, so the image needs no Rust toolchain, MSVC or bash.
#
# GitHub starts `workflow_run`, `schedule` and `workflow_dispatch` only from the workflow file on
# the default branch: until this file is on main, only the pull request jobs run.
name: Bevy Explorer / E2E
'on':
  # The explorer's inputs (what Bevy Explorer / CI builds the web app from) and the suite's own.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'apps/bevy-explorer/**'
      - 'rendering/bevy-explorer/**'
      - 'library/protocol/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.github/workflows/bevy-explorer-e2e.yml'
      - 'tooling/bevy-e2e-*.py'
      - 'tooling/tests/test_bevy_e2e_*.py'
  workflow_run:
    workflows: ['Bevy Explorer / CI']
    types: [completed]
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: Commit whose suite to run, with the web app its Bevy CI run built, else main's newest (empty = main's newest)
        required: false
        default: ''
      group:
        description: Which scenarios
        type: choice
        options: [both, inworld, visual]
        default: both
      record:
        description: Record the visual references the suite lacks (then commit them from the artifact)
        type: boolean
        default: false
permissions: {}
# One run per pull request (a newer push, or the `ci:e2e` label, supersedes the run in progress;
# any other label's event is its own group and cancels nothing), per branch of one repository and
# CI trigger for a `workflow_run`, and per ref otherwise.
concurrency:
  group: >-
    bevy-explorer-e2e-${{
      github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:e2e') && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'pull_request' && format('run-{0}', github.run_id)
      || github.event_name == 'workflow_run' && format('{0}-{1}-{2}', github.event.workflow_run.event, github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)
      || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true
jobs:
  checks:
    name: Suite checks
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/bevy-explorer/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The trigger also fires for the explorer's paths, for the label: the checks run only when
      # the pull request changes the suite, and pass without them otherwise.
      - name: Does the pull request change the suite
        id: gate
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tooling/bevy-e2e-inputs.py suite-changed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/bevy-explorer/e2e/package-lock.json
      - name: Install the suite
        if: steps.gate.outputs.changed == 'true'
        run: npm ci
      - name: Typecheck
        if: steps.gate.outputs.changed == 'true'
        run: npm run typecheck
      # The driver's tests, with the web transport against a stub page in the runner's Chrome.
      - name: Test the driver
        if: steps.gate.outputs.changed == 'true'
        env:
          DCL_E2E_REQUIRE_CHROME: '1'
        run: npm test
      - name: Test the tooling
        if: steps.gate.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s tooling/tests -p 'test_bevy_*.py'
  inputs:
    name: Inputs
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    # A pull request's job waits for the commit's Bevy Explorer / CI run, which builds the web app.
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
      # write: a push to a labelled pull request takes the label off.
      pull-requests: write
    outputs:
      run: ${{ steps.inputs.outputs.run }}
      sha: ${{ steps.inputs.outputs.sha }}
      web_artifact: ${{ steps.inputs.outputs.web_artifact }}
      web_run_id: ${{ steps.inputs.outputs.web_run_id }}
      pr: ${{ steps.inputs.outputs.pr }}
      reason: ${{ steps.inputs.outputs.reason }}
    steps:
      # A pull request runs its own tooling; every other event runs this file's commit's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.workflow_sha || '' }}
          persist-credentials: false
          sparse-checkout: tooling
      - name: Pick the web app and the commit
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEVY_E2E_CI_WAIT_SECONDS: '5400'
        run: python3 tooling/bevy-e2e-inputs.py
      - name: Say when the scenarios cannot run
        if: steps.inputs.outputs.run == 'true' && vars.BEVY_E2E_WINDOWS_RUNNER == ''
        run: >-
          echo 'The scenarios are skipped: the BEVY_E2E_WINDOWS_RUNNER repository variable names no runner.'
          >> "$GITHUB_STEP_SUMMARY"
  # The scenes' CLI, built where the Rust toolchain, the MSVC linker and bash are: a hosted
  # Windows runner. The GPU image gets the executable. A pull request's run restores the cache
  # and saves none: only a first attempt that built main's head writes it.
  scene-cli:
    name: dcl-scene-cli (Windows)
    needs: inputs
    if: needs.inputs.outputs.run == 'true' && vars.BEVY_E2E_WINDOWS_RUNNER != '' && (github.event.inputs.group || 'both') != 'inworld'
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The workspace's rust-toolchain.toml adds components and wasm targets the CLI never uses:
      # every cargo call takes the minimal toolchain installed below instead.
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inputs.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
      - name: Prepare the pinned native toolchain for caching
        run: python apps/bevy-explorer/prepare-native-cache.py
      # The crate is a member of the services/catalyst workspace: cargo builds and caches under
      # that workspace's target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: services/catalyst -> target
          key: e2e-scene-cli
          save-if: ${{ needs.inputs.outputs.pr == '' && needs.inputs.outputs.sha == github.sha && github.run_attempt == '1' }}
      - name: Build dcl-scene-cli
        working-directory: services/catalyst
        run: cargo build --release --locked -p dcl-scene-cli
      # Kept for a few days, so a re-run of the scenarios job alone still finds it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcl-scene-cli-windows-${{ needs.inputs.outputs.sha }}
          path: services/catalyst/target/release/dcl-scene-cli.exe
          if-no-files-found: error
          retention-days: 3
  scenarios:
    name: Scenarios (Windows GPU)
    needs: [inputs, scene-cli]
    # scene-cli is skipped for the InWorld group alone, and may have failed: the InWorld
    # scenarios run either way, the visual steps only with its executable, and the job fails at
    # its end when the visual group could not run.
    if: ${{ !cancelled() && needs.inputs.outputs.run == 'true' && vars.BEVY_E2E_WINDOWS_RUNNER != '' }}
    runs-on: ${{ vars.BEVY_E2E_WINDOWS_RUNNER }}
    environment: e2e
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: powershell
        working-directory: apps/bevy-explorer/e2e
    env:
      GROUP: ${{ github.event.inputs.group || 'both' }}
      DCL_E2E_WEB_APP: ${{ github.workspace }}/web-app
      DCL_E2E_BASE_DOMAIN: ${{ vars.DCL_E2E_BASE_DOMAIN || 'decentraland.zone' }}
      DCL_E2E_REALM: ${{ vars.DCL_E2E_REALM || 'https://peer.decentraland.zone' }}
      DCL_E2E_WORKER: '0'
      # The app's "Enable GPU acceleration" page asks for the first of these: without them the
      # browser gave WebGPU no adapter. The GPU probe step passes them on as CHROME_EXTRA_ARGS,
      # with the GPU's LUID when the browser starts on the VM's display adapter instead.
      WEBGPU_FLAGS: --enable-unsafe-webgpu --ignore-gpu-blocklist
    steps:
      # The checkout fetches the scenes' assets through git-lfs, which the image's MinGit lacks:
      # the pinned release goes on PATH first, checked against the sum the release signs.
      - name: Put git-lfs on PATH
        working-directory: ${{ runner.temp }}
        env:
          GIT_LFS_VERSION: '3.8.1'
          GIT_LFS_SHA256: 5bb771c12b3dacc535e912d0270a010c209d4da2e63819c5918e3547c2defed9
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $zip = "git-lfs-windows-amd64-v$env:GIT_LFS_VERSION.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/git-lfs/git-lfs/releases/download/v$env:GIT_LFS_VERSION/$zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GIT_LFS_SHA256) { throw "$zip has sha256 $hash, not $env:GIT_LFS_SHA256" }
          Expand-Archive -Path $zip -DestinationPath git-lfs -Force
          $exe = Get-ChildItem -Path git-lfs -Filter git-lfs.exe -Recurse | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName version
      # The suite and the scenes at the commit under test; the scenes' assets are in Git LFS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.inputs.outputs.sha }}
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/bevy-explorer/e2e/package-lock.json
      - name: Download the web app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.inputs.outputs.web_artifact }}
          path: web-app
          run-id: ${{ needs.inputs.outputs.web_run_id }}
          github-token: ${{ github.token }}
      - name: Install the suite
        run: npm ci
      # The web driver looks for Chrome under Google's install paths; an image without one gets
      # the pinned Chrome for Testing build, checked against the sum recorded here (Google
      # publishes none), which CHROME_PATH points the driver at. The image's Edge is not used: it
      # gave WebGPU no adapter.
      - name: Find a browser
        working-directory: ${{ runner.temp }}
        env:
          CHROME_VERSION: '157.0.8103.38'
          CHROME_SHA256: ae0deef27d449e1d7529df7705d609bab102de48464da13567ed3dd2ee1a0586
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installed = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe", "$env:LocalAppData\Google\Chrome\Application\chrome.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($installed) { Write-Output "Chrome: $installed"; exit 0 }
          $zip = 'chrome-win64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri "https://storage.googleapis.com/chrome-for-testing-public/$env:CHROME_VERSION/win64/$zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CHROME_SHA256) { throw "$zip has sha256 $hash, not $env:CHROME_SHA256" }
          Expand-Archive -Path $zip -DestinationPath chrome -Force
          $exe = Join-Path (Get-Location) 'chrome\chrome-win64\chrome.exe'
          if (-not (Test-Path $exe)) { throw "$zip holds no chrome-win64\chrome.exe" }
          Write-Output "Chrome for Testing $env:CHROME_VERSION at $exe"
          Add-Content -Path $env:GITHUB_ENV -Value "CHROME_PATH=$exe"
      # What the scenarios will find, said in seconds rather than after a boot's timeout: the
      # GPU and its driver, whether the job's session is interactive, and the GPU the browser
      # gives a page, bare and then with the scenarios' flags (`npm run gpu-probe`, chrome://gpu
      # into the report). On the VM the browser starts on the paravirtual display adapter and
      # WebGPU finds no hardware there; the probe names the NVIDIA adapter's LUID, and the
      # scenarios start their browser on it. CHROME_EXTRA_ARGS is set here, first thing, so a
      # probe that fails still leaves the scenarios their flags.
      - name: GPU probe
        continue-on-error: true
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CHROME_EXTRA_ARGS=$env:WEBGPU_FLAGS"
          Get-CimInstance Win32_VideoController | ForEach-Object { Write-Output "video controller: $($_.Name) driver=$($_.DriverVersion) status=$($_.Status)" }
          Write-Output "session: interactive=$([Environment]::UserInteractive) id=$((Get-Process -Id $PID).SessionId)"
          $smi = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($smi) { & $smi.Source } else { Write-Output 'nvidia-smi: not on PATH' }
          $env:CHROME_EXTRA_ARGS = ''
          npm run gpu-probe
          $env:CHROME_EXTRA_ARGS = $env:WEBGPU_FLAGS
          $lines = npm run gpu-probe -- --adapter nvidia 2>&1 | ForEach-Object { "$_" }
          $lines
          $luid = ($lines | Select-String -Pattern '^adapter-luid: (\S+)' | Select-Object -First 1)
          if ($luid) {
            $value = $luid.Matches[0].Groups[1].Value
            Add-Content -Path $env:GITHUB_ENV -Value "CHROME_EXTRA_ARGS=$env:WEBGPU_FLAGS --use-adapter-luid=$value"
            Write-Output "the scenarios' browser starts on adapter LUID $value"
          }
      # The accounts secret is on the two scenario steps alone: never in the environment of the
      # install, the builds, or the report.
      - name: InWorld scenarios
        id: inworld
        if: env.GROUP != 'visual'
        continue-on-error: true
        timeout-minutes: 60
        env:
          DCL_E2E_ACCOUNT_KEYS: ${{ secrets.DCL_E2E_ACCOUNT_KEYS }}
        run: npm run e2e -- --inworld
      # The visual scenes are built with the dcl-scene-cli the scene-cli job built, and served
      # from the runner.
      - name: Download dcl-scene-cli
        if: env.GROUP != 'inworld' && needs.scene-cli.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcl-scene-cli-windows-${{ needs.inputs.outputs.sha }}
          path: scene-cli
      - name: Build the visual scenes
        if: env.GROUP != 'inworld' && needs.scene-cli.result == 'success'
        env:
          # A backslash path: build-scenes.ts spawns it through cmd.exe, which reads a `/` as a switch.
          DCL_SCENE_CLI: ${{ github.workspace }}\scene-cli\dcl-scene-cli.exe
        run: npm run build-scenes
      - name: Visual scenarios
        id: visual
        if: env.GROUP != 'inworld' && needs.scene-cli.result == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          DCL_E2E_ACCOUNT_KEYS: ${{ secrets.DCL_E2E_ACCOUNT_KEYS }}
          DCL_E2E_RECORD: ${{ github.event.inputs.record == 'true' && '1' || '' }}
        run: npm run e2e -- --visual
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bevy-explorer-e2e-report-${{ needs.inputs.outputs.sha }}
          path: apps/bevy-explorer/e2e/report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the recorded references
        if: github.event.inputs.record == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bevy-explorer-e2e-references-${{ needs.inputs.outputs.sha }}
          path: apps/bevy-explorer/e2e/references/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Fail when a group failed
        if: steps.inworld.outcome == 'failure' || steps.visual.outcome == 'failure' || (env.GROUP != 'inworld' && needs.scene-cli.result != 'success')
        run: |
          Write-Output "InWorld: ${{ steps.inworld.outcome }}; Visual: ${{ steps.visual.outcome }}; dcl-scene-cli build: ${{ needs.scene-cli.result }}"
          exit 1
  # The pull request's status comment, from the report the scenarios uploaded. This job holds no
  # secret; the report is data to it (the JUnit files `node --test` wrote).
  comment:
    name: Status comment
    needs: [inputs, scenarios]
    if: always() && needs.inputs.outputs.run == 'true' && needs.inputs.outputs.pr != '' && needs.scenarios.result != 'skipped'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GROUP: ${{ github.event.inputs.group || 'both' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name != 'pull_request' && github.workflow_sha || '' }}
          persist-credentials: false
          sparse-checkout: |
            tooling
            .github/actions/bevy-explorer-ci-status
          sparse-checkout-cone-mode: false
      # A run that wrote no report uploaded nothing: the sections then say so.
      - name: Download the report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bevy-explorer-e2e-report-${{ needs.inputs.outputs.sha }}
          path: report
      - name: Write the InWorld section
        if: env.GROUP != 'visual'
        run: python3 tooling/bevy-e2e-report.py report/junit-inworld.xml "$RUN_URL" InWorld > inworld.md
      - uses: ./.github/actions/bevy-explorer-ci-status
        if: env.GROUP != 'visual'
        with:
          pr-number: ${{ needs.inputs.outputs.pr }}
          section: inworld
          github-token: ${{ github.token }}
          body-file: inworld.md
      - name: Write the Visual section
        if: env.GROUP != 'inworld'
        run: python3 tooling/bevy-e2e-report.py report/junit-visual.xml "$RUN_URL" Visual > visual.md
      - uses: ./.github/actions/bevy-explorer-ci-status
        if: env.GROUP != 'inworld'
        with:
          pr-number: ${{ needs.inputs.outputs.pr }}
          section: automation
          github-token: ${{ github.token }}
          body-file: visual.md
