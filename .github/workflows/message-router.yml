name: Message router LiveKit tests
# The community chat message router (services/catalyst/message-router) with its `livekit`
# feature: clippy over every target, then its tests, the end-to-end one against a real
# livekit-server and PostgreSQL. A workflow of its own, filtered to the router's paths, because
# the feature links libwebrtc, which no other Rust job builds (the Development workflow tests the
# crate without it).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/catalyst/message-router/**'
      - 'services/catalyst/shared/src/message_router.rs'
      - 'services/catalyst/shared/src/signed_request.rs'
      - 'services/catalyst/shared/src/limits.rs'
      - 'services/catalyst/Cargo.*'
      - 'services/catalyst/rust-toolchain.toml'
      - 'rendering/bevy-explorer/patches/client-sdk-rust/**'
      - 'infra/packages/bevy-explorer-native.nix'
      - 'flake.*'
      - '.github/workflows/message-router.yml'
  pull_request:
    paths:
      - 'services/catalyst/message-router/**'
      - 'services/catalyst/shared/src/message_router.rs'
      - 'services/catalyst/shared/src/signed_request.rs'
      - 'services/catalyst/shared/src/limits.rs'
      - 'services/catalyst/Cargo.*'
      - 'services/catalyst/rust-toolchain.toml'
      - 'rendering/bevy-explorer/patches/client-sdk-rust/**'
      - 'infra/packages/bevy-explorer-native.nix'
      - 'flake.*'
      - '.github/workflows/message-router.yml'
permissions:
  contents: read
concurrency:
  group: message-router-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  livekit:
    name: Message router with LiveKit
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    timeout-minutes: 100
    services:
      # A disposable cluster for the scratch databases the tests create.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: router-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # Keep this single-crate build out of the full foundation target/cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/services/catalyst/target-message-router
      CATALYST_TEST_DATABASE_URL: postgres://postgres:router-ci@127.0.0.1:5432/postgres
    steps:
      - name: Reserve disk space for the builds
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          # libwebrtc, the Nix store and the Rust build can fill the disk of a hosted runner.
          # The delete takes time, so it runs only when 25 GB or less is free.
          avail=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)
          if [ "${avail:-0}" -le 25 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          fi
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-
          save: false
          gc-max-store-size: 0
      # The native Explorer's shell: the toolchain and the libraries libwebrtc's build reads
      # (glib, libdrm, gbm, X11; infra/packages/bevy-explorer-native.nix).
      - name: Root the shell and the flake inputs
        run: |
          mkdir -p .cache/nix-roots
          nix develop .#explorer --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Build livekit-server
        run: |
          nix build --inputs-from . nixpkgs#livekit -o .cache/livekit
          echo "MESSAGE_ROUTER_LIVEKIT_SERVER_BIN=$PWD/.cache/livekit/bin/livekit-server" >> "$GITHUB_ENV"
      - name: Put the Nix Rust toolchain on PATH for the cache action
        run: |
          toolchain=$(dirname "$(nix develop .#explorer --no-update-lock-file --command bash -c 'command -v cargo')")
          test -x "$toolchain/rustc"
          echo "$toolchain" >> "$GITHUB_PATH"
      - name: Restore the Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # Only the Nix rustc enters the key; see development.yml.
          RUSTUP_HOME: /dev/null
        with:
          workspaces: services/catalyst -> target-message-router
          shared-key: message-router-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          cache-on-failure: true
      - name: Clippy with the livekit feature
        run: |
          nix develop .#explorer --no-update-lock-file --command \
            cargo clippy --manifest-path services/catalyst/Cargo.toml --locked \
            -p catalyst-message-router --features livekit --all-targets -- -D warnings
      - name: Test with the livekit feature against livekit-server and PostgreSQL
        # CI=true: the end-to-end test fails instead of skipping without livekit-server or the
        # database.
        run: |
          nix develop .#explorer --no-update-lock-file --command \
            cargo test --manifest-path services/catalyst/Cargo.toml --locked \
            -p catalyst-message-router --features livekit -- --nocapture
