name: UI review preview

# Publishes a pull request's runtime component gallery (library/ui/gallery) to the SDK bucket, beside the Creator Hub
# previews, and keeps one comment on the pull request that links it, so a reviewer opens it with one click.
#
# The build job runs the pull request's code and holds no credential. The publish job holds the bucket role and runs
# no pull request code: it only syncs the build artifact. The Figma reference stays out of the hosted build: it ships
# only in ui-library.yml's Review artifact, which the privileged key scan checks. ui-library.yml itself holds no
# secret. Fork pull requests, and a repository without the bucket configured, publish nothing.
on:
  pull_request:
    paths:
      - 'library/ui/**'
      - '.github/workflows/ui-review-preview.yml'

permissions: {}

concurrency:
  group: ui-review-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.RUNNER_LINUX_X86 || 'ubuntu-26.04' }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: library/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          lfs: false
      # The foundation fonts the gallery bundles; nothing else of the monorepo's LFS objects.
      - run: git lfs pull --include "library/ui/foundations/typography/fonts/*.woff2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build --config gallery/vite.config.ts --mode hosted
      # Served the way the bucket serves it: index.html under a nested prefix, with no Figma reference.
      - run: node gallery/scripts/check-build.mjs gallery/dist --hosted --prefix /ui-review/branch/preview/
      - name: Scan the hosted build for Figma urls
        run: node figma/key-guard.mjs --no-worktree --no-range --path library/ui/gallery/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-gallery-preview-${{ github.event.pull_request.head.sha }}
          path: library/ui/gallery/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    env:
      CAN_UPLOAD: ${{ secrets.SDK_TEAM_S3_BUCKET != '' && vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN != '' }}
    outputs:
      path: ${{ steps.upload.outputs.path }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CAN_UPLOAD == 'true'
        with:
          name: ui-gallery-preview-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ui-gallery
      # The Creator Hub previews' branch folder: slashes become dashes; any other character a URL path would need to
      # escape becomes a dash too.
      - name: Sanitize the branch
        id: branch
        if: env.CAN_UPLOAD == 'true'
        run: |
          branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          safe_branch=${branch//\//-}
          safe_branch=$(printf '%s' "$safe_branch" | LC_ALL=C sed 's/[^A-Za-z0-9._-]/-/g')
          [ -n "$safe_branch" ] || { echo "The branch name is empty" >&2; exit 1; }
          echo "safe_branch=$safe_branch" >> "$GITHUB_OUTPUT"
      - name: AWS role for the SDK bucket
        if: env.CAN_UPLOAD == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CREATOR_HUB_SDK_BUCKET_ROLE_ARN }}
          aws-region: ${{ secrets.SDK_TEAM_AWS_REGION }}
      - name: Upload the preview
        id: upload
        if: env.CAN_UPLOAD == 'true'
        env:
          BUCKET: ${{ secrets.SDK_TEAM_S3_BUCKET }}
          SAFE_BRANCH: ${{ steps.branch.outputs.safe_branch }}
          SOURCE: ${{ runner.temp }}/ui-gallery
        run: |
          prefix="ui-review/branch/${SAFE_BRANCH}"
          aws s3 sync "$SOURCE" "s3://${BUCKET}/${prefix}/" --delete \
            --acl public-read --cache-control 'max-age=0,private'
          # The bucket's base URL is a secret, and an output that contains one is dropped, so the comment joins it to
          # this path.
          echo "path=${prefix}/index.html" >> "$GITHUB_OUTPUT"

  # The one writer of the pull request's UI review comment, found by its marker and edited on every push. It runs no
  # pull request code; every value reaches the script through env.
  comment:
    needs: publish
    if: needs.publish.outputs.path != ''
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Post or update the UI review comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_URL: ${{ secrets.SDK_TEAM_S3_BASE_URL }}
          PREVIEW_PATH: ${{ needs.publish.outputs.path }}
        run: |
          set -euo pipefail
          [ -n "$BASE_URL" ] || { echo "SDK_TEAM_S3_BASE_URL is not set" >&2; exit 1; }
          gallery="${BASE_URL%/}/${PREVIEW_PATH}"
          # The Review artifact, which also has the Figma reference, comes from this commit's Shared UI library run.
          run_url=$(gh api "repos/$REPOSITORY/actions/workflows/ui-library.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
            --jq '.workflow_runs[0].html_url // empty')
          [ -n "$run_url" ] || run_url="$SERVER_URL/$REPOSITORY/pull/$PR_NUMBER/checks"
          marker='<!-- ui-review-artifact -->'
          body=$(printf '%s\n' \
            "$marker" \
            "**[Open the UI gallery]($gallery)** for ${HEAD_SHA:0:7}." \
            "<sub>Full build, which also has the Figma reference: the \`ui-review-$HEAD_SHA\` artifact of [the Shared UI library run]($run_url).</sub>")
          id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- ui-review-artifact -->"))) | .id' | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
