name: Social voice release proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'schemas/**'
      - 'services/catalyst/db/**'
      - 'services/catalyst/tests/fixtures/schema/**'
      - 'services/catalyst/Cargo.*'
      - 'services/catalyst/rust-toolchain.toml'
      - 'library/vendor/**'
      - '.cargo/**'
      - 'flake.*'
      - 'infra/dev/shell-hook.sh'
      - 'infra/packages/**'
      - 'tooling/social-voice-release-test.sh'
      - 'tooling/tests/test_social_voice_release_ci.py'
      - '.github/workflows/social-voice-release.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'services/catalyst/db/**'
      - 'services/catalyst/tests/fixtures/schema/**'
      - 'services/catalyst/Cargo.*'
      - 'services/catalyst/rust-toolchain.toml'
      - 'library/vendor/**'
      - '.cargo/**'
      - 'flake.*'
      - 'infra/dev/shell-hook.sh'
      - 'infra/packages/**'
      - 'tooling/social-voice-release-test.sh'
      - 'tooling/tests/test_social_voice_release_ci.py'
      - '.github/workflows/social-voice-release.yml'
permissions:
  contents: read
jobs:
  social-voice-release:
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # Keep this single-suite build out of the full foundation target/cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/services/catalyst/target-social-voice-release
      RUST_TEST_THREADS: '2'
    steps:
      - name: Reserve disk space for the Rust test build
        if: runner.os == 'Linux'
        run: |
          # Leave room for the Nix store and expanded Rust cache on hosted runners.
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-${{ hashFiles('flake.nix', 'flake.lock', 'services/catalyst/rust-toolchain.toml', 'infra/dev/**', 'infra/packages/**') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-${{ runner.arch }}-ci-
          save: ${{ github.ref == 'refs/heads/main' && github.run_attempt == '1' }}
          gc-max-store-size: 0
      - name: Root the shell and the flake inputs
        run: |
          nix develop .#ci --profile .cache/nix-roots/env --command true
          nix-store --add-root .cache/nix-roots/input -r $(nix flake archive --json | jq -r '.inputs | .. | .path? // empty') > /dev/null
      - name: Test disposable release-proof database setup and cleanup
        run: nix develop .#ci --no-update-lock-file --command python3 -m unittest discover -s tooling/tests -p test_social_voice_release_ci.py -v
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: social-voice-release-nodebug-v2-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-${{ hashFiles('services/catalyst/Cargo.lock') }}
          restore-keys: |
            social-voice-release-nodebug-v2-${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'services/catalyst/rust-toolchain.toml') }}-
      - name: Run the release suite against owned PostgreSQL 18.6
        run: nix develop .#ci --no-update-lock-file --command bash tooling/social-voice-release-test.sh
      - name: Save Rust build cache from main
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
