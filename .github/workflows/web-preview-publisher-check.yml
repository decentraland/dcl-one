name: Web preview publisher / Validate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/web-previews-publish.yml'
      - '.github/workflows/web-preview-publisher-check.yml'
      - 'tooling/web-preview.py'
      - 'tooling/tests/test_web_preview.py'
      - 'library/ui/figma/key-guard.mjs'
      - 'library/ui/figma/key-guard-allow.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the dependency-free trusted scanner
        run: node --check library/ui/figma/key-guard.mjs
      - name: Check publication policy and artifact handling
        run: python3 -m unittest discover -s tooling/tests -p test_web_preview.py -v
