name: SDK / PR preview
# Publishes the tarballs a pull request's SDK / CI run built, under the shared pr dist-tag.
# pull_request_target runs main's copy of this file as a main run, so it passes the npm-release
# environment (main only) and a pull request cannot change what is published or how. It never checks
# out or runs the pull request's code. Fork pull requests publish nothing.
on:
  pull_request_target:
    paths:
      - library/js-sdk-toolchain/**
      - library/protocol/**
      - .github/workflows/sdk.yml
permissions: {}
concurrency:
  group: sdk-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  SDK_PACKAGES: ecs js-runtime react-ecs sdk-commands sdk
jobs:
  publish:
    name: Publish the PR preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: npm-release
    permissions:
      actions: read
      pull-requests: write
      id-token: write # npm OIDC trusted publishing — no token secret
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org
      - name: Wait for the SDK / CI run of this commit
        id: build
        run: |
          set -euo pipefail
          # the pull_request run of sdk.yml for this head commit, from a branch of this repository
          query=".workflow_runs | map(select(.path == \".github/workflows/sdk.yml\" and .head_repository.full_name == \"$GH_REPO\")) | sort_by(.run_number) | last | select(. != null) | \"\(.id) \(.status) \(.conclusion)\""
          for _ in $(seq 1 160); do
            read -r id status conclusion <<< "$(gh api "repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" --jq "$query" || true)"
            # the run stays in progress while its own jobs finish, so look at the job that packs
            if [ -n "${id:-}" ]; then
              packed=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "Build, test, pack") | .conclusion // ""' || true)
              if [ "$packed" = success ]; then echo "run=$id" >> "$GITHUB_OUTPUT"; exit 0; fi
              if [ -n "$packed" ] || [ "$status" = completed ]; then
                echo "SDK / CI run $id did not pack the packages ($packed $conclusion); nothing to publish" >&2
                exit 1
              fi
            fi
            sleep 30
          done
          echo "no finished SDK / CI run for $HEAD_SHA" >&2
          exit 1
      - name: Download its tarballs
        env:
          RUN: ${{ steps.build.outputs.run }}
        run: |
          set -euo pipefail
          gh run download "$RUN" --pattern 'sdk-packages-*' --dir downloaded
          mkdir dist && mv downloaded/*/*.tgz dist/
      - name: Publish in dependency order
        id: publish
        run: |
          set -euo pipefail
          manifest() { tar -xOf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version'; }
          first=$(manifest ./dist/*-js-runtime-[0-9]*.tgz)
          scope=${first%%/*}; version=${first##*@}
          # the tarballs come from the pull request: only a snapshot version of the SDK's packages goes out
          if ! [[ "$scope" =~ ^@[a-z0-9-]+$ && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.commit-[0-9a-f]+$ ]]; then
            echo "not an SDK snapshot: $first" >&2
            exit 1
          fi
          for name in $SDK_PACKAGES; do
            tgz=./dist/${scope#@}-$name-$version.tgz
            if [ "$(manifest "$tgz")" != "$scope/$name@$version" ]; then
              echo "$tgz is not $scope/$name@$version" >&2
              exit 1
            fi
          done
          for name in $SDK_PACKAGES; do
            if npm view "$scope/$name@$version" version > /dev/null 2>&1; then
              echo "$scope/$name@$version is already on npm; skipping"
            else
              # ./ keeps npm from reading dist/<file> as a GitHub owner/repo shorthand
              npm publish "./dist/${scope#@}-$name-$version.tgz" --access public --tag pr
            fi
          done
          {
            echo "scope=$scope"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Comment the install command on the PR
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          SCOPE: ${{ steps.publish.outputs.scope }}
        run: |
          set -euo pipefail
          marker='<!-- sdk-preview -->'
          fence="\`\`\`"
          # another scope installs through npm aliases, so scenes keep importing @dcl/sdk
          if [ "$SCOPE" = "@dcl" ]; then spec=$VERSION; else spec="npm:$SCOPE/sdk@$VERSION"; fi
          cli_spec=${spec/\/sdk@/\/sdk-commands@}
          body=$(printf '%s\n## Test this pull request\n\nSDK packages for %s:\n\n%s\nnpm install @dcl/sdk@%s @dcl/sdk-commands@%s\n%s\n\nThe pr dist-tag points at the last PR preview published, so prefer the exact version.\n' "$marker" "$HEAD_SHA" "$fence" "$spec" "$cli_spec" "$fence")
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
