name: Repository structure
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate the ownership catalogue
        run: python3 tooling/owners.py --check
      - name: Validate the single proto source
        run: python3 tooling/proto-source-check.py
      - name: Validate backend module layers
        run: bash services/catalyst/scripts/check-module-dag.sh
      - name: Check UI standards
        if: success() || failure()
        env:
          UI_STANDARDS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s tooling/tests -p test_ui_standards.py
          python3 tooling/ui_standards.py --base "$UI_STANDARDS_BASE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: 24
      # No install: the tests import nothing outside Node, this tool and apps/ui3's endpoint map.
      - name: Test the shop parity harness
        if: success() || failure()
        working-directory: tooling/shop-parity
        run: node --test lib/*.test.mts
  # Advisory until its default-branch run history supports required-check promotion.
  social-service-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Standard-library checks only: no upstream checkout, packages, services or secrets.
      - name: Validate the social-service inventory and pinned schemas
        run: python3 tooling/social-service-parity.py
      - name: Test the social-service inventory rejection cases
        if: success() || failure()
        run: python3 -m unittest discover -s tooling/tests -p test_social_service_parity.py -v
      - name: Validate the social-service metric inventory
        if: success() || failure()
        run: python3 tooling/social-service-metrics.py
