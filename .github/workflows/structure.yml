name: Repository structure
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: |
          set -euo pipefail
          ripgrep_version=15.1.0
          ripgrep_archive="ripgrep-${ripgrep_version}-x86_64-unknown-linux-musl"
          ripgrep_dir="$RUNNER_TEMP/ripgrep-${ripgrep_version}"
          mkdir -p "$ripgrep_dir"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            --output "$ripgrep_dir/ripgrep.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${ripgrep_version}/${ripgrep_archive}.tar.gz"
          printf '%s  %s\n' \
            '1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599' \
            "$ripgrep_dir/ripgrep.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$ripgrep_dir/ripgrep.tar.gz" \
            --directory "$ripgrep_dir" --strip-components=1 "$ripgrep_archive/rg"
          "$ripgrep_dir/rg" --version
          printf '%s\n' "$ripgrep_dir" >> "$GITHUB_PATH"
      - name: Validate the ownership catalogue
        run: python3 tooling/owners.py --check
      - name: Validate the single proto source
        run: python3 tooling/proto-source-check.py
      - name: Validate backend module layers
        run: bash services/catalyst/scripts/check-module-dag.sh
      - name: Check the workflows against the actions policy
        if: success() || failure()
        run: python3 -m unittest tooling.tests.test_dev_workflow -k policy_allowlist
      - name: Check UI standards
        if: success() || failure()
        env:
          UI_STANDARDS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s tooling/tests -p test_ui_standards.py
          python3 tooling/ui_standards.py --base "$UI_STANDARDS_BASE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: success() || failure()
        with:
          node-version: 24
      - name: Test shared asynchronous utilities
        if: success() || failure()
        run: node --test library/async/*.test.mts
      - name: Test the shop parity harness
        if: success() || failure()
        working-directory: tooling/shop-parity
        run: node --test lib/*.test.mts
      - name: Test shop parity readiness and wallet fixtures
        if: success() || failure()
        working-directory: tooling/shop-parity
        run: |
          npx --yes pnpm@11.27.0 install --frozen-lockfile --ignore-scripts
          node --test test/*.test.mts
      - name: Test shop trade journey helpers
        if: success() || failure()
        working-directory: tooling/shop-trade-journey
        run: |
          npx --yes pnpm@11.27.0 install --frozen-lockfile --ignore-scripts
          node --test lib/*.test.mts
  # Advisory until its default-branch run history supports required-check promotion.
  social-service-contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Standard-library checks only: no upstream checkout, packages, services or secrets.
      - name: Validate the social-service inventory and pinned schemas
        run: python3 tooling/social-service-parity.py
      - name: Test the social-service inventory rejection cases
        if: success() || failure()
        run: python3 -m unittest discover -s tooling/tests -p test_social_service_parity.py -v
      - name: Validate the social-service metric inventory
        if: success() || failure()
        run: python3 tooling/social-service-metrics.py
