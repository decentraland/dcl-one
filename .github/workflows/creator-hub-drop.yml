name: Drop pre-release
on:
  workflow_call:
    inputs:
      dry-run:
        description: 'Compiles the app but not upload artifacts to distribution server'
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: creator-hub-drop-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: 'bash'
    working-directory: apps/creator-hub
jobs:
  drop:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run && 'creator-hub-release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          filter: blob:none

      # The installers' pre-releases live in decentraland/creator-hub (release-only), so the
      # bare X.Y.Z pattern can't reach another project's releases here.
      - name: Delete prereleases
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run }}
        uses: ./.github/actions/creator-hub-delete-prereleases
        with:
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          dry_run: 'false'
          repository: decentraland/creator-hub
          github_token: ${{ secrets.CREATOR_HUB_RELEASES_TOKEN }}
