name: Set up pnpm
description: >-
  Put pnpm on PATH from the release asset for this runner's OS and architecture, sha256-checked
  against digests.txt, before actions/setup-node so `cache: pnpm` finds it.
# Not Corepack: Node 25+ tarballs ship without it (nodejs/node#57617) and GitHub's Ubuntu images
# ship Node, npm and yarn but no pnpm; not npm/npx (pnpm is the package manager here); not
# pnpm/action-setup (outside tooling/repo-actions-policy.sh).
# A version bump edits PNPM_VERSION in both steps and digests.txt together.
runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      env:
        PNPM_VERSION: 12.21.0
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=pnpm-linux-x64.tar.gz ;;
          Linux/ARM64) asset=pnpm-linux-arm64.tar.gz ;;
          macOS/X64) asset=pnpm-darwin-x64.tar.gz ;;
          macOS/ARM64) asset=pnpm-darwin-arm64.tar.gz ;;
          *) echo "::error::no pnpm release asset for $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/pnpm"
        mkdir -p "$dir"
        curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 -o "$dir/$asset" \
          "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${asset}"
        grep " ${asset}\$" "$GITHUB_ACTION_PATH/digests.txt" > "$dir/SHA256SUMS" \
          || { echo "::error::digests.txt has no entry for $asset" >&2; exit 1; }
        if command -v sha256sum >/dev/null 2>&1; then (cd "$dir" && sha256sum --check --strict SHA256SUMS)
        else (cd "$dir" && shasum -a 256 --check SHA256SUMS); fi
        # Every tar.gz holds the executable pnpm at its root beside dist/.
        tar -xzf "$dir/$asset" -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/pnpm" --version
    - if: runner.os == 'Windows'
      # powershell, not pwsh: Windows PowerShell 5.1 is on every Windows runner, self-hosted included.
      shell: powershell
      env:
        PNPM_VERSION: 12.21.0
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        switch ($env:RUNNER_ARCH) {
          'X64' { $asset = 'pnpm-win32-x64.zip' }
          'ARM64' { $asset = 'pnpm-win32-arm64.zip' }
          default { Write-Host "::error::no pnpm release asset for Windows/$env:RUNNER_ARCH"; exit 1 }
        }
        $dir = Join-Path $env:RUNNER_TEMP 'pnpm'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $archive = Join-Path $dir $asset
        Invoke-WebRequest -Uri "https://github.com/pnpm/pnpm/releases/download/v$env:PNPM_VERSION/$asset" -OutFile $archive
        $expected = $null
        foreach ($line in Get-Content (Join-Path $env:GITHUB_ACTION_PATH 'digests.txt')) {
          if ($line -match ('^([0-9a-f]{64})\s+' + [regex]::Escape($asset) + '$')) { $expected = $Matches[1] }
        }
        if (-not $expected) { Write-Host "::error::digests.txt has no entry for $asset"; exit 1 }
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
        if ($actual -ne $expected) { Write-Host "::error::$asset sha256 is $actual, pinned $expected"; exit 1 }
        # Every zip holds pnpm.exe at its root beside dist/.
        Expand-Archive -Path $archive -DestinationPath $dir -Force
        if (-not (Test-Path (Join-Path $dir 'pnpm.exe'))) { Write-Host "::error::no pnpm.exe at the archive root"; exit 1 }
        Add-Content -Path $env:GITHUB_PATH -Value $dir
        & (Join-Path $dir 'pnpm.exe') --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
