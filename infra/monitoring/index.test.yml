rule_files: [index.rules.yml]
evaluation_interval: 1m
tests:
  - name: lagging and stalled cursors, quarantine and old NFT publication
    interval: 1m
    input_series:
      - series: 'up{job="catalyst-index",instance="worker"}'
        values: '1x20'
      - series: 'catalyst_index_sample_timestamp_seconds{job="catalyst-index",instance="worker"}'
        values: '0+60x20'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",instance="worker",source="nft",network="matic"}'
        values: '214x20'
      - series: 'catalyst_index_source_observed{job="catalyst-index",instance="worker",source="nft",network="matic"}'
        values: '1x20'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",instance="worker",source="nft",network="matic"}'
        values: '400x7 NaN 400x8 NaN 400 64 64'
      - series: 'catalyst_index_last_block{job="catalyst-index",instance="worker",source="nft",network="matic"}'
        values: '100x18 900 901'
      - series: 'catalyst_index_fold_age_seconds{job="catalyst-index",instance="worker",source="nft",network="matic"}'
        values: '7200+60x18 0 60'
      - series: 'catalyst_index_quarantined{job="catalyst-index",instance="worker",source="rentals",network="ethereum"}'
        values: '1x18 0 0'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",instance="worker",source="land_authz",network="ethereum-mainnet"}'
        values: '37x20'
      - series: 'catalyst_index_source_observed{job="catalyst-index",instance="worker",source="land_authz",network="ethereum-mainnet"}'
        values: '1x20'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",instance="worker",source="land_authz",network="ethereum-mainnet"}'
        values: '80x18 12 12'
      - series: 'catalyst_index_last_block{job="catalyst-index",instance="worker",source="land_authz",network="ethereum-mainnet"}'
        values: '0+1x20'
    promql_expr_test:
      - expr: 'sum by (alertname, source, team) (ALERTS{alertstate="firing"})'
        eval_time: 18m
        exp_samples:
          - {labels: '{alertname="CatalystIndexLagging",source="land_authz",team="operators"}', value: 1}
          - {labels: '{alertname="CatalystIndexLagging",source="nft",team="operators"}', value: 1}
          - {labels: '{alertname="CatalystIndexStalled",source="nft",team="operators"}', value: 1}
          - {labels: '{alertname="CatalystIndexPublicationStale",source="nft",team="operators"}', value: 1}
          - {labels: '{alertname="CatalystIndexQuarantined",source="rentals",team="operators"}', value: 1}
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 20m
        exp_samples: []

  - name: missing heads, collector failure, missing rows and stationary mirror pages
    interval: 1m
    input_series:
      - series: 'up{job="catalyst-index",instance="worker"}'
        values: '1x20'
      - series: 'catalyst_index_sample_timestamp_seconds{job="catalyst-index",instance="worker"}'
        values: '0x20'
      - series: 'catalyst_index_source_observed{job="catalyst-index",instance="worker",source="sales",network="matic"}'
        values: '0x20'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",instance="worker",source="sales",network="matic"}'
        values: '214x20'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",instance="worker",source="sales",network="matic"}'
        values: 'NaN+0x20'
      - series: 'catalyst_index_mirror_age_limit_seconds{job="catalyst-index",instance="worker",source="items",network="matic"}'
        values: '600x20'
      - series: 'catalyst_index_source_observed{job="catalyst-index",instance="worker",source="items",network="matic"}'
        values: '1x20'
      - series: 'catalyst_index_mirror_age_seconds{job="catalyst-index",instance="worker",source="items",network="matic"}'
        values: '800+60x20'
      - series: 'catalyst_index_mirror_pages{job="catalyst-index",instance="worker",source="items",network="matic"}'
        values: '7x20'
      - series: 'catalyst_index_mirror_age_limit_seconds{job="catalyst-index",instance="worker",source="collections",network="matic"}'
        values: '1800x20'
    promql_expr_test:
      - expr: 'sum by (alertname,source) (ALERTS{alertstate="firing"})'
        eval_time: 20m
        exp_samples:
          - {labels: '{alertname="CatalystIndexSourceMetricsMissing",source="sales"}', value: 1}
          - {labels: '{alertname="CatalystIndexSourceMetricsMissing",source="collections"}', value: 1}
          - {labels: '{alertname="CatalystIndexMetricsMissing"}', value: 1}
          - {labels: '{alertname="CatalystIndexMirrorLagging",source="items"}', value: 1}
          - {labels: '{alertname="CatalystIndexMirrorStalled",source="items"}', value: 1}

  - name: missing scrape target
    promql_expr_test:
      - expr: 'sum by (alertname,team) (ALERTS{alertstate="firing"})'
        eval_time: 5m
        exp_samples:
          - {labels: '{alertname="CatalystIndexMetricsMissing",team="operators"}', value: 1}

  - name: publication withdrawal, partial walk, missing RPC and recovery
    interval: 1m
    input_series:
      - series: 'up{job="catalyst-index",instance="worker"}'
        values: '1x45'
      - series: 'catalyst_index_sample_timestamp_seconds{job="catalyst-index",instance="worker"}'
        values: '0+60x45'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",source="nft",network="ethereum"}'
        values: '37x45'
      - series: 'catalyst_index_publication_expected{job="catalyst-index",source="nft",network="ethereum"}'
        values: '1x45'
      - series: 'catalyst_index_source_observed{job="catalyst-index",source="nft",network="ethereum"}'
        values: '1x45'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",source="nft",network="ethereum"}'
        values: '12x8 NaN 12x8 NaN 12x8 NaN 12x8 NaN 12x5'
      - series: 'catalyst_index_last_block{job="catalyst-index",source="nft",network="ethereum"}'
        values: '500+5x45'
      - series: 'catalyst_index_folded_block{job="catalyst-index",source="nft",network="ethereum"}'
        values: '500x4 NaN+0x35 700+5x5'
      - series: 'catalyst_index_fold_age_seconds{job="catalyst-index",source="nft",network="ethereum"}'
        values: '0+60x4 NaN+0x35 0x5'
      - series: 'catalyst_index_publication_expected{job="catalyst-index",source="trade_events",network="matic"}'
        values: '0x45'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",source="trade_events",network="matic"}'
        values: '214x45'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",source="trade_events",network="matic"}'
        values: '64x45'
      - series: 'catalyst_index_source_observed{job="catalyst-index",source="trade_events",network="matic"}'
        values: '1x45'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",source="sales",network="matic"}'
        values: '214x45'
      - series: 'catalyst_index_source_observed{job="catalyst-index",source="sales",network="matic"}'
        values: '0x45'
      - series: 'catalyst_index_publication_expected{job="catalyst-index",source="sales",network="matic"}'
        values: '1x45'
    promql_expr_test:
      - expr: 'sum by (source) (ALERTS{alertname="CatalystIndexUnpublished",alertstate="firing"})'
        eval_time: 34m
        exp_samples: []
      - expr: 'sum by (alertname,source) (ALERTS{alertstate="firing"})'
        eval_time: 37m
        exp_samples:
          - {labels: '{alertname="CatalystIndexUnpublished",source="nft"}', value: 1}
          - {labels: '{alertname="CatalystIndexSourceMetricsMissing",source="sales"}', value: 1}
      - expr: 'sum by (source) (ALERTS{alertname="CatalystIndexUnpublished",alertstate="firing"})'
        eval_time: 42m
        exp_samples: []

  - name: expected targets can fail a scrape or disappear while a peer is up
    interval: 1m
    input_series:
      - series: 'up{job="catalyst-index",instance="healthy"}'
        values: '1x10'
      - series: 'catalyst_index_sample_timestamp_seconds{job="catalyst-index",instance="healthy"}'
        values: '0+60x10'
      - series: 'up{job="catalyst-index",instance="down"}'
        values: '0x10'
      - series: 'catalyst_index_target_expected{job="catalyst-index",instance="removed"}'
        values: '1x10'
    promql_expr_test:
      - expr: 'sum by (instance) (ALERTS{alertname="CatalystIndexMetricsMissing",alertstate="firing"})'
        eval_time: 5m
        exp_samples:
          - {labels: '{instance="down"}', value: 1}
          - {labels: '{instance="removed"}', value: 1}

  - name: stopped and quarantined cursors, and a stale mirror making progress
    interval: 1m
    input_series:
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",source="nft",network="matic"}'
        values: '214x20'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",source="nft",network="matic"}'
        values: '300x20'
      - series: 'catalyst_index_held_at_stop{job="catalyst-index",source="nft",network="matic"}'
        values: '1x20'
      - series: 'catalyst_index_last_block{job="catalyst-index",source="nft",network="matic"}'
        values: '80x20'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",source="rentals",network="ethereum"}'
        values: '37x20'
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",source="rentals",network="ethereum"}'
        values: '300x20'
      - series: 'catalyst_index_quarantined{job="catalyst-index",source="rentals",network="ethereum"}'
        values: '1x20'
      - series: 'catalyst_index_last_block{job="catalyst-index",source="rentals",network="ethereum"}'
        values: '80x20'
      - series: 'catalyst_index_mirror_age_limit_seconds{job="catalyst-index",source="items",network="matic"}'
        values: '600x20'
      - series: 'catalyst_index_source_observed{job="catalyst-index",source="items",network="matic"}'
        values: '1x20'
      - series: 'catalyst_index_mirror_age_seconds{job="catalyst-index",source="items",network="matic"}'
        values: '900+60x20'
      - series: 'catalyst_index_mirror_pages{job="catalyst-index",source="items",network="matic"}'
        values: '1+1x20'
    promql_expr_test:
      - expr: 'sum by (alertname) (ALERTS{alertname=~"CatalystIndex(Lagging|Stalled|Quarantined|Mirror.*)",alertstate="firing"})'
        eval_time: 20m
        exp_samples:
          - {labels: '{alertname="CatalystIndexQuarantined"}', value: 1}
          - {labels: '{alertname="CatalystIndexMirrorLagging"}', value: 1}

  - name: a new lag replaces the previous observation and a prolonged outage expires it
    interval: 1m
    input_series:
      - series: 'catalyst_index_lag_blocks{job="catalyst-index",source="nft",network="ethereum"}'
        values: '12x30 NaN 300 12 NaN+0x10'
      - series: 'catalyst_index_lag_limit_blocks{job="catalyst-index",source="nft",network="ethereum"}'
        values: '37x45'
      - series: 'catalyst_index_publication_expected{job="catalyst-index",source="nft",network="ethereum"}'
        values: '1x45'
    promql_expr_test:
      - expr: 'sum(ALERTS{alertname="CatalystIndexUnpublished",alertstate="firing"})'
        eval_time: 31m
        exp_samples: [{labels: '{}', value: 1}]
      - expr: 'ALERTS{alertname="CatalystIndexUnpublished"}'
        eval_time: 32m
        exp_samples: []
      - expr: 'sum(catalyst_index:behind_head_blocks)'
        eval_time: 32m
        exp_samples: [{labels: '{}', value: 300}]
      - expr: 'sum(catalyst_index:last_valid_lag_blocks)'
        eval_time: 36m
        exp_samples: [{labels: '{}', value: 12}]
      - expr: 'catalyst_index:last_valid_lag_blocks'
        eval_time: 38m
        exp_samples: []
      - expr: 'ALERTS{alertname="CatalystIndexUnpublished"}'
        eval_time: 38m
        exp_samples: []
